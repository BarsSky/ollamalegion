# Ollama Load Balancer - Agent GPU Production Override
# =============================================================================
# Этот файл содержит production-настройки для GPU-агента.
# Основной GPU-образ теперь собирается через --target agent-gpu в
# docker/agent/Dockerfile и запускается через docker-compose.agent.yml
# с профилем --profile gpu.
#
# Использование (стандартное):
#   docker compose -f docker-compose.agent.yml --profile gpu up -d --build
#
# Использование с оверлеем (host-сеть, кастомные лимиты):
#   docker compose -f docker-compose.agent.yml -f docker-compose.agent.gpu.yml --profile gpu up -d --build
#
# Требования:
#   - NVIDIA Container Toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   - Docker Engine 20.10+ с BuildKit enabled
#   - nvidia-container-runtime настроен как default runtime или через --gpus

services:
  agent-gpu:
    # Раскомментируйте для работы в host-сети (прямой доступ к GPU и сети хоста)
    # ПРЕДУПРЕЖДЕНИЕ: host-сеть обходит изоляцию контейнера, используйте только в доверенной среде
    # network_mode: host

    # Дополнительные переменные окружения для production
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      METRICS_INTERVAL: ${METRICS_INTERVAL:-10}
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-10}

    # Увеличенные resource limits для production GPU-ноды
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 1024M
        reservations:
          cpus: '2'
          memory: 256M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]