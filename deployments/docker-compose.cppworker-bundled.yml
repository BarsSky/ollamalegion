# Ollama Legion — bundled compose для cppworker-gpu + balancer + webui
#
# Только 3 сервиса: balancer, cppworker-gpu, webui. Без cpu/stub, без agent.
# Клиенты (Cline/OpenWebUI и т.п.) подключаются ТОЛЬКО к балансировщику
# на порту 18080 (OpenAI-совместимый API).
#
# CppWorker автоматически регистрируется в балансировщике через
# POST /api/v1/backends (если CPPWORKER_BALANCER_URL задан). Если
# балансировщик недоступен на старте cppworker — он продолжает работать
# в standalone-режиме и принимает запросы напрямую на порту 18092.
#
# Запуск:
#   cd deployments
#   cp .env.bundled.example .env.bundled
#   docker compose -f docker-compose.cppworker-bundled.yml --env-file .env.bundled up -d --build
#
# Или используйте готовый скрипт:
#   ../scripts/start-bundled.sh   (Linux/Mac/WSL)
#   ..\scripts\start-bundled.ps1  (Windows PowerShell)

name: ollama-legion-cppworker-bundled

services:
  loadbalancer:
    build:
      context: ..
      dockerfile: docker/balancer/Dockerfile
    image: ollama-legion/balancer:cppworker-bundled
    container_name: ol-bundled-balancer
    restart: unless-stopped
    ports:
      # OpenAI-совместимый API для клиентов (Cline/OpenWebUI/anything-llm)
      - "${LB_PORT:-18080}:18080"
      # admin API (требует X-API-Token)
      - "${LB_ADMIN_PORT:-18081}:18081"
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=${LB_LOG_LEVEL:-info}
      - LB_CONFIG_PATH=/app/config/config.json
      - LB_API_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-token}
      # n_ctx auto-reload (ENV overrides config.json)
      - LB_NCTX_RELOAD_ENABLED=${LB_NCTX_RELOAD_ENABLED:-true}
      - LB_NCTX_RELOAD_MAX_N_CTX=${LB_NCTX_RELOAD_MAX_N_CTX:-131072}
      # Safety 0.95 вместо 0.85: для Gemma-4 (max_vram_n_ctx=40K, required=52K)
      # при 0.85 reload reject'ится, при 0.95 влезает.
      - LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR=${LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR:-0.95}
      - LB_NCTX_RELOAD_TIMEOUT_SEC=${LB_NCTX_RELOAD_TIMEOUT_SEC:-120}
    volumes:
      - ../config:/app/config:ro
      - balancer_data:/app/data
    networks:
      - ol-bundled-net
    healthcheck:
      # Liveness probe — всегда 200 OK, пока HTTP-сервер балансировщика жив.
      # Не зависит от состояния бэкендов, поэтому не уходит в restart loop,
      # когда cppworker ещё не успел зарегистрироваться. Глубокая проверка
      # доступна через /api/v1/health (возвращает 503 в degraded).
      test: ["CMD", "curl", "-fsS", "http://localhost:18081/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  cppworker-gpu:
    build:
      context: ..
      dockerfile: docker/cppworker/Dockerfile.gpu
      args:
        CUDA_ARCH: ${CUDA_ARCH:-all}
    # Тэг образа зависит от CUDA_ARCH:
    #   "all"       -> ollama-legion/cppworker:gpu-arch_all
    #   "86"        -> ollama-legion/cppworker:gpu-86
    #   "75;86;89"  -> ollama-legion/cppworker:gpu-75-86-89
    image: ollama-legion/cppworker:gpu-${CPPWORKER_GPU_TAG:-arch_all}
    container_name: ol-bundled-cppworker-gpu
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      # core HTTP
      - CPPWORKER_HOST=0.0.0.0
      - CPPWORKER_PORT=18092
      - CPPWORKER_MODELS_DIR=/app/models
      # defaults for model load
      # ЕДИНЫЙ ИСТОЧНИК ИСТИНЫ: config/cppworker-defaults.json (монтируется в /app/config/).
      # cppworker читает его при старте, WebUI пишет через API.
      # .env-переменные ниже — ОВЕРРАЙДЫ поверх JSON (приоритет: env > JSON > DefaultConfig).
      # Если .env.bundled не задаёт CPPWORKER_* — используется fallback (после :-).
      # n_ctx: 32768 — достаточно для длинных диалогов с запасом ~25000 токенов на ответ.
      # Балансировщик динамически читает реальный n_ctx загруженной модели
      # из метрик (Tier 3 в maxNumCtxForModel). Клампинг в балансировщике
      # использует contextSize из /api/models, а не это значение.
      # Для 8GB VRAM cppworker может снизить n_ctx при загрузке (RAM fallback).
      - CPPWORKER_CTX_SIZE=${CPPWORKER_CTX_SIZE:-32768}
      - CPPWORKER_BATCH_SIZE=${CPPWORKER_BATCH_SIZE:-512}
      # 20 = partial offload (рекомендуется для 8GB). 42 = all GPU
      # (требует >10GB VRAM). 0 = CPU only.
      - CPPWORKER_GPU_LAYERS=${CPPWORKER_GPU_LAYERS:-20}
      - CPPWORKER_FLASH_ATTN_TYPE=${CPPWORKER_FLASH_ATTN_TYPE:--1}
      - CPPWORKER_N_THREADS=${CPPWORKER_N_THREADS:-0}
      - CPPWORKER_NUMA=${CPPWORKER_NUMA:-false}
      - CPPWORKER_USE_MMAP=${CPPWORKER_USE_MMAP:-true}
      # RAM fallback: auto-reload model with larger n_ctx via mmap/RAM
      # when VRAM is insufficient (e.g. OpenWebUI requests num_ctx=16384).
      - CPPWORKER_RAM_FALLBACK_N_CTX=${CPPWORKER_RAM_FALLBACK_N_CTX:-true}
      # -2 = AUTO-расчёт gpu_layers для 19GB+ моделей на 24GB VRAM.
      # Требует CPPWORKER_AUTO_OFFLOAD=true (см. ниже).
      - CPPWORKER_RAM_FALLBACK_GPU_LAYERS=${CPPWORKER_RAM_FALLBACK_GPU_LAYERS:--2}
      - CPPWORKER_RAM_FALLBACK_MAX_N_CTX=${CPPWORKER_RAM_FALLBACK_MAX_N_CTX:-128000}
      # Auto offload: при загрузке модели проверяет размер .gguf файла vs
      # доступную VRAM. Если не влезает — auto-рассчитывает число GPU-слоёв.
      # Решает проблему OOM на 19GB модели + n_ctx=32K + A10 (24GB).
      - CPPWORKER_AUTO_OFFLOAD=${CPPWORKER_AUTO_OFFLOAD:-true}
      # AutoTuneNCtx: при RAM-fallback reload вычисляет максимальный n_ctx,
      # который помещается в VRAM (с учётом partial offload через mmap в RAM).
      # Решает: «Cline прислал 53K prompt, требуется n_ctx=53K, VRAM=8GB» →
      # cppworker перезагружает модель с gpu_layers=0 (mmap в RAM) и
      # n_ctx=максимально возможный (например 32K), чтобы inference прошёл
      # без кода 3 «prompt too long».
      - CPPWORKER_AUTO_TUNE_NCTX=${CPPWORKER_AUTO_TUNE_NCTX:-true}
      # auth
      - API_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-token}
      # auto-registration в балансировщике
      # По умолчанию используем DNS-имя loadbalancer внутри compose-сети.
      # Для регистрации по IP задайте в .env.bundled: BALANCER_URL=http://<IP>:18081
      - CPPWORKER_BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - CPPWORKER_BALANCER_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-token}
      # Рекламируемый host: по умолчанию DNS-имя cppworker-gpu внутри compose-сети.
      # Для IP-режима задайте CPPWORKER_ADVERTISE_IP или оставьте DNS-имя.
      - CPPWORKER_ADVERTISE_HOST=${CPPWORKER_ADVERTISE_HOST:-cppworker-gpu}
      - CPPWORKER_ADVERTISE_PORT=18092
      - CPPWORKER_REGISTER_NAME=cppworker-gpu-bundled
      - CPPWORKER_REGISTER_RETRY_INTERVAL=15s
      - CPPWORKER_REGISTER_HEARTBEAT=60s
      - CPPWORKER_REGISTER_GPU_MODE=gpu
      # HF auto-download ОТКЛЮЧЁН — пользователь сам управляет моделями
      - HF_AUTO_DOWNLOAD_REPO=
      - HF_AUTO_DOWNLOAD_FILE=
    volumes:
      - ../models:/app/models:rw
      - ../config:/app/config:rw
      - cppworker_cache:/app/.cache
    ports:
      # Прямой доступ к cppworker (для отладки и обхода балансировщика)
      - "${CPPWORKER_GPU_PORT:-18092}:18092"
    networks:
      - ol-bundled-net
    healthcheck:
      test: ["CMD", "/app/cppworker", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      loadbalancer:
        condition: service_healthy

  webui:
    build:
      context: ..
      dockerfile: docker/webui/Dockerfile
    image: ollama-legion/webui:cppworker-bundled
    container_name: ol-bundled-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-18083}:80"
    environment:
      - LB_API_URL=http://loadbalancer:18081
      - LB_OLLAMA_URL=http://loadbalancer:18080
      - WEBUI_PORT=80
    networks:
      - ol-bundled-net
    depends_on:
      loadbalancer:
        condition: service_healthy

networks:
  ol-bundled-net:
    driver: bridge
    name: ollama-legion-bundled-net

volumes:
  balancer_data:
  cppworker_cache: