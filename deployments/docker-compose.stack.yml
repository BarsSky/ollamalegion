# =============================================================================
# OllamaLegion — единый docker-compose для всех сценариев запуска
# =============================================================================
#
# ОДИН ФАЙЛ, ТРИ СЦЕНАРИЯ (через профили). В deployments/ исторически лежало
# 19 compose-файлов, где один и тот же сервис описывался по-разному, а часть
# переменных не читалась кодом вовсе (см. «ИМЕНА ПЕРЕМЕННЫХ» ниже). Здесь один
# источник правды; старые файлы оставлены, но новым стекам нужен этот.
#
# ─────────────────────────────────────────────────────────────────────────────
# СЦЕНАРИЙ 1. Всё на одной машине: cppworker + agent + balancer + webui
# ─────────────────────────────────────────────────────────────────────────────
#   cd deployments
#   cp .env.bundled-with-agent.example .env.bundled-with-agent   # первый раз
#   # в deployments/.env задать CPPWORKER_API_TOKEN (единый токен стека)
#   docker compose -f docker-compose.stack.yml --profile full up -d --build
#
#   Клиенты (OpenWebUI/Cline) → http://<хост>:18080
#   WebUI оператора           → http://<хост>:18083
#   Admin API                 → http://<хост>:18081
#
#   ТЕКСТ + КАРТИНКИ В ОДНОМ СТЕНДЕ (R-Image Phase 8). Профиль full поднимает
#   ОБА пула бэкендов за ОДНИМ балансером:
#     cppworker-gpu (llama_cpp, :18092) — текст;
#     imageworker   (image_cpp,  :18093) — генерация изображений (sd.cpp).
#   Оба регистрируются в балансере сами (метка auto-registered), поэтому в WebUI
#   и Monitor видны как два разных типа бэкендов одного кластера; трафик
#   расходится по типу запроса: текст → llama_cpp, /v1/images/* и /sdapi/v1/* →
#   image_cpp. OpenAI-поверхность для картинок — http://<хост>:18079.
#   Проверка после старта:
#     curl -s localhost:18081/api/v1/backends | jq '.backends[] | {id, type}'
#     curl -s localhost:18079/v1/images/generations -H 'Content-Type: application/json' \
#          -d '{"model":"sd-cpp-local","prompt":"a cat"}'
#   Модели картинок — это КАТАЛОГИ-bundle'ы в ${MODELS_DIR}/image/<имя>/; каталог
#   общий с текстовыми .gguf (../models), поэтому один том моделей на весь стенд.
#   Готовый смоук этого сценария: scripts/docker-stack-smoke.ps1.
#
# ─────────────────────────────────────────────────────────────────────────────
# СЦЕНАРИЙ 2. Только бэкенд: cppworker + agent (балансер уже есть на другой машине)
# ─────────────────────────────────────────────────────────────────────────────
#   В .env.bundled-with-agent задать ДВЕ вещи:
#     BALANCER_URL=http://<хост-балансера>:18081   # ADMIN API, НЕ 18080
#     BACKEND_HOST=<адрес этой машины, видимый С балансера>
#   docker compose -f docker-compose.stack.yml --profile worker up -d
#
#   Agent зарегистрирует cppworker в удалённом балансере и будет слать метрики.
#   Балансер начнёт проксировать инференс на BACKEND_HOST:18092 — этот порт
#   обязан быть доступен с машины балансера (в сценарии 1 он нужен только
#   внутри сети, здесь — наружу).
#
# ─────────────────────────────────────────────────────────────────────────────
# СЦЕНАРИЙ 3. Только управление: balancer + webui (бэкенды подключатся сами)
# ─────────────────────────────────────────────────────────────────────────────
#   docker compose -f docker-compose.stack.yml --profile balancer up -d
#
#   Бэкенды (cppworker+agent на других машинах) регистрируются сами, если у них
#   задан BALANCER_URL=http://<этот-хост>:18081. Пока их нет,
#   GET /api/v1/backends вернёт пустой список.
#
# ═════════════════════════════════════════════════════════════════════════════
# ⚠ ИМЕНА ПЕРЕМЕННЫХ: что читает код (проверено по исходникам)
# ═════════════════════════════════════════════════════════════════════════════
# В проекте встречались имена, которые КОД НЕ ЧИТАЕТ: переменная выглядит
# заданной, но не влияет ни на что. Правильные имена:
#
#   agent (cmd/agent/main.go):
#     ✅ BACKEND_TYPE            ❌ AGENT_BACKEND_TYPE   (иначе бэкенд = Ollama!)
#     ✅ CPPWORKER_URL           ❌ AGENT_CPPWORKER_URL
#     ✅ NODE_LABELS             ❌ AGENT_NODE_LABELS
#     ✅ GPU_MODE                ❌ AGENT_MODE
#     ✅ COLLECT_INTERVAL        ❌ AGENT_COLLECT_INTERVAL
#     ✅ HEARTBEAT_INTERVAL      ❌ AGENT_HEARTBEAT_INTERVAL
#     ✅ AGENT_CPPWORKER_HOST / AGENT_CPPWORKER_PORT (эти читаются)
#     ✅ BALANCER_URL / BALANCER_TOKEN / AGENT_ID / AGENT_PORT /
#        AGENT_PUBLIC_HOST / AGENT_MAX_MODELS / AGENT_MAX_CONCURRENT_REQUESTS /
#        AGENT_WEIGHT / NVML_ENABLED
#     ❌ AGENT_BACKEND_ID / AGENT_REGISTER_GPU_MODE — не читаются вовсе
#
#   cppworker (cmd/cppworker, internal/cppbackend):
#     ✅ CPPWORKER_* , API_TOKEN, CPPWORKER_BALANCER_URL,
#        CPPWORKER_BALANCER_TOKEN, CPPWORKER_ADVERTISE_HOST
#     ❌ CPPWORKER_ADVERTISED_PORT — не читается; порт, по которому балансер
#        доедет до бэкенда, задаётся через AGENT_CPPWORKER_PORT
#
#   balancer:
#     ✅ LB_* (см. .env.bundled-with-agent.example), CPPWORKER_API_TOKEN,
#        CPPWORKER_URL
#     ❌ BALANCER_PORT / BALANCER_API_PORT — порты берутся из
#        config/config.json (loadBalancer.port/.apiPort) или флагами
#        -port/-api-port, а не из окружения
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ ПОРЯДОК ПЕРЕМЕННЫХ: `environment:` ПЕРЕОПРЕДЕЛЯЕТ `env_file`
# ─────────────────────────────────────────────────────────────────────────────
# Compose сначала подставляет env_file, затем НАКЛАДЫВАЕТ environment. Поэтому
# строка вида `- LB_FOO=${LB_FOO:-}` в environment ЗАТИРАЕТ значение из
# .env.bundled-with-agent пустой строкой: интерполяция `${...}` читает только
# deployments/.env, где таких переменных нет. Правило: переключатель задаётся
# ЛИБО в .env.bundled-with-agent (и не упоминается в environment), ЛИБО в
# environment с дефолтом из .env. Ниже переключатели намеренно не дублируются.
#
# ─────────────────────────────────────────────────────────────────────────────
# 🐳 СВОЙ РЕПОЗИТОРИЙ ОБРАЗОВ: одна переменная IMAGE_REGISTRY
# ─────────────────────────────────────────────────────────────────────────────
# Все четыре образа берут префикс из `IMAGE_REGISTRY` (deployments/.env):
#
#   IMAGE_REGISTRY=                        → локальные образы (по умолчанию):
#                                            ollama-legion/balancer:<тег>
#   IMAGE_REGISTRY=local-docker-hub:5000/  → local-docker-hub:5000/ollama-legion/balancer:<тег>
#
# ⚠️ СЛЭШ НА КОНЦЕ ОБЯЗАТЕЛЕН. Compose — не язык с нормализацией путей: он
# склеивает строки буквально, и без слэша получится
# `local-docker-hub:5000ollama-legion/balancer` — невалидная ссылка. Скрипты
# сборки (scripts/lib-image-registry.ps1 → Get-ImageRegistryPrefix) слэш
# добавляют сами и значения-заглушки (`local`, `docker.io`, `index.docker.io`)
# превращают в пустой префикс.
# =============================================================================

name: ollama-legion-stack

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # balancer — точка входа для клиентов (OpenAI + Ollama API) и admin API
  # Профили: balancer | full
  # ═══════════════════════════════════════════════════════════════════════════
  loadbalancer:
    image: ${IMAGE_REGISTRY:-}ollama-legion/balancer:${BALANCER_TAG:-r83-submodule-v22}
    container_name: ol-stack-balancer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LB_PORT:-18080}:18080"        # клиентский API (OpenWebUI, Cline)
      - "${LB_ADMIN_PORT:-18081}:18081"  # admin API (регистрация, метрики, WebUI)
      # R-Image (2026-09-27): OpenAI-поверхность image-генерации (/v1/images/*,
      # /v1/images/generations|edits|variations). Внутри контейнера порт 18079
      # (loadBalancer.openAIPort в config.json; env LB_OPENAI_PORT, дефолт 18079);
      # здесь меняется только ВНЕШНИЙ порт — как у LB_PORT выше.
      - "${LB_OPENAI_PORT:-18079}:18079"
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=${LB_LOG_LEVEL:-info}
      - LB_CONFIG_PATH=/app/config/config.json
      # R83 (2026-09-28): версия запущенного образа — в первой шапке логов.
      # Значение берётся из того же тега, что и image выше, поэтому лог всегда
      # честно отвечает на вопрос «а точно ли в контейнере новая сборка?».
      - APP_VERSION=${BALANCER_TAG:-r83-submodule-v22}
      # ЕДИНЫЙ токен стека. Обязан совпадать с:
      #   cppworker -> CPPWORKER_API_TOKEN / API_TOKEN
      #   agent     -> BALANCER_TOKEN
      #   webui     -> API_TOKEN
      - LB_API_TOKEN=${CPPWORKER_API_TOKEN:?задайте CPPWORKER_API_TOKEN в deployments/.env}
      # R83 (2026-09-29): вместимость бэкенда = ФАКТИЧЕСКОЕ число слотов модели
      # (cppworker отдаёт max_slots в /api/models). Так балансер пропускает столько
      # параллельных запросов, сколько слотов заведено при загрузке (parallel=2 →
      # два одновременно), а не сериализует их по одному. Значение живёт в
      # deployments/.env; по умолчанию выключено (прежнее поведение).
      - LB_CAPACITY_FROM_MODEL_SLOTS=${LB_CAPACITY_FROM_MODEL_SLOTS:-false}
      - LB_NCTX_RELOAD_ENABLED=${LB_NCTX_RELOAD_ENABLED:-true}
      - LB_NCTX_RELOAD_MAX_N_CTX=${LB_NCTX_RELOAD_MAX_N_CTX:-131072}
      - LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR=${LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR:-0.95}
      - LB_NCTX_RELOAD_TIMEOUT_SEC=${LB_NCTX_RELOAD_TIMEOUT_SEC:-300}
      - LB_NCTX_PREFLIGHT_ENABLED=${LB_NCTX_PREFLIGHT_ENABLED:-true}
      - LB_NCTX_PREFLIGHT_ASYNC_RELOAD=${LB_NCTX_PREFLIGHT_ASYNC_RELOAD:-true}
      - LB_NCTX_PREFLIGHT_ASYNC_RETRY_AFTER_SEC=${LB_NCTX_PREFLIGHT_ASYNC_RETRY_AFTER_SEC:-30}
      - LB_NCTX_PREFLIGHT_MAX_WAIT_SEC=${LB_NCTX_PREFLIGHT_MAX_WAIT_SEC:-1800}
      - LB_NCTX_PREFLIGHT_WAIT_MULTIPLIER=${LB_NCTX_PREFLIGHT_WAIT_MULTIPLIER:-3}
      - LB_NCTX_PREFLIGHT_WAIT_BUFFER_SEC=${LB_NCTX_PREFLIGHT_WAIT_BUFFER_SEC:-300}
      # Phase 8 (2026-10-03): где балансер хранит профили image-моделей.
      #
      # ЗАЧЕМ ЯВНО. По умолчанию стор пишет в config/image-model-profiles.json,
      # то есть в /app/config — а он смонтирован ТОЛЬКО ДЛЯ ЧТЕНИЯ (`:ro` ниже).
      # Сохранение профиля из WebUI падало бы на read-only файловой системе: в
      # едином стенде оператор не смог бы ни создать, ни поправить профиль
      # image-модели. /app/data — записываемый том (balancer_data).
      - LB_IMAGE_MODEL_PROFILES_PATH=${LB_IMAGE_MODEL_PROFILES_PATH:-/app/data/image-model-profiles.json}
      # Сколько ждать авто-загрузку модели, прежде чем отдать 503 «попробуйте
      # позже». Для 27B на A10/3070 загрузка 3–8 минут, поэтому дефолт 900 с
      # (в коде дефолт 180 с — его мало). 0 = не ждать вовсе.
      - LB_AUTO_LOAD_WAIT_SEC=${LB_AUTO_LOAD_WAIT_SEC:-900}
      # Переключатели поведения (LB_OPENAI_AUTO_STREAM, LB_AUTO_LOAD_ASYNC,
      # LB_AUTO_CONTINUE_*, LB_GPU_HEADROOM_PERCENT) НЕ дублируются здесь —
      # они задаются в .env.bundled-with-agent (см. шапку про порядок).
    env_file:
      - .env.bundled-with-agent
    volumes:
      - ../config:/app/config:ro
      - balancer_data:/app/data
    networks: [ol-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18081/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: ["balancer", "full"]

  # ═══════════════════════════════════════════════════════════════════════════
  # webui — дашборд оператора (мониторинг, загрузка моделей, настройки)
  # Профили: balancer | full
  # ═══════════════════════════════════════════════════════════════════════════
  webui:
    image: ${IMAGE_REGISTRY:-}ollama-legion/webui:${WEBUI_TAG:-r83-submodule-v22}
    container_name: ol-stack-webui
    restart: unless-stopped
    depends_on:
      loadbalancer:
        condition: service_healthy
    ports:
      - "${WEBUI_PORT:-18083}:80"
    environment:
      - API_TOKEN=${CPPWORKER_API_TOKEN:?задайте CPPWORKER_API_TOKEN в deployments/.env}
      - LB_API_URL=http://loadbalancer:18081
      - LOG_LEVEL=${WEBUI_LOG_LEVEL:-info}
    networks: [ol-net]
    profiles: ["balancer", "full"]

  # ═══════════════════════════════════════════════════════════════════════════
  # cppworker-gpu — инференс llama.cpp на GPU
  # Профили: worker | full
  # ═══════════════════════════════════════════════════════════════════════════
  cppworker-gpu:
    image: ${IMAGE_REGISTRY:-}ollama-legion/cppworker:gpu-${CPPWORKER_GPU_TAG:-r83-submodule-v22}
    container_name: ol-stack-cppworker-gpu
    restart: unless-stopped
    runtime: nvidia
    environment:
      - CPPWORKER_HOST=0.0.0.0
      - CPPWORKER_PORT=18092
      - CPPWORKER_MODELS_DIR=/app/models
      # R83 (2026-09-28): версия — в стартовом логе cppworker.
      - APP_VERSION=${CPPWORKER_GPU_TAG:-r83-submodule-v22}
      # Регистрацию бэкенда делает ТОЛЬКО agent. Если включить и Go-side
      # регистрацию, в балансере появится ДВА бэкенда на один endpoint.
      - CPPWORKER_REGISTER_DISABLE=true
      - API_TOKEN=${CPPWORKER_API_TOKEN:?задайте CPPWORKER_API_TOKEN в deployments/.env}
      - CPPWORKER_API_TOKEN=${CPPWORKER_API_TOKEN:?задайте CPPWORKER_API_TOKEN в deployments/.env}
      # Балансер нужен cppworker для pull-based sync профилей моделей.
      # В сценарии 2 сюда попадает удалённый адрес из BALANCER_URL.
      - CPPWORKER_BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - CPPWORKER_BALANCER_TOKEN=${CPPWORKER_API_TOKEN:?задайте CPPWORKER_API_TOKEN в deployments/.env}

      # ─── Модель и память ─────────────────────────────────────────────────
      - CPPWORKER_CTX_SIZE=${CPPWORKER_CTX_SIZE:-32768}
      - CPPWORKER_BATCH_SIZE=${CPPWORKER_BATCH_SIZE:-512}
      # Сколько слоёв на GPU: 20 для 8 GB (RTX 3070) + 27B Q4; 99 для 24 GB.
      - CPPWORKER_GPU_LAYERS=${CPPWORKER_GPU_LAYERS:-20}
      - CPPWORKER_FLASH_ATTN_TYPE=${CPPWORKER_FLASH_ATTN_TYPE:--1}
      - CPPWORKER_N_THREADS=${CPPWORKER_N_THREADS:-0}
      - CPPWORKER_NUMA=${CPPWORKER_NUMA:-false}
      - CPPWORKER_USE_MMAP=${CPPWORKER_USE_MMAP:-true}
      - CPPWORKER_AUTO_OFFLOAD=${CPPWORKER_AUTO_OFFLOAD:-true}
      - CPPWORKER_AUTO_TUNE_NCTX=${CPPWORKER_AUTO_TUNE_NCTX:-true}
      - CPPWORKER_RAM_FALLBACK_N_CTX=${CPPWORKER_RAM_FALLBACK_N_CTX:-true}
      - CPPWORKER_RAM_FALLBACK_GPU_LAYERS=${CPPWORKER_RAM_FALLBACK_GPU_LAYERS:--2}
      - CPPWORKER_RAM_FALLBACK_MAX_N_CTX=${CPPWORKER_RAM_FALLBACK_MAX_N_CTX:-128000}
      - CPPWORKER_DEFAULT_ENABLE_REASONING=${CPPWORKER_DEFAULT_ENABLE_REASONING:-false}
      - CPPWORKER_ENABLE_REASONING=${CPPWORKER_ENABLE_REASONING:-false}
      - CPPWORKER_ENABLE_BATCHED_PARALLEL=${CPPWORKER_ENABLE_BATCHED_PARALLEL:-false}
      # Параллельные слоты модели (n_parallel / n_seq_max). 0 = одиночный слот.
      #
      # R83 (2026-09-29): раньше эта переменная вообще не доезжала до
      # контейнера, поэтому «выделить кеш под несколько запросов» из compose
      # было нельзя — только полем `parallel` в запросе загрузки/профиле.
      # В контейнере код читает именно CPPWORKER_N_PARALLEL
      # (internal/cppbackend/config.go: LoadConfigFromEnv).
      #
      # Что реально делает CPPWORKER_N_PARALLEL (проверено на стенде, c/llama.cpp
      # gguf-v0.19.0-1369, kv_unified=false):
      #   llama_context: n_ctx_seq = GGML_PAD(n_ctx / n_seq_max, 256)
      # То есть слоты НЕ умножают KV-cache и НЕ увеличивают расход VRAM — они
      # ДЕЛЯТ окно контекста между клиентами:
      #   contextSize=8192 + parallel=2 → n_ctx=8192, n_ctx_seq=4096
      #   свободная VRAM: parallel=1 → 5197 МБ, 2 → 5197 МБ, 3 → 5191 МБ
      # Чтобы каждый клиент получил нужное окно, задайте суммарное окно
      # = окно × слоты либо поле `contextPerSeq` («окно на клиента»).
      #
      # ВАЖНО: AGENT_MAX_CONCURRENT_REQUESTS задавать НЕ нужно — cppworker сам
      # сообщает балансеру свою вместимость (effectiveNParallel).
      - CPPWORKER_N_PARALLEL=${CPPWORKER_N_PARALLEL:-0}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${MODELS_DIR:-../models}:/app/models
      - cppworker_cache:/app/.cache
    ports:
      # Порт инференса. Наружу обязателен в сценарии 2 (балансер на другой
      # машине); в сценарии 1 достаточно внутри сети, но проброс не мешает.
      - "${CPPWORKER_PORT_HOST:-18092}:18092"
    networks: [ol-net]
    healthcheck:
      test: ["CMD", "/app/cppworker", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["worker", "full"]

  # ═══════════════════════════════════════════════════════════════════════════
  # imageworker — R-Image: генерация изображений (sdworker → sd-server/sd.cpp)
  # Профили: worker | full
  # ═══════════════════════════════════════════════════════════════════════════
  # ЧТО ЭТО. Отдельный бэкенд типа image_cpp (порт 18093): свой каталог
  # моделей-bundle'ов, свой движок (stable-diffusion.cpp), своя OpenAI/A1111
  # поверхность. Балансер маршрутизирует на него ТОЛЬКО image-запросы
  # (internal/balancer/backend_type_filter.go: image_cpp никогда не попадает в
  # текстовый пул и наоборот), а со своей OpenAI-поверхности (18079) отдаёт
  # /v1/images/*. Текстовый трафик сюда не уходит.
  #
  # РЕГИСТРАЦИЮ ДЕЛАЕТ САМ ВОРКЕР (Go-side, cmd/sdworker/balancer_register.go):
  # POST /api/v1/backends с backendType=image_cpp и imagePort=18093. Agent для
  # image-бэкенда НЕ нужен — он умеет только llama_cpp/ollama; метрик GPU у
  # image-бэкенда в WebUI поэтому не будет (это известное ограничение, не баг).
  #
  # ⚠️ GPU. sd.cpp НЕ выпускает Linux-CUDA-сборок (в релизе master-929 есть
  # CPU/Vulkan/ROCm, CUDA — только под Windows). Поэтому дефолт — Vulkan, а
  # драйвер NVIDIA отдаётся контейнеру через runtime: nvidia + capability
  # `graphics` (именно она монтирует nvidia_icd.json/libnvidia-glcore — без неё
  # Vulkan не увидит NVIDIA-карту). /dev/dri для NVIDIA не нужен; для AMD/Intel
  # он обязателен — тогда уберите runtime: nvidia и раскомментируйте devices
  # (готовый вариант — deployments/docker-compose.imageworker.yml).
  # CUDA-вариант: собрать образ со СВОИМ бинарём sd-server (готовых Linux-CUDA
  # релизов нет):
  #   cp build/bin/sd-server docker/imageworker/vendor/sd-server-cuda
  #   SD_SERVER_BIN=sd-server-cuda \
  #   IMAGE_WORKER_RUNTIME_BASE=nvidia/cuda:12.6.0-runtime-ubuntu24.04 \
  #   docker compose -f docker-compose.stack.yml --profile full up -d --build imageworker
  #
  # КАК ВЫКЛЮЧИТЬ (если образ не собран / GPU занят текстовой моделью):
  #   основной : docker compose -f docker-compose.stack.yml --profile full up -d --scale imageworker=0
  #   гарантированный (любая версия compose; годится и когда контейнер уже есть):
  #              docker compose -f docker-compose.stack.yml --profile full rm -sf imageworker
  #   профилем : --profile balancer (только управление) вместо --profile full
  #   насовсем : убрать сервис из этого файла
  # Обратно включить — up -d без --scale imageworker=0 (образ соберётся при --build).
  # ⚠️ У сервиса задан container_name (как у остальных сервисов стека), поэтому
  # compose не даст поднять БОЛЬШЕ одного контейнера (--scale imageworker=2
  # конфликтует по имени). Выключение (--scale ...=0) и запуск одного — работают.
  #
  # МОДЕЛИ. Bundle — это КАТАЛОГ <MODELS_DIR>/image/<имя>/ с файлами движка
  # (diffusion + VAE + text encoders) и profile.json; кладётся вручную или
  # HF-слоем воркера (кнопка image-моделей в WebUI). Пустой каталог — не ошибка:
  # воркер поднимется, /health ответит 200, генерация вернёт model_not_found.
  # ═══════════════════════════════════════════════════════════════════════════
  imageworker:
    image: ${IMAGE_REGISTRY:-}ollama-legion/imageworker:${IMAGE_WORKER_TAG:-vulkan}
    build:
      context: ..
      dockerfile: docker/imageworker/Dockerfile
      args:
        SD_SERVER_REVISION: ${SD_SERVER_REVISION:-master-929-3f8527a}
        SD_SERVER_ASSET: ${SD_SERVER_ASSET:-sd-master-3f8527a-bin-Linux-Ubuntu-24.04-x86_64-vulkan.zip}
        SD_SERVER_BIN: ${SD_SERVER_BIN:-}
        RUNTIME_BASE: ${IMAGE_WORKER_RUNTIME_BASE:-ubuntu:24.04}
    container_name: ol-stack-imageworker
    restart: unless-stopped
    # Тот же GPU-путь, что у cppworker-gpu выше: nvidia-container-runtime.
    runtime: nvidia
    environment:
      - SDWORKER_HOST=0.0.0.0
      - SDWORKER_PORT=18093
      # Внутренний порт движка (loopback внутри контейнера). Не путать с 18093:
      # наружу торчит API воркера, иначе клиенты обойдут нормализацию запросов.
      - SDWORKER_SD_SERVER_PORT=${SDWORKER_SD_SERVER_PORT:-18094}
      # Каталог bundle'ов image-моделей внутри контейнера (host: <MODELS_DIR>/image).
      - SDWORKER_IMAGE_MODELS_DIR=/app/models/image
      - SDWORKER_IMAGES_DIR=/app/data/images
      - SDWORKER_IDLE_UNLOAD_MINUTES=${SDWORKER_IDLE_UNLOAD_MINUTES:-30}
      - SDWORKER_MAX_CONCURRENT=${SDWORKER_MAX_CONCURRENT:-64}
      - SDWORKER_GENERATION_TIMEOUT_SEC=${SDWORKER_GENERATION_TIMEOUT_SEC:-600}
      - SDWORKER_PRELOAD_MODEL=${SDWORKER_PRELOAD_MODEL:-}
      # URL воркера «как его видят клиенты»: подставляется в response_format:"url".
      # Дефолт — локальный клиент на этой машине (порт опубликован ниже).
      # Для клиентов снаружи: SDWORKER_BASE_URL=http://<хост>:18093 в .env.
      - SDWORKER_BASE_URL=${SDWORKER_BASE_URL:-http://localhost:18093}
      # HF-слой image-bundle'ов (gated модели / зеркало).
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MIRROR=${HF_MIRROR:-}
      # Vulkan-ICD NVIDIA приезжает вместе с драйвером: capability `graphics`
      # ОБЯЗАТЕЛЕН (compute,utility дают только CUDA/NVML).
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      # ─── Авторегистрация в балансере (SDWORKER_* — имена из Go-кода) ───────
      # BALANCER_URL — каноническое имя стека: в сценарии 2 из .env сюда
      # попадает адрес УДАЛЁННОГО балансера, и воркер регистрируется там.
      - SDWORKER_BALANCER_URL=${SDWORKER_BALANCER_URL:-${BALANCER_URL:-http://loadbalancer:18081}}
      - SDWORKER_BALANCER_TOKEN=${SDWORKER_BALANCER_TOKEN:-${CPPWORKER_API_TOKEN:-}}
      - SDWORKER_BACKEND_ID=${SDWORKER_BACKEND_ID:-imageworker}
      # host, под которым воркер виден балансеру: DNS-имя сервиса в этой сети.
      - SDWORKER_ADVERTISE_HOST=${SDWORKER_ADVERTISE_HOST:-imageworker}
      - SDWORKER_REGISTER_DISABLE=${SDWORKER_REGISTER_DISABLE:-false}
    volumes:
      # Тот же каталог моделей, что у cppworker (../models): текстовые .gguf в
      # корне, image-bundle'ы — в image/. Внутри тома же лежат temp-загрузки
      # HF (../models/downloads) — иначе .download на 6-12 GB забивал бы слой
      # контейнера и терялся при пересоздании.
      - ${MODELS_DIR:-../models}:/app/models:rw
      # Сгенерированные картинки (response_format:"url") — забираются с хоста.
      - ${IMAGE_OUTPUT_DIR:-../data/images}:/app/data/images:rw
      - imageworker_cache:/app/.cache/huggingface
      # LoRA/ESRGAN-апскейлеры (опционально): движок сканирует каталоги в рантайме.
      # Раскомментируйте, положив файлы в ../models/lora и ../models/upscalers:
      # - ${MODELS_DIR:-../models}/lora:/app/lora:ro
      # - ${MODELS_DIR:-../models}/upscalers:/app/upscalers:ro
    ports:
      # API воркера. Публикуется наружу намеренно: response_format:"url" отдаёт
      # ссылку на этот порт, и по нему же можно ходить в обход балансера.
      - "${SDWORKER_PORT:-18093}:18093"
    networks: [ol-net]
    # Phase 8 (2026-10-03): ждём ГОТОВЫЙ балансер, а не просто «запущенный».
    # Раньше зависимости не было вовсе: воркер стартовал первым, первый POST
    # /api/v1/backends уходил в недоступный порт и повторялся через 30 с — в
    # едином стенде это выглядело как «image-бэкенд не появился в балансере».
    depends_on:
      loadbalancer:
        condition: service_healthy
    healthcheck:
      # Через сам бинарь (как у cppworker): /health отвечает 200 и без модели,
      # поэтому idle-unload не переводит контейнер в unhealthy.
      test: ["CMD", "/app/sdworker", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Дольше, чем у cppworker: первый старт движка = прогрев Vulkan.
      start_period: 60s
    profiles: ["worker", "full"]

  # ═══════════════════════════════════════════════════════════════════════════
  # agent — регистрация бэкенда в балансере + метрики GPU/RAM/CPU
  # Профили: worker | full
  # ═══════════════════════════════════════════════════════════════════════════
  agent:
    image: ${IMAGE_REGISTRY:-}ollama-legion/agent:${AGENT_TAG:-r83-submodule-v22}
    container_name: ol-stack-agent
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      cppworker-gpu:
        condition: service_healthy
    environment:
      - AGENT_ID=${AGENT_ID:-cppworker-gpu-bundled-agent}
      - AGENT_PORT=18032
      # R83 (2026-09-28): версия — в стартовой шапке агента.
      - APP_VERSION=${AGENT_TAG:-r83-submodule-v22}

      # ─── Подключение к балансеру: ADMIN API, порт 18081 ──────────────────
      # Сценарий 1: имя сервиса внутри этой сети (значение по умолчанию).
      # Сценарий 2: задать BALANCER_URL в .env.bundled-with-agent —
      #             http://<хост-балансера>:18081
      - BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - BALANCER_TOKEN=${CPPWORKER_API_TOKEN:?задайте CPPWORKER_API_TOKEN в deployments/.env}
      # R83 (2026-09-28): агент передаёт балансеру токен, который ждёт cppworker.
      # Без него балансер не может авторизоваться на защищённых эндпоинтах
      # cppworker, и правка параметров модели из WebUI падает с 401
      # «invalid or missing API token», хотя токен задан во всех .env одинаково.
      # Источник — ОДНА переменная стека: deployments/.env → CPPWORKER_API_TOKEN.
      - CPPWORKER_API_TOKEN=${CPPWORKER_API_TOKEN:?задайте CPPWORKER_API_TOKEN в deployments/.env}

      # ─── Как agent ходит в cppworker (внутри сети) ───────────────────────
      # Ранее здесь стояло AGENT_CPPWORKER_URL — код это имя НЕ читает,
      # поэтому agent не знал адрес cppworker.
      - CPPWORKER_URL=http://cppworker-gpu:18092

      # Тип бэкенда ОБЯЗАТЕЛЕН: без него бэкенд регистрируется как Ollama
      # (ранее стояло AGENT_BACKEND_TYPE — не читается кодом).
      - BACKEND_TYPE=llama_cpp

      # Что agent отдаёт балансеру как адрес бэкенда. В сценарии 1 — имя
      # сервиса; в сценарии 2 — BACKEND_HOST (адрес машины, видимый с
      # балансера). Порт должен совпадать с CPPWORKER_PORT контейнера.
      - AGENT_CPPWORKER_HOST=${BACKEND_HOST:-cppworker-gpu}
      - AGENT_CPPWORKER_PORT=${CPPWORKER_PORT:-18092}
      - AGENT_PUBLIC_HOST=${AGENT_PUBLIC_HOST:-cppworker-gpu-agent}
      - AGENT_PUBLIC_PORT=18032
      - NODE_LABELS=${NODE_LABELS:-gpu,llamacpp}

      # ─── Вместимость: сколько параллельных запросов примет бэкенд ────────
      # 0 (по умолчанию) = AUTO: агент сам спросит у cppworker его
      #   defaultNParallel (env CPPWORKER_N_PARALLEL) и сообщит балансеру
      #   ровно это значение. Так настраивается ОДНО место — слоты воркера.
      # >0 = операторский лимит: имеет приоритет и автоматикой не
      #   перезаписывается. Нужен, только если надо сознательно пропускать
      #   меньше (или больше) запросов, чем слотов у модели.
      #
      # R83-fix (2026-09-29): раньше здесь стоял дефолт 1, то есть переменная
      # ВСЕГДА была задана — и агент никогда не брал значение из cppworker.
      # При CPPWORKER_N_PARALLEL=2 это давало рассинхрон: воркер держит два
      # слота, а балансер ставит второй запрос в очередь («второй клиент
      # получил 503»). В старом комментарии фигурировало нечитаемое имя
      # CPPWORKER_PARALLEL — правильное CPPWORKER_N_PARALLEL.
      #
      # Почему нельзя завышать: cppworker с одним слотом обслуживает ОДИН
      # запрос за раз, лишние «свободные слоты» дают отказы и зависания.
      - AGENT_MAX_CONCURRENT_REQUESTS=${AGENT_MAX_CONCURRENT_REQUESTS:-0}
      - AGENT_MAX_MODELS=${AGENT_MAX_MODELS:-4}
      - AGENT_WEIGHT=${AGENT_WEIGHT:-1}

      # Ранее стояло AGENT_MODE — код читает GPU_MODE.
      - GPU_MODE=gpu
      - NVML_ENABLED=true
      # Ранее стояли AGENT_COLLECT_INTERVAL / AGENT_HEARTBEAT_INTERVAL.
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-15}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30}
      - LOG_LEVEL=${AGENT_LOG_LEVEL:-info}
      - LOG_FORMAT=text
    ports:
      - "${AGENT_PORT_HOST:-18032}:18032"
    networks: [ol-net]
    healthcheck:
      test: ["CMD", "/app/agent", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles: ["worker", "full"]

networks:
  ol-net:
    name: ol-net

volumes:
  balancer_data:
    name: ol-balancer-data
  cppworker_cache:
    name: ol-cppworker-cache
  # HF-кэш image-воркера (веса text encoders/VAE, скачанные через HF-слой).
  imageworker_cache:
    name: ol-imageworker-cache
