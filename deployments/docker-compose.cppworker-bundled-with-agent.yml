# OllamaLegion — bundled compose с sidecar-агентом метрик
# =============================================================================
#
# Этот файл расширяет deployments/docker-compose.cppworker-bundled.yml, добавляя
# сервис agent (target=agent-gpu, ENABLE_NVML=true), который собирает
# GPU/VRAM/CPU/llama.cpp-runtime метрики и регистрирует cppworker-gpu в
# балансере как отдельный backend с id "cppworker-gpu-bundled-agent"
# (hasAgent=true) — чтобы WebUI показывал реальные метрики на странице GGUF.
#
# Использование (Round 51.6, 2026-08-20):
#   cd deployments
#   cp .env.bundled-with-agent.example .env.bundled-with-agent
#   # R66d: токен задаётся в deployments/.env (CPPWORKER_API_TOKEN), а НЕ в
#   # .env.bundled-with-agent — см. блок "ПРО ТОКЕН" ниже. В .env.bundled-with-agent
#   # остаются остальные параметры (модели, GPU, порты, лимиты).
#   docker compose -f docker-compose.cppworker-bundled-with-agent.yml up -d --build
#
# ⚠️ R66d (2026-09-23): ПРО ТОКЕН (исправление прежней неверной инструкции).
#
# Токен стека ОДИН и задаётся в `deployments/.env` (рядом с этим файлом):
# CPPWORKER_API_TOKEN=<token>. Он подставляется compose'ом во все четыре сервиса:
#   balancer   -> LB_API_TOKEN
#   cppworker  -> API_TOKEN + CPPWORKER_BALANCER_TOKEN
#   agent      -> BALANCER_TOKEN
#   webui      -> API_TOKEN
#
# ПОЧЕМУ НЕ В .env.bundled-with-agent: `env_file:` только ДОБАВЛЯЕТ переменные в
# контейнер, а `environment:` в compose их ПЕРЕОПРЕДЕЛЯЕТ. Плюс `${VAR:-default}`
# интерполируется ТОЛЬКО из `.env`. Значит значение CPPWORKER_API_TOKEN из
# .env.bundled-with-agent не влияет ни на один сервис — в живом файле эта строка
# закомментирована с пояснением. Раньше инструкция говорила править именно её;
# оператор менял токен там, сервисы продолжали работать со старым значением, и
# WebUI отдавал 401 "invalid or missing API token" на load/unload и профили.
#
# Проверка согласованности (все четыре должны напечатать один и тот же хэш):
#   docker exec ol-bundled-balancer          printenv LB_API_TOKEN | sha256sum
#   docker exec ol-bundled-cppworker-gpu     printenv API_TOKEN | sha256sum
#   docker exec ol-bundled-cppworker-gpu-agent printenv BALANCER_TOKEN | sha256sum
#   docker exec ol-bundled-webui             printenv API_TOKEN | sha256sum
#
# ⚠️ Если .env.bundled-with-agent НЕ существует — `docker compose up` упадёт
# с понятной ошибкой ("env_file: .env.bundled-with-agent not found").
# Скопируйте его из примера (см. выше).
#
# Проверка:
#   curl -H "X-API-Token: $CPPWORKER_API_TOKEN" http://localhost:18081/api/v1/backends
#   # Должны быть:
#   #   - cppworker-gpu-bundled       (без агента, вес 100, fallback registration от bundled-сборки)
#   #   - cppworker-gpu-bundled-agent (с агентом, вес 100, GPU/VRAM метрики от agent)
#   # Оба ссылаются на один физический контейнер cppworker-gpu внутри compose.
#
# На странице GGUF (/api/v1/gguf/backends) de-dup логика в
# internal/api/gguf_backends_handler.go (группировка по host:port)
# автоматически склеит их в один с hasAgent=true, чтобы WebUI показывал
# реальные метрики, а не пустую заглушку.

name: ollama-legion-cppworker-bundled-with-agent

services:
  loadbalancer:
    build:
      context: ..
      dockerfile: docker/balancer/Dockerfile
    # Round 34 image (cppworker-bundled-r34) crashed after ~75min with
    # "sync: unlock of unlocked mutex" — reverted to Round 33 (stable 7h+).
    # Round 35 (r35): reload→load fallback + idleUnload disabled.
    # Round 35c (r35c): env-tunable polling timeouts (LB_NCTX_PREFLIGHT_*)
    # для моделей с auto-offload (22GB+ Qwen3.6 на 8GB VRAM, 12-15 min load).
    image: ollama-legion/balancer:r82-submodule-v19  # R78 (2026-09-24): placement policy P3 закрыт + legacy-очередь убрана. (1) GET /api/v1/metrics отдаёт блок placement (configured/enabled/fallback/operatingMode, byStrategy, degraded, notExecutable, warnings, replicationReady/Groups) — деградация видна не только в логе. (2) Автопересборка раскладки: AddBackend/RemoveBackend → schedulePlacementResync (асинхронно, т.к. callbacks менеджера репликации берут p.mu.RLock) → syncPlacementReplicationGroups + EnsureInstances — новый бэкенд получает реплику сразу. (3) Legacy QueueManager выведен из эксплуатации: удалены канал queue, пул worker'ов, processRequest и весь requeue-путь, а также dispatchRequest/waitForModelReady/DispatchResult (~300 строк); остались статистика/история (processed, completedHistory, dispatch-счётчики, maxSize как порог backpressure). Следствие: current_size в /api/v1/queue/stats = ожидающие единой очереди (раньше всегда 0), то же значение в метриках и в штрафе скоринга. Живая проверка: «queue worker started» — до 4, после 0; длинный запрос + второй через 4 с → current_size=1, X-Queue-Position: 1, X-Queue-Wait-Ms: 10932, оба 200. R76 (2026-09-24): placement policy, этап P3 — §6 плана «никогда не уходить в другую стратегию молча»: при placement.fallback=error (default) запрос со стратегией, которую сборка не исполняет (sharded/rpc — этап P2), и degraded-решение auto без auto.allowDegraded отклоняются 503 + JSON с причиной и блоком placement (отказ ДО маршрутизации, upstream не вызывается); при fallback=single запрос обслуживается обычным путём, X-LB-Placement показывает фактически исполненную стратегию (single), а заявленная — в новом заголовке X-LB-Placement-Fallback. Добавлен auto.requireHomogeneous: набор бэкендов сужается до самой большой группы с одинаковой «личностью» GPU (метка gpu:*/sm_*, иначе объём VRAM vram:<МБ>, иначе «неизвестно»), ограничение видно в reason («однородность: подходящих 2 → 1»). Живая проверка (2 заглушки с метками sm_86/sm_90): fallback=error — p3-sharded и p3-degraded получают 503 с числами/объяснением P2, заглушки 0 запросов; fallback=single — те же запросы 200 с X-LB-Placement-Fallback: sharded. R75 (2026-09-24): placement policy, этап P1.5 — auto выбирает стратегию по VRAM-fit (§4): placementFitForModel считает need ≈ размер модели × 1.25 (запас на KV/накладные; размер из профиля или из метрик загруженной модели) и проверяет каждый healthy бэкенд — «модель загружена» (влезает), «есть метрики VRAM и memoryFree >= need» (МБ→байты), «метрик VRAM нет» (CPU-only/ollama без агента → неизвестно, выбор не блокируется). auto перебирает auto.prefer (по умолчанию single): single → replicated → (sharded/rpc помечаются пропущенными, этап P2); при провале — single + degraded:true и числа в причине («need≈10.0 ГБ (веса 8.0 ГБ + запас 25%), свободно максимум 512 МБ»); неизвестный размер → single с пометкой «VRAM-fit не проверен». Группы репликации создаются и для auto-правил с prefer=replicated (minInstances ≥ 2). Живая проверка (2 заглушки, профили 4/8/30 ГБ): без метрик VRAM — single/replicated/replicated; после сообщения 512 МБ свободного VRAM — все три single + degraded с числами. R74 (2026-09-24): placement policy, этап P1 — pool и replicated исполняются ПОЛИТИКОЙ для конкретной модели, без глобального operatingMode. pool: VirtualRouter включается по strategy=pool (в т.ч. auto для алиаса) — добавлен MatchVirtualRequest (peek+rewind, возвращает имя модели), роутер создаётся и при virtualModels.enabled=true, на бэкенды доезжает физическое имя модели, в ответе X-LB-Placement: pool. replicated: группа репликации создаётся политикой (идемпотентно, при старте и при SetPlacementSettings), менеджер репликации поднимается по требованию (setupReplicationManager/ensureReplicationManager), дальше работает штатный replicationSelector, маски имён пропускаются. auto: алиас → pool, prefer=replicated + хватает бэкендов → replicated, иначе single (флаг refined; VRAM-уточнение — P1.5). Наблюдаемость: блок replication в GET /api/v1/placement (managerReady/hasGroup/candidates). Живая проверка (2 заглушки, operatingMode=standard): алиас virtual:r74pool → model=r74-physical по кругу A/B/A, r74-repl → реплики A/B/A. R73 (2026-09-24): единая очередь — Ollama-путь больше не использует legacy QueueManager/queueRequest, а ждёт слот в той же admission-очереди, что и llama.cpp-путь (waitForInferenceBackend, ключ any): те же per-session приоритеты, тот же LB_ADMISSION_WAIT_SEC, те же заголовки X-Queue-Position/X-Queue-Wait-Ms и keepalive для streaming; при таймауте 503 + Retry-After + X-Queue-Wait-Max-Sec. Backpressure (>=90% queueMaxSize) сохранён, QueueManager.RecordUnified держит processed_total и /api/v1/queue/history осмысленными. Живая проверка до/после (throwaway-стенд, вместимость 1, 4 параллельных запроса): до — 4/4 200 без заголовков очереди и admission.served=0, задержки 11.8-15.4 с; после — у 3 из 4 позиции 1/2/3 и ожидание 1.4-3.2 с, admission.served=3/waited=3, задержки 1.5-4.8 с. R72 (2026-09-24): placement policy, этап P0 — секция balancing.placement (стратегии single/pool/replicated/sharded/rpc/auto для КОНКРЕТНОЙ модели вместо одного глобального operatingMode, правила по модели/маске и по классу размера, fallback, X-LB-Placement), резолвер ResolvePlacement (запрос → модель → класс → глобальный дефолт) с reason/source/executable, валидация в ValidateConfigOnLoad + лог при старте, наблюдаемость GET /api/v1/placement + заголовки X-LB-Placement/X-LB-Placement-Source. Поведение маршрутизации не изменилось (исполнение стратегий — этап P1). R71 (2026-09-24): heartbeat агента больше НЕ пишет вместимость бэкенда — раньше балансер отдавал агенту runtimeMaxConcurrentRequests, агент возвращал его же в следующем heartbeat (раз в ~3 с), и узел с n_parallel=1 жил с порогом admission-очереди 4 (операторский PUT /limits откатывался за 3 с). Теперь вместимость — это MaxConcurrentReqs ноды (саморегистрация cppworker) либо лимит оператора; введено единое правило EffectiveMaxConcurrentRequests (slot manager, tryAcquireSlot, least-loaded, метрики, /api/v1/backends), runtime-лимиты и признак «от ноды» восстанавливаются в LoadState, старый state.json самоисцеляется. R69 (2026-09-23): совместимость с реальным Cline — max_output_tokens в теле запроса больше не отбивается (preflight читает его как num_predict), AutoTune не «оптимизирует» n_ctx ниже клиентского запроса (иначе ping-pong reload 65536→38385→65536 и 503 на каждом запросе). R67b (2026-09-23): admission-очередь слотов вместо «резкого 503» на занятых слотах (LB_ADMISSION_WAIT_SEC, X-Queue-Position/X-Queue-Wait-Ms, /api/v1/queue/stats → admission), различение пользователей/чатов OpenWebUI по X-User-Id/X-OpenWebUI-User-Id/телу+metadata (раньше все пользователи одного OpenWebUI слипались в одну сессию), per-session справедливость очереди, activeRequests бэкенда отражает реальную нагрузку. R67a: ожидание авто-загрузки модели (LB_AUTO_LOAD_WAIT_SEC, первый же запрос обслуживается), потолок n_ctx по типу KV-cache и свободной VRAM (CPPWORKER_VRAM_OVERHEAD_MB), частичный PUT профиля модели больше не сбрасывает поля. R66d (2026-09-23): длина ответа >60s больше не режется WriteTimeout'ом (load/apply/reload), HTTP-слой не теряет batchSize/flashAttn/useMmap/kvCacheType, профиль модели применяется при первой загрузке, apply профиля шлёт в cppworker токен+gpuLayers+force. R66a (2026-09-21, ba2291c): native Ollama /api/chat response passthrough fix (pre-R66a the balancer re-translated the already-native Ollama body → synthetic 502 "upstream returned empty response"). Supersedes r66-submodule-v1 (Round 66 / R65d consolidated, 15ea588 + eee0e3e + 120ba02).
    #   R54.2: AutoTune master switch (Balancing.AutoTune, default true) +
    #          per-model "autoTune": false override (LlamaCppModelProfile.AutoTune).
    #          Manual control: user can disable AutoTune globally or per-model.
    #   R54.1: AutoTune sub-optimal detection (foundation).
    #   R53.6: streamTimeout abort in SSE loop.
    #   R53.5: when proxyRequest* fails mid-stream, emit final done:true chunk.
    #   R53.4: defer recover() for cascading reload panic.
    #   R53.1: R51.3 double-done fix.
    container_name: ol-bundled-balancer
    restart: unless-stopped
    ports:
      - "${LB_PORT:-18080}:18080"
      - "${LB_ADMIN_PORT:-18081}:18081"
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=${LB_LOG_LEVEL:-info}
      - LB_CONFIG_PATH=/app/config/config.json
      # R66d: единственный источник токена — CPPWORKER_API_TOKEN в
      # deployments/.env (см. блок "ПРО ТОКЕН" в шапке файла). Значение ниже
      # обязано совпадать с API_TOKEN/CPPWORKER_BALANCER_TOKEN/BALANCER_TOKEN
      # остальных сервисов — все пять мест читают одну переменную.
      - LB_API_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
      - LB_NCTX_RELOAD_ENABLED=${LB_NCTX_RELOAD_ENABLED:-true}
      - LB_NCTX_RELOAD_MAX_N_CTX=${LB_NCTX_RELOAD_MAX_N_CTX:-131072}
      - LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR=${LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR:-0.95}
      - LB_NCTX_RELOAD_TIMEOUT_SEC=${LB_NCTX_RELOAD_TIMEOUT_SEC:-300}
      # Round 38 (2026-08-18): resource reservation headroom.
      # LB_GPU_HEADROOM_PERCENT: slot manager reserves this % of VRAM.
      # 5% = 95% threshold (default). Pre-Round 38: 15% = 85% (blocked admin
      # PUT when Qwen3.6 used 91.5% VRAM on 8GB).
      - LB_GPU_HEADROOM_PERCENT=${LB_GPU_HEADROOM_PERCENT:-5}
      - LB_RAM_HEADROOM_PERCENT=${LB_RAM_HEADROOM_PERCENT:-10}
      # Round 34 follow-up: preflight must be ENABLED for async reload to work.
      # Without this, preflight helper short-circuits with PreflightEnabled=false
      # → Cline 65K → 413 sync instead of 503+Retry-After.
      - LB_NCTX_PREFLIGHT_ENABLED=${LB_NCTX_PREFLIGHT_ENABLED:-true}
      # Round 31 #2 (2026-08-09): async preflight reload — НЕ блокируем клиента
      # на долгой перезагрузке, отдаём 503+Retry-After. Cline/OpenWebUI retry'ят.
      # Round 34 (2026-08-12): MUST be in compose env block — docker compose
      # НЕ подхватывает env_file автоматически для переменных, которых нет
      # в environment: ниже. Без этого async mode выключен и клиент получает 413.
      - LB_NCTX_PREFLIGHT_ASYNC_RELOAD=${LB_NCTX_PREFLIGHT_ASYNC_RELOAD:-true}
      - LB_NCTX_PREFLIGHT_ASYNC_RETRY_AFTER_SEC=${LB_NCTX_PREFLIGHT_ASYNC_RETRY_AFTER_SEC:-30}
      # Round 35c (2026-08-13): env-tunable async load polling timeout.
      # User report: 22GB Qwen3.6-35B-A3B на 3070 получил 8m7s timeout
      # (cppworker estimation 3.5min × 2 + 60s = 8m), но реальная загрузка
      # 12+ min из-за CUDA_Host pinned memory alloc для 19GB+ весов.
      # Для 22GB+ Qwen3.6 на 3070 поднять: MAX_WAIT=1800, MULT=4, BUFFER=120.
      # R60.28 (2026-09-10): bump max_wait formula для 22GB+ Q4_K_M MoE
      # на CPU offload. До: 2*est+60s = 1m59s (failed load 22GB @ 146s).
      # После: 3*est+300s = 5+ мин, cap 1800s. См. R60.28 commit message.
      - LB_NCTX_PREFLIGHT_MAX_WAIT_SEC=${LB_NCTX_PREFLIGHT_MAX_WAIT_SEC:-1800}
      - LB_NCTX_PREFLIGHT_WAIT_MULTIPLIER=${LB_NCTX_PREFLIGHT_WAIT_MULTIPLIER:-3}
      - LB_NCTX_PREFLIGHT_WAIT_BUFFER_SEC=${LB_NCTX_PREFLIGHT_WAIT_BUFFER_SEC:-300}
      #
      # R66c (2026-09-22): НЕ перечислять здесь переключатели, которыми управляет
      # .env.bundled-with-agent (LB_OPENAI_AUTO_STREAM, LB_AUTO_LOAD_ASYNC,
      # LB_NCTX_RELOAD_ASYNC, LB_AUTO_CONTINUE_*).
      #
      # Почему: `environment:` ПЕРЕОПРЕДЕЛЯЕТ `env_file` (проверено на живом
      # стеке: после добавления `- LB_AUTO_CONTINUE_ON_TRUNCATION=${...:-}`
      # переменная в контейнере стала ПУСТОЙ, хотя в env_file лежит 1).
      # А интерполяция `${VAR:-}` читает только `deployments/.env`, где этих
      # переменных нет, — то есть строка с `:-`-дефолтом затирает рабочее
      # значение из env_file значением по умолчанию.
      #
      # Итог: значения этих флагов задаются ТОЛЬКО в
      # deployments/.env.bundled-with-agent (см. раздел «Переключатели
      # поведения балансера»), а не в `.env`.
    # Round 51.6 (2026-08-20): env_file — auto-loads .env.bundled-with-agent
    # в контейнер. Раньше приходилось передавать --env-file явно, и при
    # свежем деплое docker compose подхватывал старый .env (без
    # CPPWORKER_API_TOKEN) → 401 от балансера.
    env_file:
      - .env.bundled-with-agent
    volumes:
      - ../config:/app/config:ro
      - balancer_data:/app/data
    networks:
      - ol-bundled-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18081/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  cppworker-gpu:
    build:
      context: ..
      dockerfile: docker/cppworker/Dockerfile.gpu
      args:
        CUDA_ARCH: ${CUDA_ARCH:-all}
    image: ollama-legion/cppworker:gpu-${CPPWORKER_GPU_TAG:-86-r60.4-webui-meta}
    container_name: ol-bundled-cppworker-gpu
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CPPWORKER_HOST=0.0.0.0
      - CPPWORKER_PORT=18092
      - CPPWORKER_MODELS_DIR=/app/models
      - CPPWORKER_CTX_SIZE=${CPPWORKER_CTX_SIZE:-32768}
      - CPPWORKER_BATCH_SIZE=${CPPWORKER_BATCH_SIZE:-512}
      - CPPWORKER_GPU_LAYERS=${CPPWORKER_GPU_LAYERS:-20}
      - CPPWORKER_FLASH_ATTN_TYPE=${CPPWORKER_FLASH_ATTN_TYPE:--1}
      - CPPWORKER_N_THREADS=${CPPWORKER_N_THREADS:-0}
      - CPPWORKER_NUMA=${CPPWORKER_NUMA:-false}
      - CPPWORKER_USE_MMAP=${CPPWORKER_USE_MMAP:-true}
      - CPPWORKER_RAM_FALLBACK_N_CTX=${CPPWORKER_RAM_FALLBACK_N_CTX:-true}
      - CPPWORKER_RAM_FALLBACK_GPU_LAYERS=${CPPWORKER_RAM_FALLBACK_GPU_LAYERS:--2}
      - CPPWORKER_RAM_FALLBACK_MAX_N_CTX=${CPPWORKER_RAM_FALLBACK_MAX_N_CTX:-128000}
      - CPPWORKER_AUTO_OFFLOAD=${CPPWORKER_AUTO_OFFLOAD:-true}
      - CPPWORKER_AUTO_TUNE_NCTX=${CPPWORKER_AUTO_TUNE_NCTX:-true}
      # Round 16 (2026-07-30): reasoning/thinking policy.
      # Default = OFF — backward compat + tool use workloads (Cline/Roo/Aider).
      # Qwen3 thinking оборачивает tool call в <think> блоки, ломает tool call
      # парсеры. Поставьте true если используете Coder/Qwen3-Coder и вам НЕ
      # нужен tool use. Можно переопределить per-model через load-with-params.
      - CPPWORKER_DEFAULT_ENABLE_REASONING=${CPPWORKER_DEFAULT_ENABLE_REASONING:-false}
      - CPPWORKER_DEFAULT_REASONING_BUDGET=${CPPWORKER_DEFAULT_REASONING_BUDGET:-0}
      - CPPWORKER_ENABLE_REASONING=${CPPWORKER_ENABLE_REASONING:-false}
      - CPPWORKER_REASONING_BUDGET=${CPPWORKER_REASONING_BUDGET:-0}
      # Round 15.1: opt-in flag для true parallel llama_decode через
      # BatchedScheduler. Default = false (Round 13 multi-slot path).
      - CPPWORKER_ENABLE_BATCHED_PARALLEL=${CPPWORKER_ENABLE_BATCHED_PARALLEL:-false}
      # R66d: токен #2 из 5. Входящая аутентификация cppworker. Одно значение
      # с балансером/агентом/WebUI (см. "ПРО ТОКЕН" в шапке).
      - API_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
      # Регистрация бэкенда в балансер.
      - CPPWORKER_BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      # R66d: токен #3 из 5. Исходящие вызовы cppworker -> balancer.
      - CPPWORKER_BALANCER_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
      - CPPWORKER_ADVERTISE_HOST=cppworker-gpu
      - CPPWORKER_ADVERTISE_PORT=18092
      # Round 34 follow-up: align with AGENT_BACKEND_ID so cppworker's
      # notifyModelLoaded callback updates the SAME backend the agent
      # registered (not an orphan). Without this match the callback
      # silently goes to a non-existent backend and cluster state shows
      # no loaded models. The callback uses `r.backendID` which is set
      # from CPPWORKER_REGISTER_NAME (not CPPWORKER_BACKEND_ID!) in
      # newBalancerRegistration at balancer_register.go:111+153.
      # BUG: when CPPWORKER_REGISTER_DISABLE=true, newBalancerRegistration
      # returns nil → balancerReg == nil → runAsyncLoad skips notifyModelLoaded.
      # Workaround: set REGISTER_DISABLE=false; balancer will dedup
      # (cppworker register at host=cppworker-gpu:18092 matches the agent's
      # register, both with same backendId, so they merge).
      - CPPWORKER_REGISTER_NAME=cppworker-gpu-bundled-agent
      - CPPWORKER_BACKEND_ID=cppworker-gpu-bundled-agent
      # Round 34 follow-up: balancerReg must be non-nil for notifyModelLoaded
      # callback to fire. Was disabled to avoid duplicate backends, but the
      # dedup happens in the balancer already (same backendId).
      - CPPWORKER_REGISTER_DISABLE=false
      - HF_AUTO_DOWNLOAD_REPO=
      - HF_AUTO_DOWNLOAD_FILE=
    # Round 51.6: env_file — auto-loads .env.bundled-with-agent.
    env_file:
      - .env.bundled-with-agent
    volumes:
      - ../models:/app/models:rw
      - ../config:/app/config:rw
      - cppworker_cache:/app/.cache
    ports:
      - "${CPPWORKER_GPU_PORT:-18092}:18092"
    networks:
      - ol-bundled-net
    healthcheck:
      test: ["CMD", "/app/cppworker", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      loadbalancer:
        condition: service_healthy

  # =========================================================================
  # Agent — sidecar-сборщик метрик (GPU/CPU/RAM/llama.cpp runtime).
  # Регистрирует cppworker-gpu в балансер отдельным backend с id
  # "cppworker-gpu-bundled-agent" (с hasAgent=true) — чтобы WebUI показывал
  # реальные GPU/VRAM/CPU метрики на странице GGUF и в мониторинге.
  #
  # De-dup на стороне WebUI:
  #   internal/api/gguf_backends_handler.go автоматически склеивает
  #   cppworker-gpu-bundled и cppworker-gpu-bundled-agent (один host:port)
  #   и выводит запись с hasAgent=true (приоритет), чтобы реальные метрики
  #   отображались в UI.
  # =========================================================================
  agent:
    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
      target: agent-gpu
      args:
        ENABLE_NVML: "true"
    image: ollama-legion/agent:cppworker-bundled-r41-agent-x-api-token  # Round 41 (2026-08-19): X-API-Token auth header — agent шлёт BALANCER_TOKEN в register/metrics/heartbeat (was: 401 restart loop)
    container_name: ol-bundled-cppworker-gpu-agent
    restart: unless-stopped
    # 2026-06-30: критично для GPU-метрик.
    # Без runtime: nvidia NVIDIA Container Toolkit не смонтирует в контейнер agent'а
    #   /dev/nvidia0, /dev/nvidiactl, /dev/nvidia-uvm* и libnvidia-ml.so.1.
    # В результате nvml.Init() возвращает ERROR_LIBRARY_NOT_FOUND, nvidia-smi
    #   не находится в PATH (нет в base-образе nvidia/cuda), /dev/nvidia0
    #   отсутствует → detectPlatformMode() возвращает ModeCPU и агент шлёт
    #   только CPU/RAM метрики.
    # Это симметрично cppworker-gpu (строка 73 в этом же файле).
    runtime: nvidia
    environment:
      - AGENT_ID=cppworker-gpu-bundled-agent
      - AGENT_PORT=18032
      # cppworker внутри compose-сети (DNS service discovery).
      - AGENT_CPPWORKER_URL=http://cppworker-gpu:18092
      # 2026-06-30: код в cmd/agent/main.go читает именно BALANCER_URL
      # (не AGENT_BALANCER_URL) — иначе используется дефолт http://localhost:18081,
      # который внутри compose указывает на сам контейнер agent и connection refused.
      - BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      # R66d: токен #4 из 5. Агент -> balancer (регистрация + метрики).
      - BALANCER_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
      # 2026-06-30: BACKEND_TYPE=llama_cpp обязательно — иначе баннер показывает
      # "Engine: Ollama" и весь смысл llama.cpp-агента теряется.
      - BACKEND_TYPE=llama_cpp
      # 2026-06-30: NVML_ENABLED=true обязательно — без NVML agent собирает
      # "No GPU detected, CPU mode" на хосте с GPU.
      - NVML_ENABLED=true
      # 2026-06-30 (de-dup v2): явно сообщаем агенту, какой физический cppworker
      # он обёртывает. Эти host/port попадают в register-payload как host/cppWorkerPort
      # и совпадают с тем, что отправляет register-with-balancer.sh для cppworker-gpu.
      # Без этого de-dup по (host, port) в /api/v1/gguf/backends не срабатывал:
      # agent регистрировался с host=cppworker-gpu-bundled-agent:18091 (имя контейнера
      # agent'а + legacy fallback), а cppworker — с host=cppworker-gpu:18092.
      - AGENT_CPPWORKER_HOST=cppworker-gpu
      - AGENT_CPPWORKER_PORT=18092
      # Public host:port для самого агента (используется только для agentPort/healthcheck,
      # НЕ для хоста бэкенда — это и было источником дубля).
      - AGENT_PUBLIC_HOST=cppworker-gpu-bundled-agent
      - AGENT_PUBLIC_PORT=18032
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      # 2026-06-30: NVIDIA_DRIVER_CAPABILITIES обязательно для доступа к GPU в контейнере.
      #   "compute" — доступ к GPU для вычислений (NVML Init использует его).
      #   "utility" — доступ к nvidia-smi и management утилитам.
      # Без этого NVIDIA Container Toolkit не выдаёт права на /dev/nvidia* даже при runtime: nvidia.
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - AGENT_MODE=gpu
      - AGENT_COLLECT_INTERVAL=${AGENT_COLLECT_INTERVAL:-15}
      - AGENT_HEARTBEAT_INTERVAL=${AGENT_HEARTBEAT_INTERVAL:-30}
      - AGENT_BACKEND_ID=cppworker-gpu-bundled-agent
      - AGENT_CPPWORKER_PORT=18092
      - AGENT_REGISTER_GPU_MODE=gpu
    # Round 51.6: env_file — auto-loads .env.bundled-with-agent.
    env_file:
      - .env.bundled-with-agent
    networks:
      - ol-bundled-net
    healthcheck:
      test: ["CMD", "/app/agent", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      loadbalancer:
        condition: service_healthy
      cppworker-gpu:
        condition: service_healthy

  webui:
    build:
      context: ..
      dockerfile: docker/webui/Dockerfile
      # Sprint 30 (2026-07-30): VERSION / GIT_COMMIT / BUILD_DATE пробрасываются
      # как build-args в WebUI. entrypoint.sh инжектит их в config.js, JS в
      # index.html показывает в sidebar footer (id=appVersion).
      # Можно переопределить через env:
      #   WEBUI_VERSION, WEBUI_GIT_COMMIT, WEBUI_BUILD_DATE
      args:
        VERSION: ${WEBUI_VERSION:-dev}
        GIT_COMMIT: ${WEBUI_GIT_COMMIT:-unknown}
        BUILD_DATE: ${WEBUI_BUILD_DATE:-unknown}
    image: ollama-legion/webui:r77-submodule-v2  # R77 (2026-09-24): карточка «Размещение моделей» на /monitor — данные GET /api/v1/placement (enabled/fallback/operatingMode, решения по моделям со стратегией/источником/причиной, пометки degraded и «не исполняется (P2)», группы репликации с кандидатами, предупреждения валидации конфига). Требует ?v=R77 для i18n/api.js/ui-renderer.js. R66d (2026-09-23): load через балансер с настройками формы (ctx/batch/flash/mmap/kv), рабочие Apply профиля / Delete / Cancel download, runtime-параметры загруженной модели + бейдж CPU-offload на вкладке загруженных. Требует ?v=R66g (см. webui/index.html).
    container_name: ol-bundled-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-18083}:80"
    environment:
      - LB_API_URL=http://loadbalancer:18081
      - LB_OLLAMA_URL=http://loadbalancer:18080
      - WEBUI_PORT=80
      # Session 18 Round 15 (2026-07-29): API_TOKEN обязателен — иначе WebUI
      # шлёт X-API-Token: "" → cppworker возвращает 401 на per-backend save
      # (config update). Используем тот же токен что у cppworker и balancer.
      # R66d: токен #5 из 5. WebUI -> balancer/cppworker. entrypoint.sh WebUI
      # проверяет его против балансера при старте контейнера и печатает
      # "API token check: OK" или ERROR с инструкцией (см. шапку файла).
      - API_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
    # R66d: env_file ДОБАВЛЯЕТ переменные в контейнер, но НЕ переопределяет
    # `environment:` выше, и НЕ участвует в интерполяции `${VAR:-default}`.
    # Токен из этого env_file на сервисы НЕ влияет — источник deployments/.env.
    # ВАЖНО: .env.bundled-with-agent НЕ содержит CPPWORKER_API_TOKEN (строка
    # закомментирована), чтобы не создавать иллюзию второго источника.
    env_file:
      - .env.bundled-with-agent
    networks:
      - ol-bundled-net
    depends_on:
      loadbalancer:
        condition: service_healthy

networks:
  # R66b (2026-09-22): external: true — сеть уже существует и НЕ помечена
  # лейблом compose (её создал `docker network create` при первом ручном
  # деплое), поэтому `docker compose up` без external падал с
  #   "network ollama-legion-bundled-net was found but has incorrect label
  #    com.docker.compose.network set to \"\" (expected: \"ol-bundled-net\")"
  # Внешний режим сохраняет сеть (и DNS-имена уже подключённых контейнеров)
  # вместо попытки пересоздать её.
  #
  # ВАЖНО: сервисные DNS-имена (loadbalancer, cppworker-gpu, agent) выдаёт
  # именно compose при подключении контейнера к этой сети. Поэтому контейнеры
  # обязательно пересоздавать через compose, а НЕ через `docker run`:
  # без алиаса `cppworker-gpu` ломается всё сразу —
  #   webui nginx /api/worker/* → 502 (вкладка GGUF пустая),
  #   balancer poller http://cppworker-gpu:18092/api/metrics → no such host,
  #   agent AGENT_CPPWORKER_URL → нет GPU/VRAM-метрик,
  #   unload/load/delete моделей → 500 no such host.
  ol-bundled-net:
    external: true
    name: ollama-legion-bundled-net

volumes:
  balancer_data:
  cppworker_cache:













