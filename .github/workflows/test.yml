# Минимальный CI для ветки centurion: build + test + vet, без Docker.
#
# Назначение:
#   - Быстрый сигнал "зелёное/красное" на каждый push в centurion и каждый PR.
#   - Без self-hosted runner'а (используем ubuntu-latest — public runner).
#   - Без Docker: только `go build` + `go test` + `go vet` в stub-режиме
#     (тег `llama_stub` отключает C-bridge, тесты не требуют GPU/llama.cpp).
#   - Интеграционные тесты, требующие docker-compose, НЕ запускаются
#     (см. ./tests/... — они за флагом `-short` или требуют явного `docker compose up`).
#
# Отличие от .github/workflows/ci.yml:
#   ci.yml     — полный pipeline (self-hosted Windows + ubuntu + lint + i18n),
#                триггерится на main/integration/**/feature/**, ~10-20 мин.
#   test.yml   — лёгкий smoke-test для centurion, ~3-5 мин cold cache,
#                ~1-2 мин с Go cache hit.
#
# Если centurion станет стабильным main, ci.yml можно упростить или удалить.
# Пока оба живут параллельно — это intentional.

name: test

on:
  push:
    branches: [centurion]
  pull_request:
    branches: [centurion]
  workflow_dispatch:

# Отмена in-progress для одного и того же workflow (новый push отменяет старый прогон)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  GOPROXY: https://proxy.golang.org,direct
  CGO_ENABLED: 1   # нужен для cgo (даже в stub-режиме)

jobs:
  test:
    name: Build + test (ubuntu, no Docker)
    runs-on: ubuntu-latest
    # R423 (2026-11-06): 15 → 25 минут. Шаг с ./tests/... получил бюджет
    # 600s вместо 300s (см. ниже), а сам пакет там — самый долгий: прогон
    # 41676805057 целиком занял 12m31s при УПАВШЕМ на таймауте шаге tests/...
    # Значит с честным бюджетом job в 15 минут перестаёт помещаться.
    timeout-minutes: 25

    # R66c (2026-09-22): pipefail ОБЯЗАТЕЛЕН.
    #
    # Шаги ниже намеренно гоняют `go test ... 2>&1 | tail -N` — чтобы лог
    # шага был читаемым. Но дефолтный shell (`bash -e {0}`, без pipefail)
    # возвращает код последней команды пайпа, т.е. код `tail` (всегда 0):
    # падение тестов не роняло шаг, и workflow был ЗЕЛЁНЫМ при полностью
    # красных тестах — в прогоне 35656811670 шаги `internal/...`, `cmd/...`
    # и `tests/...` печатали FAIL, а job завершился success.
    #
    # `-o pipefail` возвращает первый ненулевой код пайпа, сохраняя краткость
    # логов. Не полагаться на `tail` для «проглатывания» ошибок.
    defaults:
      run:
        shell: bash -e -o pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # c/llama.cpp — gitlink без .gitmodules
          fetch-depth: 0      # для git log в сообщениях/комментариях

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true         # кеширует GOMODCACHE + GOCACHE между прогонами

      - name: Install build tools (only if missing)
        # build-essential нужен для cgo (хотя в stub-режиме не линкуемся
        # с реальной llama.cpp, headers gcc всё равно используются).
        # cmake не требуется — собираем только Go-бинарь.
        #
        # R493-CI (2026-11-11): apt только если инструментов ДЕЙСТВИТЕЛЬНО нет.
        # Живой факт: прогоны падали в этом шаге на `Temporary failure resolving
        # 'archive.ubuntu.com'` / 'security.ubuntu.com' — то есть красный CI не
        # имел отношения к коду. На ubuntu-latest компиляторы предустановлены,
        # поэтому проверка наличия делает шаг no-op в нормальном случае.
        run: |
          missing=""
          for t in gcc g++ make; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -z "$missing" ]; then
            echo "все инструменты уже есть: gcc g++ make"
            exit 0
          fi
          echo "не хватает:$missing — ставим пакеты"
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y build-essential

      - name: Build all binaries (stub mode)
        run: |
          mkdir -p bin
          go build -tags llama_stub -o bin/balancer-stub   ./cmd/balancer/
          go build -tags llama_stub -o bin/cppworker-stub ./cmd/cppworker/
          go build -tags llama_stub -o bin/agent-stub     ./cmd/agent/

      # cppworker -healthcheck — это probe живого сервера на 127.0.0.1:18092
      # (см. cmd/cppworker/utils.go:616), а не smoke-test бинарника. Используется
      # как Docker healthcheck изнутри контейнера. В CI без запущенного
      # cppworker'а шаг бесполезен — build выше уже доказывает, что код линкуется.

      - name: Test internal/... (-race)
        # R67b (2026-09-23): -timeout 180s → 300s.
        #
        # Пакет internal/balancer с -race идёт ~90s на быстрой машине
        # разработчика (проверено локально: 90.0s) и упирался в 180-секундный
        # бюджет на ubuntu-latest: 'panic: test timed out after 3m0s',
        # 'FAIL ollama-legion/internal/balancer 180.049s' (прогон
        # 35872569511). В ci.yml для того же пакета бюджет давно 300s —
        # приводим к одному значению (см. .github/workflows/ci.yml:436).
        run: scripts/run_go_test.sh "internal/..." -race -tags llama_stub -timeout 300s -v ./internal/...

      - name: Test cmd/... (no race)
        run: scripts/run_go_test.sh "cmd/..." -tags llama_stub -timeout 60s -v ./cmd/...

      - name: Test tests/... (integration, -short)
        # -short: пропускает e2e тесты, требующие docker-compose stack.
        # На ubuntu без Docker можно прогнать только короткие Go-тесты.
        #
        # R66c (2026-09-22): -timeout 120s → 300s. Пакет ./tests/... реально
        # идёт ~160s (в нём по замыслу есть медленные проверки, например
        # TestOpenAIChat_SlowFirstToken_HoldsConnection ~50s), поэтому шаг
        # упирался в таймаут и падал без единого '--- FAIL:' — только
        # 'FAIL ... 120.019s'. 300s совпадает с бюджетом self-hosted job'а.
        #
        # R423 (2026-11-06): 300s → 600s. Прогон 41676805057:
        # 'panic: test timed out after 5m0s', 'FAIL ollama-loadbalancer/tests
        # 300.076s' — без единого '--- FAIL:'. Пакет не сломан, он не успевает:
        # те же тесты локально под -race идут 267-318s, а на двухъядерном
        # раннере github дольше. В ci.yml у этого же пакета бюджет давно 600s
        # (там ещё и -race), то есть два workflow проверяли одно и то же с
        # разными лимитами. Приводим к 600s; timeout-minutes job'а поднят,
        # чтобы бюджет шага не упирался в бюджет job'а.
        run: scripts/run_go_test.sh "tests/..." -tags llama_stub -timeout 600s -short -v ./tests/...

      - name: go vet
        if: always()
        run: |
          go vet -tags llama_stub ./...

      # CI-only smoke test — отдельный от ./internal/... и ./cmd/... чтобы
      # не зависеть от test-файлов, которые могут падать под coverage или
      # требовать специфического runtime. За build-тегом `ci`, локально
      # не запускается (см. tests/ci/smoke_test.go).
      - name: Smoke test binaries (build-tag ci)
        if: success()
        run: |
          go test -tags ci -timeout 30s -v ./tests/ci/...
