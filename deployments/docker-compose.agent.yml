# Ollama Load Balancer — Agent Docker Compose конфигурация
# =============================================================================
#
# Использование:
#   CPU сервер (по умолчанию):
#     docker compose -f docker-compose.agent.yml up -d --build
#
#   GPU сервер (требуется NVIDIA Container Toolkit):
#     docker compose -f docker-compose.agent.yml --profile gpu up -d --build
#
#   Просмотр логов:
#     docker compose -f docker-compose.agent.yml logs -f
#
#   Остановка:
#     docker compose -f docker-compose.agent.yml down
#
# Переменные окружения (через .env файл):
#   AGENT_ID — уникальный идентификатор агента
#   BALANCER_URL — URL балансировщика (обязателен!)
#   AGENT_PUBLIC_HOST — публичный IP/hostname, доступный балансеру (обязателен!)
#   AGENT_PORT — порт агента (18032)
#   OLLAMA_URL — URL локального Ollama
#   GPU_MODE — режим: auto, gpu, cpu (по умолчанию auto)
#   NVML_ENABLED — включение NVML (false для CPU, true для GPU)
#   METRICS_INTERVAL — интервал отправки метрик (5 секунд)
#
# СЕТЕВОЕ ВЗАИМОДЕЙСТВИЕ:
#   Агент и балансер НЕ обязаны быть в одной Docker-сети.
#   Требуется только IP-доступность по HTTP:
#     1. Агент → Балансер: HTTP POST/GET на BALANCER_URL
#     2. Балансер → Агент/Ollama: HTTP GET на AGENT_PUBLIC_HOST
#
#   Режимы сети:
#     A) bridge (по умолчанию) — агент в своей сети, порты проброшены
#     B) network_mode: host — агент напрямую использует сетевой стек хоста
#     C) Docker Swarm overlay — для кластеров в swarm-режиме

# =============================================================================
# YAML Anchor: общие переменные окружения для agent и agent-gpu
# =============================================================================
x-agent-env: &agent-env
  AGENT_ID: ${AGENT_ID:-agent}
  BALANCER_URL: ${BALANCER_URL:-http://REPLACE_WITH_BALANCER_IP:18081}
  AGENT_PUBLIC_HOST: ${AGENT_PUBLIC_HOST:-REPLACE_WITH_AGENT_PUBLIC_IP}
  AGENT_PORT: ${AGENT_PORT:-18032}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  GPU_MODE: ${GPU_MODE:-auto}
  METRICS_INTERVAL: ${METRICS_INTERVAL:-5}
  HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-3}
  COLLECT_INTERVAL: ${COLLECT_INTERVAL:-5}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  AGENT_MAX_MODELS: ${AGENT_MAX_MODELS:--1}
  AGENT_MAX_CONCURRENT_REQUESTS: ${AGENT_MAX_CONCURRENT_REQUESTS:--1}
  AGENT_WEIGHT: ${AGENT_WEIGHT:-1}

# =============================================================================
# YAML Anchor: общие security-настройки
# =============================================================================
x-security: &security-opts
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64M,noexec,nosuid

services:
  # ===========================================================================
  # Агент CPU — distroless, минимальный образ (~8 MB)
  # ===========================================================================
  agent:
    image: ollama-legion/agent:latest
    container_name: ollama-legion-agent
    restart: unless-stopped

    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
      target: agent-cpu
      args:
        ENABLE_NVML: "false"

    # CPU-профиль: запускается по умолчанию (без --profile)
    profiles: ["", "cpu"]

    networks:
      - ollama-legion-agent-net

    ports:
      - "${AGENT_PORT:-18032}:18032"

    environment:
      <<: *agent-env
      NVML_ENABLED: "false"

    <<: *security-opts

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 64M

    # Healthcheck — нативный exec probe без shell
    healthcheck:
      test: ["CMD", "/app/agent", "-healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    extra_hosts:
      - "host.docker.internal:host-gateway"

    labels:
      - "ollama-legion.role=agent"
      - "ollama-legion.component=metrics-collector-cpu"

  # ===========================================================================
  # Агент GPU — NVIDIA CUDA runtime (~150 MB)
  # ===========================================================================
  agent-gpu:
    image: ollama-legion/agent:latest-gpu
    container_name: ollama-legion-agent-gpu
    restart: unless-stopped

    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
      target: agent-gpu
      args:
        ENABLE_NVML: "true"

    # GPU-профиль: запускается только с --profile gpu
    profiles: ["gpu"]

    networks:
      - ollama-legion-agent-net

    ports:
      - "${AGENT_PORT:-18032}:18032"

    environment:
      <<: *agent-env
      GPU_MODE: ${GPU_MODE:-gpu}
      NVML_ENABLED: "true"

    <<: *security-opts

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 128M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "/app/agent", "-healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

    extra_hosts:
      - "host.docker.internal:host-gateway"

    labels:
      - "ollama-legion.role=agent"
      - "ollama-legion.component=metrics-collector-gpu"

networks:
  ollama-legion-agent-net:
    driver: bridge