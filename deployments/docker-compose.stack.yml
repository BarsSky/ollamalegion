# =============================================================================
# OllamaLegion — single compose file for every deployment scenario
# =============================================================================
#
# ONE FILE, FOUR PROFILES. This is the canonical compose file; the other files in
# deployments/ are historical/special-purpose (see docs/ru/docker-compose-guide.md).
#
#   full         cppworker-gpu + imageworker + loadbalancer + webui   (all on one box)
#   worker       cppworker-gpu + imageworker + agent                  (balancer elsewhere)
#   balancer     loadbalancer + webui                                 (backends connect in)
#   legacy-agent external metrics collector instead of the embedded one
#
# Setup:
#   cd deployments
#   cp .env.example .env                                  # compose interpolation
#   cp .env.bundled-with-agent.example .env.bundled-with-agent
#   # set CPPWORKER_API_TOKEN (the single stack token) in deployments/.env
#
# Run:
#   docker compose -f docker-compose.stack.yml --profile full up -d
#
# Client endpoints: Ollama API :18080, OpenAI :18079, Admin API :18081, WebUI :18083.
#
# Scenario 1 also serves image generation: cppworker-gpu (llama_cpp, :18092) for
# text and imageworker (image_cpp, :18093) for images, both behind one balancer.
# Text goes to llama_cpp; /v1/images/*, /sdapi/v1/* and /api/image/* go to
# image_cpp. Verify: curl -s localhost:18081/api/v1/backends | jq '.backends[]|{id,type}'
#
# Scenario 2 (worker) REQUIRES BALANCER_URL in deployments/.env — it points at the
# ADMIN API (:18081) of the balancer on ANOTHER machine, not the client port. Also
# set the advertise host so the balancer can reach this worker. Without
# BALANCER_URL the workers try the in-network name "loadbalancer", which does not
# exist in this profile, and registration retries forever.
#
# -----------------------------------------------------------------------------
# Documentation
# -----------------------------------------------------------------------------
#   README.md                            — quick start, profile table, ports
#   docs/deployment-stack.md             — scenarios, profiles, ports, remote workers
#   docs/ru/deployment-troubleshooting.md — incident write-ups and env-var traps
#
# Both documents are written in Russian; every comment in THIS file is English.
#
# The traps below are the short version of the troubleshooting file.
#
# -----------------------------------------------------------------------------
# Environment variables: `environment:` OVERRIDES `env_file`
# -----------------------------------------------------------------------------
# Compose applies env_file first, then LAYERS environment on top. A line such as
# `- LB_FOO=${LB_FOO:-}` therefore WIPES the value from .env.bundled-with-agent
# with an empty string, because `${...}` only reads deployments/.env. Rule: set a
# toggle EITHER in .env.bundled-with-agent (and do not mention it in environment)
# OR in environment with a default from .env. Toggles are deliberately not
# duplicated below.
#
# -----------------------------------------------------------------------------
# Variable names the code actually reads (the rest are ignored silently)
# -----------------------------------------------------------------------------
#   agent:      BACKEND_TYPE (NOT AGENT_BACKEND_TYPE — wrong name registers the
#               backend as Ollama), CPPWORKER_URL, NODE_LABELS, GPU_MODE,
#               COLLECT_INTERVAL, HEARTBEAT_INTERVAL, BALANCER_URL,
#               BALANCER_TOKEN, AGENT_ID, AGENT_PORT, AGENT_PUBLIC_HOST.
#   cppworker:  CPPWORKER_*, API_TOKEN, CPPWORKER_BALANCER_URL/_TOKEN,
#               CPPWORKER_ADVERTISE_HOST, CPPWORKER_REGISTER_NAME (backend ID).
#               CPPWORKER_ADVERTISED_PORT is NOT read — use AGENT_CPPWORKER_PORT.
#   sdworker:   SDWORKER_BALANCER_URL/_TOKEN, SDWORKER_ADVERTISE_HOST/PORT,
#               SDWORKER_BACKEND_ID, SDWORKER_PORT, SDWORKER_MAX_CONCURRENT.
#   balancer:   LB_*, CPPWORKER_API_TOKEN, CPPWORKER_URL. BALANCER_PORT and
#               BALANCER_API_PORT are NOT read — ports come from config/config.json.
#
# -----------------------------------------------------------------------------
# Image registry: one variable, IMAGE_REGISTRY
# -----------------------------------------------------------------------------
#   IMAGE_REGISTRY=                        -> ollama-legion/balancer:<tag>
#   IMAGE_REGISTRY=local-docker-hub:5000/  -> local-docker-hub:5000/ollama-legion/balancer:<tag>
#
# The trailing slash is REQUIRED: compose concatenates strings literally, so a
# missing slash yields "local-docker-hub:5000ollama-legion/..." (invalid reference).
# scripts/lib-image-registry.ps1 adds the slash and maps placeholder values
# (local, docker.io, index.docker.io) to an empty prefix.
# =============================================================================

name: ollama-legion-stack

services:
  # ===========================================================================
  # balancer — client entry point (OpenAI + Ollama API) and admin API
  # Profiles: balancer | full
  # ===========================================================================
  loadbalancer:
    image: ${IMAGE_REGISTRY:-}ollama-legion/balancer:${BALANCER_TAG:-r83-submodule-v22}
    # Built from source. Reason: `--build` used to rebuild only imageworker, so
    # the balancer stayed on an old image and the image-generation surface
    # (:18079) never appeared — it looked like "the new backend is inactive in
    # docker". cppworker-gpu and agent are intentionally image-only: their code
    # did not change in that phase, and rebuilding llama.cpp from source takes
    # tens of minutes. Full source build: docker-compose.bundled-full.yml.
    build:
      context: ..
      dockerfile: docker/balancer/Dockerfile
      args:
        GIT_COMMIT: ${BALANCER_GIT_COMMIT:-unknown}
        BUILD_DATE: ${BALANCER_BUILD_DATE:-unknown}
    container_name: ol-stack-balancer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LB_PORT:-18080}:18080"        # client API (OpenWebUI, Cline)
      - "${LB_ADMIN_PORT:-18081}:18081"  # admin API (registration, metrics, WebUI)
      # OpenAI surface for image generation (/v1/images/*, /sdapi/v1/*). Inside the
      # container the port is 18079 (loadBalancer.openAIPort in config.json, env
      # LB_OPENAI_PORT); only the EXTERNAL port changes here, same as LB_PORT above.
      - "${LB_OPENAI_PORT:-18079}:18079"
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=${LB_LOG_LEVEL:-info}
      - LB_CONFIG_PATH=/app/config/config.json
      # Version of the running image in the startup banner, so the log always
      # answers "is this really the build I deployed?".
      - APP_VERSION=${BALANCER_TAG:-r83-submodule-v22}
      # SINGLE stack token. Must match:
      #   cppworker -> CPPWORKER_API_TOKEN / API_TOKEN
      #   agent     -> BALANCER_TOKEN
      #   webui     -> API_TOKEN
      - LB_API_TOKEN=${CPPWORKER_API_TOKEN:?set CPPWORKER_API_TOKEN in deployments/.env}
      # Backend capacity = the ACTUAL number of model slots (cppworker reports
      # max_slots in /api/models), so the balancer admits as many parallel requests
      # as the loaded model has slots instead of serialising them.
      - LB_CAPACITY_FROM_MODEL_SLOTS=${LB_CAPACITY_FROM_MODEL_SLOTS:-false}
      - LB_NCTX_RELOAD_ENABLED=${LB_NCTX_RELOAD_ENABLED:-true}
      - LB_NCTX_RELOAD_MAX_N_CTX=${LB_NCTX_RELOAD_MAX_N_CTX:-131072}
      - LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR=${LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR:-0.95}
      - LB_NCTX_RELOAD_TIMEOUT_SEC=${LB_NCTX_RELOAD_TIMEOUT_SEC:-300}
      - LB_NCTX_PREFLIGHT_ENABLED=${LB_NCTX_PREFLIGHT_ENABLED:-true}
      - LB_NCTX_PREFLIGHT_ASYNC_RELOAD=${LB_NCTX_PREFLIGHT_ASYNC_RELOAD:-true}
      - LB_NCTX_PREFLIGHT_ASYNC_RETRY_AFTER_SEC=${LB_NCTX_PREFLIGHT_ASYNC_RETRY_AFTER_SEC:-30}
      - LB_NCTX_PREFLIGHT_MAX_WAIT_SEC=${LB_NCTX_PREFLIGHT_MAX_WAIT_SEC:-1800}
      - LB_NCTX_PREFLIGHT_WAIT_MULTIPLIER=${LB_NCTX_PREFLIGHT_WAIT_MULTIPLIER:-3}
      - LB_NCTX_PREFLIGHT_WAIT_BUFFER_SEC=${LB_NCTX_PREFLIGHT_WAIT_BUFFER_SEC:-300}
      # Where the balancer stores image-model profiles. Must be explicit: the
      # default is config/image-model-profiles.json under /app/config, which is
      # mounted READ-ONLY below, so saving a profile from the WebUI would fail.
      # /app/data is a writable volume (balancer_data).
      - LB_IMAGE_MODEL_PROFILES_PATH=${LB_IMAGE_MODEL_PROFILES_PATH:-/app/data/image-model-profiles.json}
      # Coexistence policy for image generation vs text (balancing.image). It used
      # to be settable only in the read-only config.json; now the WebUI override
      # lives here and applies live (there are no env vars for the policy fields).
      - LB_IMAGE_RESOURCES_PATH=${LB_IMAGE_RESOURCES_PATH:-/app/data/image-resources.json}
      # How long to wait for auto-load before answering 503 "try later". A 27B model
      # on A10/3070 takes 3-8 minutes, hence 900 s (the in-code default of 180 s is
      # too short). 0 = do not wait at all.
      - LB_AUTO_LOAD_WAIT_SEC=${LB_AUTO_LOAD_WAIT_SEC:-900}
      # Behaviour toggles (LB_OPENAI_AUTO_STREAM, LB_AUTO_LOAD_ASYNC,
      # LB_AUTO_CONTINUE_*, LB_GPU_HEADROOM_PERCENT) are deliberately NOT duplicated
      # here — set them in .env.bundled-with-agent (see the header on ordering).
    env_file:
      - .env.bundled-with-agent
    volumes:
      - ../config:/app/config:ro
      - balancer_data:/app/data
    networks: [ol-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18081/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: ["balancer", "full"]

  # ===========================================================================
  # webui — operator dashboard (monitoring, model loading, settings)
  # Profiles: balancer | full
  # ===========================================================================
  webui:
    image: ${IMAGE_REGISTRY:-}ollama-legion/webui:${WEBUI_TAG:-r83-submodule-v22}
    # Built from source for the same reason as the balancer: with a stale image the
    # "Image backends" navigation entry and the Monitor request panel never reach
    # the operator, which looks like "the WebUI cannot see the image backend".
    #
    # VERSION is not just a label: the Dockerfile substitutes it into the ?v= token
    # of every html (sed 's/?v=.../?v=${VERSION}/'), and nginx serves js with
    # expires 1y. With an unchanged token the browser would keep OLD modules from
    # cache even after a rebuild. Hence the default is the release version.
    build:
      context: ..
      dockerfile: docker/webui/Dockerfile
      args:
        VERSION: ${WEBUI_VERSION:-0.7.0}
        GIT_COMMIT: ${WEBUI_GIT_COMMIT:-unknown}
        BUILD_DATE: ${WEBUI_BUILD_DATE:-unknown}
    container_name: ol-stack-webui
    restart: unless-stopped
    depends_on:
      loadbalancer:
        condition: service_healthy
        # OPTIONAL dependency, so the backend-only scenario (`--profile worker`,
        # balancer on ANOTHER machine) works at all. Without required:false compose
        # rejects the WHOLE project ("service webui depends on undefined service
        # loadbalancer") because loadbalancer is not in the active profile.
        #
        # Why it is safe: depends_on only defines start ORDER. If loadbalancer is
        # active (full/balancer) we wait for healthy; if it is absent from the
        # profile compose neither waits nor fails, and the workers register with
        # the EXTERNAL balancer via BALANCER_URL.
        required: false
    ports:
      - "${WEBUI_PORT:-18083}:80"
    environment:
      - API_TOKEN=${CPPWORKER_API_TOKEN:?задайте CPPWORKER_API_TOKEN в deployments/.env}
      - LB_API_URL=http://loadbalancer:18081
      - LOG_LEVEL=${WEBUI_LOG_LEVEL:-info}
    networks: [ol-net]
    profiles: ["balancer", "full"]

  # ═══════════════════════════════════════════════════════════════════════════
  # cppworker-gpu — llama.cpp inference on GPU
  # Profiles: worker | full
  # ═══════════════════════════════════════════════════════════════════════════
  cppworker-gpu:
    image: ${IMAGE_REGISTRY:-}ollama-legion/cppworker:gpu-${CPPWORKER_GPU_TAG:-r83-submodule-v22}
    # Built from source so `up -d` also works on a machine with no prebuilt image:
    # this service used to have ONLY `image:`, so compose failed with
    # "pull access denied / not found" instead of building locally.
    #
    # The universal Dockerfile.gpu takes CUDA_ARCH.
    # WARNING: CUDA_ARCH=all (default) builds for 9 architectures — ~40 min instead
    # of ~3 min for a single one. Set CUDA_ARCH in deployments/.env (build args do
    # NOT come from env_file): 61 = GTX 10xx / Pascal, 86 = RTX 30xx, 89 = RTX 40xx.
    # Builds are cached: after the first run only changed layers rebuild (~30 s for
    # Go-only changes).
    build:
      context: ..
      dockerfile: docker/cppworker/Dockerfile.gpu
      target: runtime
      args:
        CUDA_ARCH: ${CUDA_ARCH:-all}
        GIT_COMMIT: ${CPPWORKER_GIT_COMMIT:-unknown}
        BUILD_DATE: ${CPPWORKER_BUILD_DATE:-unknown}
    container_name: ol-stack-cppworker-gpu
    restart: unless-stopped
    runtime: nvidia
    environment:
      - CPPWORKER_HOST=0.0.0.0
      - CPPWORKER_PORT=18092
      - CPPWORKER_MODELS_DIR=/app/models
      # Version of the running image in the cppworker startup log.
      - APP_VERSION=${CPPWORKER_GPU_TAG:-r83-submodule-v22}
      # ONLY the agent registers the backend. Enabling the Go-side registration as
      # well would create TWO backend records for one endpoint.
      - CPPWORKER_REGISTER_DISABLE=true
      - API_TOKEN=${CPPWORKER_API_TOKEN:?set CPPWORKER_API_TOKEN in deployments/.env}
      - CPPWORKER_API_TOKEN=${CPPWORKER_API_TOKEN:?set CPPWORKER_API_TOKEN in deployments/.env}
      # cppworker needs the balancer for pull-based model profile sync. In the
      # worker scenario this is the remote address from BALANCER_URL.
      - CPPWORKER_BALANCER_URL=${CPPWORKER_BALANCER_URL:-${BALANCER_URL:-http://loadbalancer:18081}}
      # TRAP (fixed 2026-10-07, same class as the imageworker AGENT_PUBLIC_HOST bug):
      # this used to be CPPWORKER_BALANCER_TOKEN=${CPPWORKER_API_TOKEN:?...} — a
      # plain assignment that ignores the operator entirely. The later line
      # BALANCER_TOKEN=${CPPWORKER_BALANCER_TOKEN:-...} DOES read the operator's
      # value, so setting CPPWORKER_BALANCER_TOKEN in .env would have made the
      # balancer authenticate with one token while the worker expected another -> 401.
      # Self-reference first, exactly like SDWORKER_BALANCER_TOKEN below.
      - CPPWORKER_BALANCER_TOKEN=${CPPWORKER_BALANCER_TOKEN:-${CPPWORKER_API_TOKEN:?set CPPWORKER_API_TOKEN in deployments/.env}}
      # Host under which the balancer reaches this worker. The Go-side default is
      # os.Hostname() — inside a container that is a hex id, useless from another
      # machine. On a SEPARATE machine this MUST be that machine's LAN address;
      # the same BACKEND_HOST that fixes imageworker and the agent fixes this too.
      - CPPWORKER_ADVERTISE_HOST=${CPPWORKER_ADVERTISE_HOST:-${BACKEND_HOST:-cppworker-gpu}}

      # --- Model and memory ---------------------------------------------------
      - CPPWORKER_CTX_SIZE=${CPPWORKER_CTX_SIZE:-32768}
      - CPPWORKER_BATCH_SIZE=${CPPWORKER_BATCH_SIZE:-512}
      # AUTO-UNLOAD OF IDLE MODELS. cppworker keeps EVERY loaded model in VRAM:
      # idleUnloadMinutes=0 means "never unload". On an 8 GB card that is a trap —
      # two text models left over from their sessions took 7.8 GB, free VRAM
      # dropped to 391 MB, and an image-generation request was rejected by the
      # gate ("needs 520 MB, only 391 MB free", coexistence=exclusive) even though
      # the image model itself was already loaded.
      #
      # 0 = off (previous behaviour). 10 minutes is the compromise: an active
      # session keeps its model, an abandoned one frees the card for generation.
      #
      # NOTE: setting this through the WebUI/API (PUT /config/update) is NOT
      # persisted inside the container — saveConfigToDefaultsFile writes to
      # config/cppworker-defaults.json relative to the workdir, and the image has
      # no config/ directory. This env var is the only reliable place.
      - CPPWORKER_IDLE_UNLOAD_MINUTES=${CPPWORKER_IDLE_UNLOAD_MINUTES:-10}
      # --- EMBEDDED METRICS AGENT ---------------------------------------------
      #
      # The external `agent` container outlives worker re-creation and registers
      # as a separate entity; the embedded agent lives exactly as long as the
      # worker and writes metrics into the SAME backend record.
      #
      # ENABLED (on). AGENT_ID matches the ID the backend is already registered
      # under (`cppworker-gpu-bundled-agent`), so switching does not create a
      # SECOND record. Do NOT change it without a migration: the balancer binds an
      # agent by ID, not by container name.
      #
      # The external `agent` container MUST be stopped together with this —
      # otherwise two collectors send metrics for one backend in turn and values
      # flap (notably gpu.uuids, which is what VRAM de-duplication relies on).
      #
      # AGENT_PUBLIC_HOST is the service name on ol-net: the balancer reaches the
      # embedded agent's /health through it.
      - AGENT_EMBEDDED=${CPPWORKER_AGENT_EMBEDDED:-on}
      - AGENT_ID=${AGENT_ID:-cppworker-gpu-bundled-agent}
      - AGENT_PUBLIC_HOST=${BACKEND_HOST:-cppworker-gpu}
      - AGENT_EMBEDDED_PORT=${CPPWORKER_AGENT_PORT:-18034}
      - BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - BALANCER_TOKEN=${CPPWORKER_BALANCER_TOKEN:-${CPPWORKER_API_TOKEN:-}}
      - GPU_MODE=${GPU_MODE:-auto}
      - NVML_ENABLED=${NVML_ENABLED:-true}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-5}
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-5}
      # GPU layers: 20 for 8 GB (RTX 3070) + 27B Q4; 99 for 24 GB.
      - CPPWORKER_GPU_LAYERS=${CPPWORKER_GPU_LAYERS:-20}
      - CPPWORKER_FLASH_ATTN_TYPE=${CPPWORKER_FLASH_ATTN_TYPE:--1}
      - CPPWORKER_N_THREADS=${CPPWORKER_N_THREADS:-0}
      - CPPWORKER_NUMA=${CPPWORKER_NUMA:-false}
      - CPPWORKER_USE_MMAP=${CPPWORKER_USE_MMAP:-true}
      - CPPWORKER_AUTO_OFFLOAD=${CPPWORKER_AUTO_OFFLOAD:-true}
      - CPPWORKER_AUTO_TUNE_NCTX=${CPPWORKER_AUTO_TUNE_NCTX:-true}
      - CPPWORKER_RAM_FALLBACK_N_CTX=${CPPWORKER_RAM_FALLBACK_N_CTX:-true}
      - CPPWORKER_RAM_FALLBACK_GPU_LAYERS=${CPPWORKER_RAM_FALLBACK_GPU_LAYERS:--2}
      - CPPWORKER_RAM_FALLBACK_MAX_N_CTX=${CPPWORKER_RAM_FALLBACK_MAX_N_CTX:-128000}
      - CPPWORKER_DEFAULT_ENABLE_REASONING=${CPPWORKER_DEFAULT_ENABLE_REASONING:-false}
      - CPPWORKER_ENABLE_REASONING=${CPPWORKER_ENABLE_REASONING:-false}
      - CPPWORKER_ENABLE_BATCHED_PARALLEL=${CPPWORKER_ENABLE_BATCHED_PARALLEL:-false}
      # Parallel model slots (n_parallel / n_seq_max). 0 = a single slot.
      #
      # The in-container code reads exactly CPPWORKER_N_PARALLEL
      # (internal/cppbackend/config.go: LoadConfigFromEnv).
      #
      # What it actually does (verified against c/llama.cpp gguf-v0.19.0-1369,
      # kv_unified=false): llama_context: n_ctx_seq = GGML_PAD(n_ctx / n_seq_max, 256).
      # Slots do NOT multiply the KV cache and do NOT increase VRAM usage — they
      # SPLIT the context window between clients:
      #   contextSize=8192 + parallel=2 -> n_ctx=8192, n_ctx_seq=4096
      #   free VRAM: parallel=1 -> 5197 MB, 2 -> 5197 MB, 3 -> 5191 MB
      # To give every client the window it needs, set the total window
      # = window x slots, or use the `contextPerSeq` field ("window per client").
      #
      # NOTE: AGENT_MAX_CONCURRENT_REQUESTS is NOT needed — cppworker reports its
      # own capacity (effectiveNParallel) to the balancer.
      - CPPWORKER_N_PARALLEL=${CPPWORKER_N_PARALLEL:-0}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${MODELS_DIR:-../models}:/app/models
      - cppworker_cache:/app/.cache
    ports:
      # Inference port. Required outside in the worker scenario (balancer on
      # another machine); on a single box it is enough inside the network, but
      # publishing it does no harm.
      - "${CPPWORKER_PORT_HOST:-18092}:18092"
    networks: [ol-net]
    healthcheck:
      test: ["CMD", "/app/cppworker", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["worker", "full"]

  # ===========================================================================
  # imageworker — image generation (sdworker -> sd-server / stable-diffusion.cpp)
  # Profiles: worker | full
  # ===========================================================================
  # A separate backend of type image_cpp (port 18093): its own bundle directory,
  # its own engine, its own OpenAI/A1111 surface. The balancer routes ONLY image
  # requests to it (image_cpp never enters the text pool and vice versa) and
  # exposes /v1/images/* on its OpenAI surface (18079).
  #
  # The WORKER registers itself (Go-side, cmd/sdworker/balancer_register.go):
  # POST /api/v1/backends with backendType=image_cpp and imagePort=18093. GPU
  # metrics arrive from the embedded agent inside sdworker (AGENT_EMBEDDED=on).
  #
  # GPU. sd.cpp publishes no Linux-CUDA builds (release master-929 has
  # CPU/Vulkan/ROCm; CUDA is Windows-only), so the default is Vulkan and the
  # NVIDIA driver reaches the container via `runtime: nvidia` + the `graphics`
  # capability (that capability is what mounts nvidia_icd.json/libnvidia-glcore;
  # without it Vulkan cannot see an NVIDIA card). /dev/dri is not needed for
  # NVIDIA, but is required for AMD/Intel — then drop `runtime: nvidia` and
  # uncomment `devices` (ready-made variant: deployments/docker-compose.imageworker.yml).
  # CUDA variant: build an image with your OWN sd-server binary (there are no
  # ready Linux-CUDA releases):
  #   cp build/bin/sd-server docker/imageworker/vendor/sd-server-cuda
  #   SD_SERVER_BIN=sd-server-cuda \
  #   IMAGE_WORKER_RUNTIME_BASE=nvidia/cuda:12.6.0-runtime-ubuntu24.04 \
  #   docker compose -f docker-compose.stack.yml --profile full up -d --build imageworker
  #
  # HOW TO DISABLE (image not built, or the GPU is busy with a text model):
  #   primary : docker compose -f docker-compose.stack.yml --profile full up -d --scale imageworker=0
  #   reliable (any compose version, works even when the container exists):
  #             docker compose -f docker-compose.stack.yml --profile full rm -sf imageworker
  #   by profile : --profile balancer (management only) instead of --profile full
  #   permanently: remove the service from this file
  # Re-enable: up -d without --scale imageworker=0 (the image builds on --build).
  # NOTE: the service sets container_name, so compose refuses MORE than one
  # container (--scale imageworker=2 conflicts on the name). Disabling (=0) and
  # running one both work.
  #
  # MODELS. A bundle is a DIRECTORY <MODELS_DIR>/image/<name>/ with engine files
  # (diffusion + VAE + text encoders) and profile.json, created manually or by the
  # worker's HF layer (image-model button in the WebUI). An empty directory is not
  # an error: the worker starts, /health answers 200, generation returns
  # model_not_found.
  # ===========================================================================
  imageworker:
    image: ${IMAGE_REGISTRY:-}ollama-legion/imageworker:${IMAGE_WORKER_TAG:-vulkan}
    build:
      context: ..
      dockerfile: docker/imageworker/Dockerfile
      # The build target selects the ENGINE of the image:
      #   imageworker-vulkan (default) — release Vulkan asset of sd.cpp: works on
      #     AMD/Intel and on NVIDIA where the nvidia-ICD is passed through (Linux);
      #   imageworker-cuda — sd.cpp built from source with CUDA (the project has no
      #     Linux-CUDA release). Needed where Vulkan-NVIDIA does not reach the
      #     container (e.g. Windows + Docker Desktop/WSL2: nvidia-smi sees the card
      #     but nvidia_icd.json is missing, so the Vulkan engine falls back to CPU:
      #     251 s for 512x512/8 steps vs 9-76 s on GPU). CUDA requires RUNTIME_BASE
      #     with a CUDA runtime — see IMAGE_WORKER_RUNTIME_BASE below.
      target: ${IMAGE_WORKER_BUILD_TARGET:-imageworker-vulkan}
      args:
        SD_SERVER_REVISION: ${SD_SERVER_REVISION:-master-929-3f8527a}
        SD_SERVER_ASSET: ${SD_SERVER_ASSET:-sd-master-3f8527a-bin-Linux-Ubuntu-24.04-x86_64-vulkan.zip}
        SD_SERVER_BIN: ${SD_SERVER_BIN:-}
        RUNTIME_BASE: ${IMAGE_WORKER_RUNTIME_BASE:-ubuntu:24.04}
        CUDA_DEVEL_BASE: ${IMAGE_WORKER_CUDA_DEVEL_BASE:-dockerhub.timeweb.cloud/nvidia/cuda:12.2.0-devel-ubuntu22.04}
        CUDA_ARCH: ${IMAGE_WORKER_CUDA_ARCH:-86}
        SD_SERVER_REF: ${SD_SERVER_REF:-3f8527a46c54ecf4cb4ed6003da8e8982283c73c}
    container_name: ol-stack-imageworker
    restart: unless-stopped
    # Same GPU path as cppworker-gpu above: nvidia-container-runtime.
    runtime: nvidia
    environment:
      - SDWORKER_HOST=0.0.0.0
      - SDWORKER_PORT=18093
      # Internal engine port (loopback inside the container). Not to be confused
      # with 18093: only the worker API is published, otherwise clients would
      # bypass request normalisation.
      - SDWORKER_SD_SERVER_PORT=${SDWORKER_SD_SERVER_PORT:-18094}
      # Image-model bundle directory inside the container (host: <MODELS_DIR>/image).
      - SDWORKER_IMAGE_MODELS_DIR=/app/models/image
      - SDWORKER_IMAGES_DIR=/app/data/images
      - SDWORKER_IDLE_UNLOAD_MINUTES=${SDWORKER_IDLE_UNLOAD_MINUTES:-30}
      - SDWORKER_MAX_CONCURRENT=${SDWORKER_MAX_CONCURRENT:-64}
      # R88: generation timeout. 0 = NO CAP (project timeout doctrine: caps are
      # opt-in only, we wait for the job's terminal state). A nonzero value WILL
      # cut a long generation: 2048x2048/40 steps on an RTX 3070 takes ~22 min.
      # See docs/image-generation.md §17.
      - SDWORKER_GENERATION_TIMEOUT_SEC=${SDWORKER_GENERATION_TIMEOUT_SEC:-0}
      - SDWORKER_PRELOAD_MODEL=${SDWORKER_PRELOAD_MODEL:-}
      # Worker URL as CLIENTS see it: used in response_format:"url".
      # Default targets a local client (the port is published below).
      # For external clients set SDWORKER_BASE_URL=http://<host>:18093 in .env.
      - SDWORKER_BASE_URL=${SDWORKER_BASE_URL:-http://localhost:18093}
      # HF layer for image bundles (gated models / mirror).
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MIRROR=${HF_MIRROR:-}
      # The NVIDIA Vulkan ICD ships with the driver: the `graphics` capability is
      # REQUIRED (compute,utility provide only CUDA/NVML).
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      # --- Balancer auto-registration (SDWORKER_* — the names the Go code reads)
      # BALANCER_URL is the canonical stack name: in the worker scenario the .env
      # supplies the REMOTE balancer address and the worker registers there.
      - SDWORKER_BALANCER_URL=${SDWORKER_BALANCER_URL:-${BALANCER_URL:-http://loadbalancer:18081}}
      - SDWORKER_BALANCER_TOKEN=${SDWORKER_BALANCER_TOKEN:-${CPPWORKER_API_TOKEN:-}}
      - SDWORKER_BACKEND_ID=${SDWORKER_BACKEND_ID:-imageworker}
      # Host under which the balancer reaches this worker. Defaults to the ol-net
      # service name (single-box case), but on a SEPARATE machine it MUST be that
      # machine's LAN address — the balancer proxies image requests to
      # <this host>:18093, and "imageworker" does not resolve from another host.
      # Mirrors what AGENT_CPPWORKER_HOST=${BACKEND_HOST:-...} does for cppworker,
      # so BACKEND_HOST in .env fixes both workers at once.
      - SDWORKER_ADVERTISE_HOST=${SDWORKER_ADVERTISE_HOST:-${BACKEND_HOST:-imageworker}}
      - SDWORKER_REGISTER_DISABLE=${SDWORKER_REGISTER_DISABLE:-false}
      # --- EMBEDDED METRICS AGENT ---------------------------------------------
      #
      # Previously a separate `agent` container collected image-backend metrics. It
      # registered as a SEPARATE record (host=cppworker-gpu-agent,
      # backendType=llama_cpp), so one physical worker produced two records, while
      # the image record itself kept hasAgent=false and agentPort=18032 (a FOREIGN
      # container's port) with gpuMemory/vramUsagePercent reported as zeros.
      #
      # NOW the worker starts an agent IN ITS OWN PROCESS and registers under the
      # SAME ID (SDWORKER_BACKEND_ID). The balancer's "backend exists" branch sets
      # HasAgent=true and writes metrics into the same record. The image worker no
      # longer needs a separate container.
      #
      # ENABLED by default, exactly like cppworker (CPPWORKER_AGENT_EMBEDDED).
      #
      # This used to default to `off` while cppworker defaulted to `on`. A fresh
      # remote worker following .env.example therefore got a visible image record
      # with NO telemetry at all: hasAgent=false, agentPort=18032 (a foreign
      # container's port), gpuMemory/vramUsagePercent stuck at zeros. Seen on the
      # second machine of the live pair ("IMAGEWORKER-34: 0.0%, 0 MB"). Asymmetric
      # defaults on two identical workers are a trap, so the default is now `on`.
      # Set IMAGE_WORKER_AGENT_EMBEDDED=off only to collect image metrics with the
      # external `agent` container instead (legacy-agent profile).
      - AGENT_EMBEDDED=${IMAGE_WORKER_AGENT_EMBEDDED:-on}
      - AGENT_ID=${SDWORKER_BACKEND_ID:-imageworker}
      # TRAP (fixed 2026-10-07): this line used to read
      #     AGENT_PUBLIC_HOST=${SDWORKER_ADVERTISE_HOST:-imageworker}
      # and that silently defeated BACKEND_HOST.
      #
      # Compose interpolation is STATIC TEXT substitution: `${SDWORKER_ADVERTISE_HOST}`
      # here reads the host environment / `.env`, NOT the value this service assigns to
      # SDWORKER_ADVERTISE_HOST two lines up (line 467). Nothing sets
      # SDWORKER_ADVERTISE_HOST in `.env`, so the expression always resolved to the
      # literal fallback `imageworker` — the container name.
      #
      # Effect on a remote machine with BACKEND_HOST=192.168.13.34:
      #   - sdworker's OWN self-registration got the right host (line 467 does nest
      #     BACKEND_HOST), creating the record as 192.168.13.34;
      #   - the embedded agent then registered under the SAME backend ID with
      #     AGENT_PUBLIC_HOST=imageworker, and the balancer's "backend exists" branch
      #     writes `Host` from the request — so it OVERWROTE the correct address with
      #     the container name.
      # cppworker was unaffected because its agent entry (line 301) uses
      # ${BACKEND_HOST:-...} directly, with no intermediate variable.
      #
      # Symptom: the image record's HOST shows the container name, the balancer
      # resolves it to ITS OWN container, and image requests for the remote machine
      # silently go to the first machine — "models on disk exist" while that worker
      # has none.
      #
      # Rule: an `environment:` entry may only interpolate a variable that the
      # OPERATOR can set (.env) or one nested in the same expression. Never a
      # variable that an earlier line of this same list produces.
      - AGENT_PUBLIC_HOST=${SDWORKER_ADVERTISE_HOST:-${BACKEND_HOST:-imageworker}}
      # /health and metrics port of the embedded agent. NOT 18032: the external
      # `agent` container listens there, and the balancer polls metrics on the
      # record's own agentPort.
      - AGENT_EMBEDDED_PORT=${IMAGE_WORKER_AGENT_PORT:-18033}
      - BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - BALANCER_TOKEN=${SDWORKER_BALANCER_TOKEN:-${CPPWORKER_API_TOKEN:-}}
      - GPU_MODE=${GPU_MODE:-auto}
      - NVML_ENABLED=${NVML_ENABLED:-true}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-5}
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-5}
      # Capacity: same as the number of requests the worker serves in parallel
      # (SDWORKER_MAX_CONCURRENT). A value >0 overrides auto-detection.
      - AGENT_MAX_CONCURRENT_REQUESTS=${SDWORKER_MAX_CONCURRENT:-64}
      # Token the image worker itself expects on protected endpoints: the balancer
      # receives it in the backend record and can authorise when proxying.
      - CPPWORKER_API_TOKEN=${CPPWORKER_API_TOKEN:-}
      - API_TOKEN=${CPPWORKER_API_TOKEN:-}
    volumes:
      # Same models directory as cppworker (../models): text .gguf in the root,
      # image bundles under image/. The volume also holds HF temp downloads
      # (../models/downloads) — otherwise a 6-12 GB .download would fill the
      # container layer and be lost on re-creation.
      - ${MODELS_DIR:-../models}:/app/models:rw
      # Generated images (response_format:"url") — collected from the host.
      - ${IMAGE_OUTPUT_DIR:-../data/images}:/app/data/images:rw
      - imageworker_cache:/app/.cache/huggingface
      # LoRA/ESRGAN upscalers (optional): the engine scans these directories at
      # runtime. Uncomment after putting files into ../models/lora and
      # ../models/upscalers:
      # - ${MODELS_DIR:-../models}/lora:/app/lora:ro
      # - ${MODELS_DIR:-../models}/upscalers:/app/upscalers:ro
    ports:
      # Worker API. Published on purpose: response_format:"url" returns a link to
      # this port, and it can also be used to bypass the balancer.
      - "${SDWORKER_PORT:-18093}:18093"
    networks: [ol-net]
    # Wait for a READY balancer, not merely a started one: without the dependency
    # the worker started first, its first POST /api/v1/backends hit a closed port
    # and retried every 30 s — which looked like "the image backend never appeared
    # in the balancer".
    #
    # OPTIONAL dependency (required:false), otherwise the backend-only scenario
    # (`--profile worker`, balancer elsewhere) was rejected entirely: compose
    # validates depends_on even for services outside the active profile. With no
    # loadbalancer in the profile the worker simply registers via BALANCER_URL
    # with the external balancer.
    depends_on:
      loadbalancer:
        condition: service_healthy
        required: false
    healthcheck:
      # Through the binary itself (as cppworker does): /health answers 200 even
      # without a model, so idle-unload never marks the container unhealthy.
      test: ["CMD", "/app/sdworker", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Longer than cppworker: the first engine start warms up Vulkan.
      start_period: 60s
    profiles: ["worker", "full"]

  # ═══════════════════════════════════════════════════════════════════════════
  # agent — metrics and registration for OLLAMA backends
  # Profiles: worker | legacy-agent
  #
  # The ROLE of this container has narrowed. The metrics collector for
  # llama.cpp workers now lives INSIDE cppworker (AGENT_EMBEDDED=on, same backend
  # ID, metrics port 18034). Two collectors on one backend send metrics in turn and
  # values flap (notably gpu.uuids), so the `full` profile no longer has an
  # external agent — it uses the embedded one.
  #
  # WHERE IT IS STILL NEEDED:
  #   * worker — "backends only, balancer elsewhere": starts cppworker +
  #     imageworker + this agent. The agent covers backends that have no Go code of
  #     ours (Ollama).
  #   * legacy-agent — explicit rollback: an external agent INSTEAD of the
  #     embedded one. Requires CPPWORKER_AGENT_EMBEDDED=off, otherwise the two
  #     collectors interfere.
  # ===========================================================================
  agent:
    image: ${IMAGE_REGISTRY:-}ollama-legion/agent:${AGENT_TAG:-r83-submodule-v22}
    # Built from source for the same reason as cppworker-gpu: with only `image:`
    # compose could not build locally when the image was missing.
    # target agent-gpu + ENABLE_NVML=true match scripts/build-containers.ps1
    # (`docker build --build-arg ENABLE_NVML=true ... -f docker/agent/Dockerfile`):
    # the NVML build is what provides real GPU/VRAM metrics.
    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
      target: agent-gpu
      args:
        ENABLE_NVML: "true"
        GIT_COMMIT: ${AGENT_GIT_COMMIT:-unknown}
        BUILD_DATE: ${AGENT_BUILD_DATE:-unknown}
    container_name: ol-stack-agent
    # Profiles: legacy-agent ONLY.
    #
    # It used to be ["worker", "legacy-agent"], which meant `--profile worker`
    # started the agent even though it has nothing to do on a backend-only host:
    # cppworker and imageworker each run their OWN embedded metrics agent
    # (AGENT_EMBEDDED=on), and the external agent's only remaining job is
    # connecting an OLLAMA backend. On a worker host it was a useless container
    # that additionally competed for the backend record's agentPort.
    #
    # If you DO need it (Ollama backend on this host, or a rollback to the
    # external collector), start it explicitly:
    #   docker compose ... --profile legacy-agent up -d agent
    profiles: ["legacy-agent"]
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      cppworker-gpu:
        condition: service_healthy
        # OPTIONAL: the agent waits for a ready cppworker to register the same
        # address, but in the legacy-agent profile (rollback to the external
        # collector) cppworker may not be up at all — without required:false
        # compose would reject that launch entirely.
        required: false
    environment:
      - AGENT_ID=${AGENT_ID:-cppworker-gpu-bundled-agent}
      - AGENT_PORT=18032
      # Version of the running image in the agent startup banner.
      - APP_VERSION=${AGENT_TAG:-r83-submodule-v22}

      # --- Balancer connection: ADMIN API, port 18081 -------------------------
      # Scenario 1: service name inside this network (the default).
      # Scenario 2: set BALANCER_URL in .env.bundled-with-agent —
      #             http://<balancer-host>:18081
      - BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - BALANCER_TOKEN=${CPPWORKER_API_TOKEN:?set CPPWORKER_API_TOKEN in deployments/.env}
      # The agent passes the balancer the token cppworker expects. Without it the
      # balancer cannot authorise on cppworker's protected endpoints, and editing
      # model parameters from the WebUI fails with 401 "invalid or missing API
      # token" even though the token is identical in every .env.
      # Source: ONE stack variable — deployments/.env -> CPPWORKER_API_TOKEN.
      - CPPWORKER_API_TOKEN=${CPPWORKER_API_TOKEN:?set CPPWORKER_API_TOKEN in deployments/.env}

      # --- How the agent reaches cppworker (inside the network) ---------------
      # This used to be AGENT_CPPWORKER_URL, which the code does NOT read, so the
      # agent never knew cppworker's address.
      - CPPWORKER_URL=http://cppworker-gpu:18092

      # --- Backend type: DEPENDS ON THE SCENARIO ------------------------------
      #
      # llama.cpp workers no longer need this agent — their metrics collector is
      # embedded in cppworker (AGENT_EMBEDDED=on). The external agent now has
      # exactly one job: connect an OLLAMA backend, which has no Go code of ours.
      #
      # This used to be hardcoded to `BACKEND_TYPE=llama_cpp`, which BROKE mixed
      # mode: running an Ollama backend next to cppworker via the stock compose was
      # impossible — the agent would register Ollama as llama.cpp and the balancer
      # would apply the wrong request path (n_ctx/KV rules to Ollama).
      #
      # VALUES:
      #   llama_cpp — previous behaviour (agent as an external observer of cppworker);
      #   ollama    — connect Ollama: also set OLLAMA_URL below.
      # Without an explicit value the previous llama_cpp default applies, so
      # existing stands notice nothing.
      - BACKEND_TYPE=${AGENT_BACKEND_TYPE:-llama_cpp}
      # Ollama address for BACKEND_TYPE=ollama. The default is a host Ollama on the
      # standard port, reachable via host.docker.internal.
      # For Ollama on another machine: OLLAMA_URL=http://<host>:11434 in .env.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}

      # What the agent reports to the balancer as the backend address. In scenario
      # 1 a service name; in scenario 2 BACKEND_HOST (an address visible FROM the
      # balancer) — without it the record points at the container hostname and the
      # balancer cannot reach :18092. The port must match CPPWORKER_PORT.
      - AGENT_CPPWORKER_HOST=${BACKEND_HOST:-cppworker-gpu}
      - AGENT_CPPWORKER_PORT=${CPPWORKER_PORT:-18092}
      # Address the balancer uses for the agent's own /health.
      - AGENT_PUBLIC_HOST=${AGENT_PUBLIC_HOST:-${BACKEND_HOST:-cppworker-gpu-agent}}
      - AGENT_PUBLIC_PORT=18032
      - NODE_LABELS=${NODE_LABELS:-gpu,llamacpp}

      # --- Capacity: how many parallel requests the backend accepts -----------
      # 0 (default) = AUTO: the agent asks cppworker for its defaultNParallel
      #   (env CPPWORKER_N_PARALLEL) and reports exactly that. This keeps the
      #   worker slots as the SINGLE place to configure.
      # >0 = an operator limit: takes priority and is never overwritten by
      #   automation. Needed only to deliberately admit fewer (or more) requests
      #   than the model has slots.
      #
      # The default used to be 1, so the variable was ALWAYS set and the agent
      # never read the value from cppworker. With CPPWORKER_N_PARALLEL=2 that
      # desynchronised them: the worker held two slots while the balancer queued the
      # second request ("the second client got 503").
      #
      # Never inflate it: a single-slot cppworker serves ONE request at a time, and
      # phantom "free slots" produce rejections and hangs.
      - AGENT_MAX_CONCURRENT_REQUESTS=${AGENT_MAX_CONCURRENT_REQUESTS:-0}
      - AGENT_MAX_MODELS=${AGENT_MAX_MODELS:-4}
      - AGENT_WEIGHT=${AGENT_WEIGHT:-1}

      # This used to be AGENT_MODE — the code reads GPU_MODE.
      - GPU_MODE=gpu
      - NVML_ENABLED=true
      # These used to be AGENT_COLLECT_INTERVAL / AGENT_HEARTBEAT_INTERVAL.
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-15}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30}
      - LOG_LEVEL=${AGENT_LOG_LEVEL:-info}
      - LOG_FORMAT=text
    ports:
      - "${AGENT_PORT_HOST:-18032}:18032"
    networks: [ol-net]
    healthcheck:
      test: ["CMD", "/app/agent", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  ol-net:
    name: ol-net

volumes:
  balancer_data:
    name: ol-balancer-data
  cppworker_cache:
    name: ol-cppworker-cache
  # HF cache of the image worker (text encoder/VAE weights fetched via the HF layer).
  imageworker_cache:
    name: ol-imageworker-cache
