# GitHub Actions CI для OllamaLegion
#
# Стратегия: self-hosted Windows runner (primary) + ubuntu-latest (fallback).
# Self-hosted использует persistent cache из C:\actions-runner, поэтому
# build 5-10 сек incremental vs 5-10 мин cold-cache на ubuntu-latest.
#
# Self-hosted runner требует Windows + Go 1.21+ + Docker + node + cmake.
# Установка: см. docs/ci/self-hosted-runner.md и scripts/setup-runner.ps1.
#
# Ubuntu fallback работает для stub-only тестов (cgo с stub C-bridge).
# На ubuntu НЕ работают Windows-specific тесты (internal/agent/nvml_windows.go).
---

name: CI

# R60.51 (2026-09-12): "on" must be quoted — без кавычек YAML парсер
# (включая GitHub Actions strict parser) трактует `on:` как boolean `True:`
# и workflow валится с "Invalid workflow file" на любом push.
"on":
  push:
    branches: [centurion, main, integration/**, feature/**]
  pull_request:
    branches: [centurion, main, integration/**]
  workflow_dispatch:  # ручной запуск через UI

# Отмена in-progress для одного и того же workflow (новые push отменяют старые)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"           # fallback runner'ы используют эту версию
  GO_VERSION_WIN: "1.25.2"     # self-hosted runner — auto-download, если нет
  GOPROXY: https://proxy.golang.org,direct
  CGO_ENABLED: 1               # нужен для cgo + C-bridge

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build + test на self-hosted Windows runner (primary, с persistent cache)
  # ---------------------------------------------------------------------------
  test-self-hosted:
    name: Test (self-hosted Windows)
    runs-on: [self-hosted, Windows, ollamalegion-ci]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false  # c/llama.cpp — gitlink без .gitmodules
          fetch-depth: 0     # для git log в комментариях

      # Init Go env — actions/setup-go@v5 зависает под LocalSystem (SYSTEM account),
      # поэтому ищем go.exe вручную. Стратегия: hardcoded → PATH → known paths →
      # recursive C:\ → auto-download. Используем ДВОЙНУЮ propagation:
      # GITHUB_PATH (для go.exe в PATH последующих шагов) + GITHUB_ENV (для GOROOT/GOEXE
      # как fallback, если GITHUB_PATH не сработал под SYSTEM account).
      #
      # Все операции с GITHUB_PATH/GITHUB_ENV обёрнуты в try/catch и используют
      # Add-Content -Encoding ASCII (без BOM, критично для PowerShell 5.1).
      - name: "Init Go env (dual propagation: GITHUB_PATH + GITHUB_ENV)"
        shell: powershell
        run: |
          # ---- helpers: пишем в GITHUB_PATH / GITHUB_ENV (ASCII, без BOM) ----
          function Add-Path($d) {
            try { Add-Content -Path $env:GITHUB_PATH -Value $d -Encoding ASCII } catch { }
          }
          function Set-Env($k, $v) {
            try { Add-Content -Path $env:GITHUB_ENV -Value "$k=$v" -Encoding ASCII } catch { }
          }

          $goDir = $null

          # ---------- 1) hardcoded paths ----------
          foreach ($p in @(
              "C:\Program Files\Go\bin\go.exe",
              "C:\Go\bin\go.exe"
          )) {
            if ($p -and (Test-Path $p)) {
              $goDir = Split-Path $p -Parent
              Write-Host "FOUND (hardcoded): $goDir"
              break
            }
          }

          # ---------- 2) Get-Command / where.exe ----------
          if (-not $goDir) {
            Write-Host "hardcoded: NOT found, trying PATH lookup..."
            try {
              $exe = Get-Command go.exe -ErrorAction SilentlyContinue
              if ($exe) { $goDir = Split-Path $exe.Source -Parent; Write-Host "FOUND (Get-Command): $goDir" }
            } catch { }
          }
          if (-not $goDir) {
            try {
              $w = where.exe go.exe 2>$null
              if ($w) { $goDir = Split-Path ($w | Select-Object -First 1) -Parent; Write-Host "FOUND (where.exe): $goDir" }
            } catch { }
          }

          # ---------- 3) known paths ----------
          if (-not $goDir) {
            $known = @()
            try { if (Test-Path env:GOROOT) { $known += "$env:GOROOT\bin" } } catch { }
            try { $known += "$env:ProgramFiles\Go\bin" } catch { }
            try { $known += "${env:ProgramFiles(x86)}\Go\bin" } catch { }
            try { $known += "$env:LocalAppData\go\bin" } catch { }
            try { $known += "$env:ALLUSERSPROFILE\chocolatey\bin" } catch { }
            $known += "C:\Go\bin"
            $known += "C:\Program Files\Go\bin"
            $known += "C:\ProgramData\chocolatey\bin"
            try { $known += "$env:SystemDrive\Go\bin" } catch { }
            try { $known += "$env:USERPROFILE\scoop\apps\go\current\bin" } catch { }
            try { $known += "$env:ALLUSERSPROFILE\scoop\apps\go\current\bin" } catch { }
            foreach ($d in $known) {
              try {
                if ($d -and (Test-Path "$d\go.exe")) { $goDir = $d; Write-Host "FOUND (known): $goDir"; break }
              } catch { }
            }
          }

          # ---------- 4) recursive search C:\ ----------
          if (-not $goDir) {
            Write-Host "known: NOT found, recursive C:\... (may take 30-60 sec)"
            try {
              $r = where.exe /R "C:\" go.exe 2>$null | Select-Object -First 1
              if ($r) { $goDir = Split-Path $r -Parent; Write-Host "FOUND (recursive): $goDir" }
            } catch { }
          }

          # ---------- 5) auto-download (fallback) ----------
          if (-not $goDir) {
            Write-Host "recursive: NOT found. Auto-downloading Go $env:GO_VERSION_WIN ..."
            try {
              $goVersion = "$env:GO_VERSION_WIN"
              $url = "https://go.dev/dl/go$goVersion.windows-amd64.zip"
              $zipPath = "$env:TEMP\go.zip"
              $installDir = "C:\Go"
              if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
              curl.exe -sSL --connect-timeout 30 -o $zipPath $url
              if (Test-Path $zipPath) {
                Write-Host "Downloaded: $((Get-Item $zipPath).Length) bytes"
                if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
                Expand-Archive -Path $zipPath -DestinationPath "C:\" -Force
                if (Test-Path "$installDir\bin\go.exe") { $goDir = "$installDir\bin"; Write-Host "Installed to: $goDir" }
              }
            } catch { Write-Host "Auto-download failed: $_" }
          }

          # ---------- 6) apply PATH + GOROOT/GOEXE env vars + verify ----------
          if ($goDir) {
            $env:Path = "$goDir;$env:Path"
            Add-Path $goDir
            $goRoot = (Resolve-Path "$goDir\..").Path
            Set-Env "GOROOT" $goRoot
            Set-Env "GOEXE" "$goDir\go.exe"
            $v = & "$goDir\go.exe" version 2>&1
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::go version failed"; exit 1 }
            Write-Host "Go OK: $v"
            & "$goDir\go.exe" env GOROOT GOPATH GOMODCACHE GOCACHE 2>&1 | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "::error::Go not found and auto-download failed"
            exit 1
          }

      - name: Build all binaries (stub mode)
        shell: powershell
        run: |
          $go = if ($env:GOEXE -and (Test-Path $env:GOEXE)) { $env:GOEXE } else { "go.exe" }
          & $go build -tags llama_stub -v -o bin\balancer-stub.exe      .\cmd\balancer\
          & $go build -tags llama_stub -v -o bin\cppworker-stub.exe    .\cmd\cppworker\
          & $go build -tags llama_stub -v -o bin\agent-stub.exe        .\cmd\agent\

      - name: Verify healthcheck (stub)
        shell: powershell
        run: |
          .\bin\cppworker-stub.exe -healthcheck

      - name: Test (internal packages, -race)
        shell: powershell
        run: |
          $go = if ($env:GOEXE -and (Test-Path $env:GOEXE)) { $env:GOEXE } else { "go.exe" }
          # R60.29: bump 180s → 300s. R52.4b TestMain watchdog убран, R60.29
          # полагается на go test -timeout как единственный protection
          # от infinite hangs. internal/balancer имеет leaked goroutines
          # от pre-existing tests (R52.4 known issue), они замедляют
          # test runner на 60-90s в linux native. 300s = matches
          # per-job timeout.
          & $go test -race -tags llama_stub -timeout 300s ./internal/...

      - name: Test (cmd packages, stub mode)
        shell: powershell
        run: |
          $go = if ($env:GOEXE -and (Test-Path $env:GOEXE)) { $env:GOEXE } else { "go.exe" }
          & $go test -tags llama_stub -timeout 60s ./cmd/...

      - name: Test (integration, may use Docker)
        shell: powershell
        run: |
          $go = if ($env:GOEXE -and (Test-Path $env:GOEXE)) { $env:GOEXE } else { "go.exe" }
          & $go test -tags llama_stub -timeout 300s -short ./tests/...
        # -short: пропускает e2e тесты, требующие docker-compose stack

      - name: Go vet
        shell: powershell
        run: |
          $go = if ($env:GOEXE -and (Test-Path $env:GOEXE)) { $env:GOEXE } else { "go.exe" }
          & $go vet -tags llama_stub ./...

      - name: Generate coverage (race + atomic)
        if: success()
        shell: powershell
        run: |
          $go = if ($env:GOEXE -and (Test-Path $env:GOEXE)) { $env:GOEXE } else { "go.exe" }
          & $go test -tags llama_stub -coverprofile=coverage.out -covermode=atomic -timeout 180s ./internal/...

      - name: Coverage summary
        if: success()
        shell: powershell
        run: |
          $go = if ($env:GOEXE -and (Test-Path $env:GOEXE)) { $env:GOEXE } else { "go.exe" }
          & $go tool cover -func=coverage.out | Tee-Object -FilePath coverage-func.txt
          Get-Content coverage-func.txt | Select-Object -Last 1

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-self-hosted
          path: |
            coverage.out
            coverage-func.txt

  # ---------------------------------------------------------------------------
  # Job 2: Build + test на ubuntu-latest (fallback, если self-hosted offline)
  #
  # Этот job ВСЕГДА запускается параллельно (continue-on-error: true в первом
  # job'е означает, что если self-hosted упал — этот может дать сигнал).
  # На ubuntu работают только stub-only тесты (без Windows nvml).
  # ---------------------------------------------------------------------------
  test-ubuntu-fallback:
    name: Test (ubuntu-latest fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false  # c/llama.cpp — gitlink без .gitmodules
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Build all binaries (stub mode)
        run: |
          mkdir -p bin
          go build -tags llama_stub -v -o bin/balancer-stub      ./cmd/balancer/
          go build -tags llama_stub -v -o bin/cppworker-stub    ./cmd/cppworker/
          go build -tags llama_stub -v -o bin/agent-stub        ./cmd/agent/

      # Разбивка internal/... на пакеты, чтобы видеть, какой конкретно падает
      - name: Test internal/agent (no race)
        run: |
          go test -tags llama_stub -timeout 120s -v ./internal/agent/ 2>&1 | tail -5

      - name: Test internal/api (no race)
        run: |
          go test -tags llama_stub -timeout 120s -v ./internal/api/ 2>&1 | tail -5

      - name: Test internal/balancer (-race)
        if: always()
        run: |
          # R60.29: bump 180s → 300s. R52.4b TestMain watchdog убран.
          # internal/balancer tests с leaked goroutines занимают 60-90s
          # в ubuntu-latest. 300s = matches self-hosted job per-step timeout.
          go test -race -tags llama_stub -timeout 300s -v ./internal/balancer/ 2>&1 | tail -20

      - name: Test internal/config (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./internal/config/ 2>&1 | tail -5

      - name: Test internal/cppbackend (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 120s -v ./internal/cppbackend/ 2>&1 | tail -10

      - name: Test internal/rpccoordinator (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./internal/rpccoordinator/ 2>&1 | tail -5

      - name: Test internal/rpcworker (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./internal/rpcworker/ 2>&1 | tail -5

      - name: Test internal/virtualmodel (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./internal/virtualmodel/ 2>&1 | tail -5

      - name: Test internal/modelreplication (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./internal/modelreplication/ 2>&1 | tail -5

      - name: Test cmd/balancer (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./cmd/balancer/ 2>&1 | tail -10

      - name: Test cmd/cppworker (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./cmd/cppworker/ 2>&1 | tail -10

      - name: Test cmd/agent (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./cmd/agent/ 2>&1 | tail -5

      - name: Test cmd/monitor (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./cmd/monitor/ 2>&1 | tail -5

      - name: Test cmd/rpcworker (no race)
        if: always()
        run: |
          go test -tags llama_stub -timeout 60s -v ./cmd/rpcworker/ 2>&1 | tail -5

      - name: Test tests (integration, short)
        if: always()
        run: |
          go test -tags llama_stub -timeout 120s -short -v ./tests/... 2>&1 | tail -20

      - name: Go vet
        run: |
          go vet -tags llama_stub ./...

      - name: Generate coverage
        if: success()
        run: |
          # R60.29: bump 180s → 300s (matches other internal/ test steps)
          go test -tags llama_stub -coverprofile=coverage.out -covermode=atomic -timeout 300s ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: coverage.out


  # ---------------------------------------------------------------------------
  # Job 2.5: C-bridge regression test (build llama.cpp CPU-only + run test_batch_n_tokens)
  # ---------------------------------------------------------------------------
  # Ловит регрессии в c/bridge/bridge.c (например, Round 13: build_batch_with_seq
  # забыл выставить batch.n_tokens). Работает на ubuntu-latest без GPU
  # (~3-5 мин: cmake + make для libllama-common.a CPU-only + compile + run test).
  # ---------------------------------------------------------------------------
  test-c-bridge:
    name: C-bridge regression test (libllama-common.a CPU-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Build llama.cpp CPU-only (libllama-common.a)
        run: |
          set -e
          cd c/llama.cpp
          mkdir -p build
          cd build
          # CPU-only build, no CUDA, no METAL, no OpenCL. -j$(nproc) для скорости.
          cmake .. \
            -DGGML_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc) llama-common
          echo "--- libllama-common.a ---"
          ls -la common/libllama-common.a

      - name: Build c/bridge regression test
        run: |
          set -e
          mkdir -p c/bridge/tests/build
          cd c/bridge/tests/build
          cmake -DCOMMON_LIB=$(realpath ../../../c/llama.cpp/build/common/libllama-common.a) ..
          make test_batch_n_tokens

      - name: Run test_batch_n_tokens
        run: |
          set -e
          cd c/bridge/tests/build
          ./test_batch_n_tokens
          echo "--- TEST PASSED: build_batch_with_seq contract holds, Round 13 regression guarded ---"

  # ---------------------------------------------------------------------------
  # Job 3: golangci-lint (только ubuntu, чтобы не дублировать)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-ubuntu-fallback]  # запускаем после того, как хотя бы один test-job прошёл

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # c/llama.cpp — gitlink без .gitmodules
          fetch-depth: 0      # для --new-from-rev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m --new-from-rev=origin/centurion
          only-new-issues: true  # не падать на pre-existing warnings в main

  # ---------------------------------------------------------------------------
  # Job 4: i18n sync check (только ubuntu, lightweight)
  # ---------------------------------------------------------------------------
  i18n:
    name: i18n EN/RU balance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-ubuntu-fallback]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check i18n balance (en.js vs ru.js)
        run: |
          node scripts/i18n_diff.js webui/js/i18n/en.js webui/js/i18n/ru.js --strict

  # ---------------------------------------------------------------------------
  # Job 5: WebUI static checks (lightweight, no Docker).
  # Catches the "const X = (function(){...})() без window.X = X" pattern
  # which caused 7 silent regressions in the R59 series (websocket.js,
  # gguf-renderer-detail-render.js, app-core.js/showToast, gguf-api.js,
  # utils.js, renderers.js). Without this guard, the same bug class
  # would ship every time someone extracts a new module.
  # ---------------------------------------------------------------------------
  webui-static-checks:
    name: WebUI static checks (IIFE guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-ubuntu-fallback]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: IIFE-export guard (catches missing window.X = X)
        run: |
          python scripts/check_iife_exports.py

      - name: WebUI JS syntax check
        run: |
          # node --check verifies syntax of each .js file without running
          # it. Cheap (~5 sec for 44 files). Catches the R59.3 "closing
          # IIFE dropped entirely" class of bug (where a file ends
          # without `})();` because the closing brace was missed during
          # split). Node is preinstalled on ubuntu-latest.
          for f in $(find webui/js -name '*.js' -not -path '*/i18n/*'); do
            node --check "$f" || { echo "SYNTAX ERROR in $f"; exit 1; }
          done
          echo "All WebUI JS files pass syntax check"
        # Note: webui/js/i18n/* is a separate i18n pack and uses a
        # slightly different ES syntax; syntax check is optional.
