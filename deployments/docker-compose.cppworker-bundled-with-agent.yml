# OllamaLegion — bundled compose с sidecar-агентом метрик
# =============================================================================
#
# Этот файл расширяет deployments/docker-compose.cppworker-bundled.yml, добавляя
# сервис agent (target=agent-gpu, ENABLE_NVML=true), который собирает
# GPU/VRAM/CPU/llama.cpp-runtime метрики и регистрирует cppworker-gpu в
# балансере как отдельный backend с id "cppworker-gpu-bundled-agent"
# (hasAgent=true) — чтобы WebUI показывал реальные метрики на странице GGUF.
#
# Использование (Round 51.6, 2026-08-20):
#   cd deployments
#   cp .env.bundled-with-agent.example .env.bundled-with-agent
#   # отредактируйте .env.bundled-with-agent: выставьте CPPWORKER_API_TOKEN
#   # (тот же, что и в bundled-сборке) и остальные параметры.
#   docker compose -f docker-compose.cppworker-bundled-with-agent.yml up -d --build
#
# ⚠️ Round 51.6: ВСЕ сервисы используют `env_file: .env.bundled-with-agent`.
# Это АВТОМАТИЧЕСКИ загружает .env.bundled-with-agent в контейнеры — флаг
# `--env-file` БОЛЬШЕ НЕ НУЖЕН. До R51.6 docker compose auto-loads только
# `.env` (без суффикса), и если в нём нет `CPPWORKER_API_TOKEN` — WebUI
# получал HTTP 401 от балансера (env-значения в контейнерах расходились).
# Теперь: даже если `.env` содержит старые/чужие значения, .env.bundled-with-agent
# переопределяет их на уровне контейнера через env_file (приоритет env_file
# > .env в compose >= 2.24).
#
# ⚠️ Если .env.bundled-with-agent НЕ существует — `docker compose up` упадёт
# с понятной ошибкой ("env_file: .env.bundled-with-agent not found").
# Скопируйте его из примера (см. выше).
#
# Проверка:
#   curl -H "X-API-Token: $CPPWORKER_API_TOKEN" http://localhost:18081/api/v1/backends
#   # Должны быть:
#   #   - cppworker-gpu-bundled       (без агента, вес 100, fallback registration от bundled-сборки)
#   #   - cppworker-gpu-bundled-agent (с агентом, вес 100, GPU/VRAM метрики от agent)
#   # Оба ссылаются на один физический контейнер cppworker-gpu внутри compose.
#
# На странице GGUF (/api/v1/gguf/backends) de-dup логика в
# internal/api/gguf_backends_handler.go (группировка по host:port)
# автоматически склеит их в один с hasAgent=true, чтобы WebUI показывал
# реальные метрики, а не пустую заглушку.

name: ollama-legion-cppworker-bundled-with-agent

services:
  loadbalancer:
    build:
      context: ..
      dockerfile: docker/balancer/Dockerfile
    # Round 34 image (cppworker-bundled-r34) crashed after ~75min with
    # "sync: unlock of unlocked mutex" — reverted to Round 33 (stable 7h+).
    # Round 35 (r35): reload→load fallback + idleUnload disabled.
    # Round 35c (r35c): env-tunable polling timeouts (LB_NCTX_PREFLIGHT_*)
    # для моделей с auto-offload (22GB+ Qwen3.6 на 8GB VRAM, 12-15 min load).
    image: ollama-legion/balancer:cppworker-bundled-r53.4-r53  # Round 53.4 (2026-08-24): HOTFIX balancer crash.
    #   R53.4: defer recover() in async + sync reload paths (nil pointer panic protection).
    #          Also: removed `reason` field from /api/models/load fallback payload
    #          (R51.4 missed this — cppworker returned 400 "unknown field 'reason'" on fallback).
    #   R53.1: R51.3 double-done:true fix — wrapper chunk (empty delta+finish_reason)
    #          suppressed, canonical done:true only from usage chunk / writeStreamingSSEDone
    #          fallback. Fixes Cline "Did not receive done or success response in stream".
    #   R53.2: Round 34 flag-based reload REMOVED — n_ctx only (per user request 2026-08-24).
    #   R53.3: Wire-format compliance tests (9 structural tests for all Ollama API endpoints).
    container_name: ol-bundled-balancer
    restart: unless-stopped
    ports:
      - "${LB_PORT:-18080}:18080"
      - "${LB_ADMIN_PORT:-18081}:18081"
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=${LB_LOG_LEVEL:-info}
      - LB_CONFIG_PATH=/app/config/config.json
      - LB_API_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
      - LB_NCTX_RELOAD_ENABLED=${LB_NCTX_RELOAD_ENABLED:-true}
      - LB_NCTX_RELOAD_MAX_N_CTX=${LB_NCTX_RELOAD_MAX_N_CTX:-131072}
      - LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR=${LB_NCTX_RELOAD_VRAM_SAFETY_FACTOR:-0.95}
      - LB_NCTX_RELOAD_TIMEOUT_SEC=${LB_NCTX_RELOAD_TIMEOUT_SEC:-300}
      # Round 38 (2026-08-18): resource reservation headroom.
      # LB_GPU_HEADROOM_PERCENT: slot manager reserves this % of VRAM.
      # 5% = 95% threshold (default). Pre-Round 38: 15% = 85% (blocked admin
      # PUT when Qwen3.6 used 91.5% VRAM on 8GB).
      - LB_GPU_HEADROOM_PERCENT=${LB_GPU_HEADROOM_PERCENT:-5}
      - LB_RAM_HEADROOM_PERCENT=${LB_RAM_HEADROOM_PERCENT:-10}
      # Round 34 follow-up: preflight must be ENABLED for async reload to work.
      # Without this, preflight helper short-circuits with PreflightEnabled=false
      # → Cline 65K → 413 sync instead of 503+Retry-After.
      - LB_NCTX_PREFLIGHT_ENABLED=${LB_NCTX_PREFLIGHT_ENABLED:-true}
      # Round 31 #2 (2026-08-09): async preflight reload — НЕ блокируем клиента
      # на долгой перезагрузке, отдаём 503+Retry-After. Cline/OpenWebUI retry'ят.
      # Round 34 (2026-08-12): MUST be in compose env block — docker compose
      # НЕ подхватывает env_file автоматически для переменных, которых нет
      # в environment: ниже. Без этого async mode выключен и клиент получает 413.
      - LB_NCTX_PREFLIGHT_ASYNC_RELOAD=${LB_NCTX_PREFLIGHT_ASYNC_RELOAD:-true}
      - LB_NCTX_PREFLIGHT_ASYNC_RETRY_AFTER_SEC=${LB_NCTX_PREFLIGHT_ASYNC_RETRY_AFTER_SEC:-30}
      # Round 35c (2026-08-13): env-tunable async load polling timeout.
      # User report: 22GB Qwen3.6-35B-A3B на 3070 получил 8m7s timeout
      # (cppworker estimation 3.5min × 2 + 60s = 8m), но реальная загрузка
      # 12+ min из-за CUDA_Host pinned memory alloc для 19GB+ весов.
      # Для 22GB+ Qwen3.6 на 3070 поднять: MAX_WAIT=1800, MULT=4, BUFFER=120.
      - LB_NCTX_PREFLIGHT_MAX_WAIT_SEC=${LB_NCTX_PREFLIGHT_MAX_WAIT_SEC:-900}
      - LB_NCTX_PREFLIGHT_WAIT_MULTIPLIER=${LB_NCTX_PREFLIGHT_WAIT_MULTIPLIER:-2}
      - LB_NCTX_PREFLIGHT_WAIT_BUFFER_SEC=${LB_NCTX_PREFLIGHT_WAIT_BUFFER_SEC:-60}
    # Round 51.6 (2026-08-20): env_file — auto-loads .env.bundled-with-agent
    # в контейнер. Раньше приходилось передавать --env-file явно, и при
    # свежем деплое docker compose подхватывал старый .env (без
    # CPPWORKER_API_TOKEN) → 401 от балансера.
    env_file:
      - .env.bundled-with-agent
    volumes:
      - ../config:/app/config:ro
      - balancer_data:/app/data
    networks:
      - ol-bundled-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18081/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  cppworker-gpu:
    build:
      context: ..
      dockerfile: docker/cppworker/Dockerfile.gpu
      args:
        CUDA_ARCH: ${CUDA_ARCH:-all}
    image: ollama-legion/cppworker:gpu-${CPPWORKER_GPU_TAG:-arch_all}
    container_name: ol-bundled-cppworker-gpu
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CPPWORKER_HOST=0.0.0.0
      - CPPWORKER_PORT=18092
      - CPPWORKER_MODELS_DIR=/app/models
      - CPPWORKER_CTX_SIZE=${CPPWORKER_CTX_SIZE:-32768}
      - CPPWORKER_BATCH_SIZE=${CPPWORKER_BATCH_SIZE:-512}
      - CPPWORKER_GPU_LAYERS=${CPPWORKER_GPU_LAYERS:-20}
      - CPPWORKER_FLASH_ATTN_TYPE=${CPPWORKER_FLASH_ATTN_TYPE:--1}
      - CPPWORKER_N_THREADS=${CPPWORKER_N_THREADS:-0}
      - CPPWORKER_NUMA=${CPPWORKER_NUMA:-false}
      - CPPWORKER_USE_MMAP=${CPPWORKER_USE_MMAP:-true}
      - CPPWORKER_RAM_FALLBACK_N_CTX=${CPPWORKER_RAM_FALLBACK_N_CTX:-true}
      - CPPWORKER_RAM_FALLBACK_GPU_LAYERS=${CPPWORKER_RAM_FALLBACK_GPU_LAYERS:--2}
      - CPPWORKER_RAM_FALLBACK_MAX_N_CTX=${CPPWORKER_RAM_FALLBACK_MAX_N_CTX:-128000}
      - CPPWORKER_AUTO_OFFLOAD=${CPPWORKER_AUTO_OFFLOAD:-true}
      - CPPWORKER_AUTO_TUNE_NCTX=${CPPWORKER_AUTO_TUNE_NCTX:-true}
      # Round 16 (2026-07-30): reasoning/thinking policy.
      # Default = OFF — backward compat + tool use workloads (Cline/Roo/Aider).
      # Qwen3 thinking оборачивает tool call в <think> блоки, ломает tool call
      # парсеры. Поставьте true если используете Coder/Qwen3-Coder и вам НЕ
      # нужен tool use. Можно переопределить per-model через load-with-params.
      - CPPWORKER_DEFAULT_ENABLE_REASONING=${CPPWORKER_DEFAULT_ENABLE_REASONING:-false}
      - CPPWORKER_DEFAULT_REASONING_BUDGET=${CPPWORKER_DEFAULT_REASONING_BUDGET:-0}
      - CPPWORKER_ENABLE_REASONING=${CPPWORKER_ENABLE_REASONING:-false}
      - CPPWORKER_REASONING_BUDGET=${CPPWORKER_REASONING_BUDGET:-0}
      # Round 15.1: opt-in flag для true parallel llama_decode через
      # BatchedScheduler. Default = false (Round 13 multi-slot path).
      - CPPWORKER_ENABLE_BATCHED_PARALLEL=${CPPWORKER_ENABLE_BATCHED_PARALLEL:-false}
      - API_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
      # Регистрация бэкенда в балансер.
      - CPPWORKER_BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - CPPWORKER_BALANCER_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
      - CPPWORKER_ADVERTISE_HOST=cppworker-gpu
      - CPPWORKER_ADVERTISE_PORT=18092
      # Round 34 follow-up: align with AGENT_BACKEND_ID so cppworker's
      # notifyModelLoaded callback updates the SAME backend the agent
      # registered (not an orphan). Without this match the callback
      # silently goes to a non-existent backend and cluster state shows
      # no loaded models. The callback uses `r.backendID` which is set
      # from CPPWORKER_REGISTER_NAME (not CPPWORKER_BACKEND_ID!) in
      # newBalancerRegistration at balancer_register.go:111+153.
      # BUG: when CPPWORKER_REGISTER_DISABLE=true, newBalancerRegistration
      # returns nil → balancerReg == nil → runAsyncLoad skips notifyModelLoaded.
      # Workaround: set REGISTER_DISABLE=false; balancer will dedup
      # (cppworker register at host=cppworker-gpu:18092 matches the agent's
      # register, both with same backendId, so they merge).
      - CPPWORKER_REGISTER_NAME=cppworker-gpu-bundled-agent
      - CPPWORKER_BACKEND_ID=cppworker-gpu-bundled-agent
      # Round 34 follow-up: balancerReg must be non-nil for notifyModelLoaded
      # callback to fire. Was disabled to avoid duplicate backends, but the
      # dedup happens in the balancer already (same backendId).
      - CPPWORKER_REGISTER_DISABLE=false
      - HF_AUTO_DOWNLOAD_REPO=
      - HF_AUTO_DOWNLOAD_FILE=
    # Round 51.6: env_file — auto-loads .env.bundled-with-agent.
    env_file:
      - .env.bundled-with-agent
    volumes:
      - ../models:/app/models:rw
      - ../config:/app/config:rw
      - cppworker_cache:/app/.cache
    ports:
      - "${CPPWORKER_GPU_PORT:-18092}:18092"
    networks:
      - ol-bundled-net
    healthcheck:
      test: ["CMD", "/app/cppworker", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      loadbalancer:
        condition: service_healthy

  # =========================================================================
  # Agent — sidecar-сборщик метрик (GPU/CPU/RAM/llama.cpp runtime).
  # Регистрирует cppworker-gpu в балансер отдельным backend с id
  # "cppworker-gpu-bundled-agent" (с hasAgent=true) — чтобы WebUI показывал
  # реальные GPU/VRAM/CPU метрики на странице GGUF и в мониторинге.
  #
  # De-dup на стороне WebUI:
  #   internal/api/gguf_backends_handler.go автоматически склеивает
  #   cppworker-gpu-bundled и cppworker-gpu-bundled-agent (один host:port)
  #   и выводит запись с hasAgent=true (приоритет), чтобы реальные метрики
  #   отображались в UI.
  # =========================================================================
  agent:
    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
      target: agent-gpu
      args:
        ENABLE_NVML: "true"
    image: ollama-legion/agent:cppworker-bundled-r41-agent-x-api-token  # Round 41 (2026-08-19): X-API-Token auth header — agent шлёт BALANCER_TOKEN в register/metrics/heartbeat (was: 401 restart loop)
    container_name: ol-bundled-cppworker-gpu-agent
    restart: unless-stopped
    # 2026-06-30: критично для GPU-метрик.
    # Без runtime: nvidia NVIDIA Container Toolkit не смонтирует в контейнер agent'а
    #   /dev/nvidia0, /dev/nvidiactl, /dev/nvidia-uvm* и libnvidia-ml.so.1.
    # В результате nvml.Init() возвращает ERROR_LIBRARY_NOT_FOUND, nvidia-smi
    #   не находится в PATH (нет в base-образе nvidia/cuda), /dev/nvidia0
    #   отсутствует → detectPlatformMode() возвращает ModeCPU и агент шлёт
    #   только CPU/RAM метрики.
    # Это симметрично cppworker-gpu (строка 73 в этом же файле).
    runtime: nvidia
    environment:
      - AGENT_ID=cppworker-gpu-bundled-agent
      - AGENT_PORT=18032
      # cppworker внутри compose-сети (DNS service discovery).
      - AGENT_CPPWORKER_URL=http://cppworker-gpu:18092
      # 2026-06-30: код в cmd/agent/main.go читает именно BALANCER_URL
      # (не AGENT_BALANCER_URL) — иначе используется дефолт http://localhost:18081,
      # который внутри compose указывает на сам контейнер agent и connection refused.
      - BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - BALANCER_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
      # 2026-06-30: BACKEND_TYPE=llama_cpp обязательно — иначе баннер показывает
      # "Engine: Ollama" и весь смысл llama.cpp-агента теряется.
      - BACKEND_TYPE=llama_cpp
      # 2026-06-30: NVML_ENABLED=true обязательно — без NVML agent собирает
      # "No GPU detected, CPU mode" на хосте с GPU.
      - NVML_ENABLED=true
      # 2026-06-30 (de-dup v2): явно сообщаем агенту, какой физический cppworker
      # он обёртывает. Эти host/port попадают в register-payload как host/cppWorkerPort
      # и совпадают с тем, что отправляет register-with-balancer.sh для cppworker-gpu.
      # Без этого de-dup по (host, port) в /api/v1/gguf/backends не срабатывал:
      # agent регистрировался с host=cppworker-gpu-bundled-agent:18091 (имя контейнера
      # agent'а + legacy fallback), а cppworker — с host=cppworker-gpu:18092.
      - AGENT_CPPWORKER_HOST=cppworker-gpu
      - AGENT_CPPWORKER_PORT=18092
      # Public host:port для самого агента (используется только для agentPort/healthcheck,
      # НЕ для хоста бэкенда — это и было источником дубля).
      - AGENT_PUBLIC_HOST=cppworker-gpu-bundled-agent
      - AGENT_PUBLIC_PORT=18032
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      # 2026-06-30: NVIDIA_DRIVER_CAPABILITIES обязательно для доступа к GPU в контейнере.
      #   "compute" — доступ к GPU для вычислений (NVML Init использует его).
      #   "utility" — доступ к nvidia-smi и management утилитам.
      # Без этого NVIDIA Container Toolkit не выдаёт права на /dev/nvidia* даже при runtime: nvidia.
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - AGENT_MODE=gpu
      - AGENT_COLLECT_INTERVAL=${AGENT_COLLECT_INTERVAL:-15}
      - AGENT_HEARTBEAT_INTERVAL=${AGENT_HEARTBEAT_INTERVAL:-30}
      - AGENT_BACKEND_ID=cppworker-gpu-bundled-agent
      - AGENT_CPPWORKER_PORT=18092
      - AGENT_REGISTER_GPU_MODE=gpu
    # Round 51.6: env_file — auto-loads .env.bundled-with-agent.
    env_file:
      - .env.bundled-with-agent
    networks:
      - ol-bundled-net
    healthcheck:
      test: ["CMD", "/app/agent", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      loadbalancer:
        condition: service_healthy
      cppworker-gpu:
        condition: service_healthy

  webui:
    build:
      context: ..
      dockerfile: docker/webui/Dockerfile
      # Sprint 30 (2026-07-30): VERSION / GIT_COMMIT / BUILD_DATE пробрасываются
      # как build-args в WebUI. entrypoint.sh инжектит их в config.js, JS в
      # index.html показывает в sidebar footer (id=appVersion).
      # Можно переопределить через env:
      #   WEBUI_VERSION, WEBUI_GIT_COMMIT, WEBUI_BUILD_DATE
      args:
        VERSION: ${WEBUI_VERSION:-dev}
        GIT_COMMIT: ${WEBUI_GIT_COMMIT:-unknown}
        BUILD_DATE: ${WEBUI_BUILD_DATE:-unknown}
    image: ollama-legion/webui:cppworker-bundled
    container_name: ol-bundled-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-18083}:80"
    environment:
      - LB_API_URL=http://loadbalancer:18081
      - LB_OLLAMA_URL=http://loadbalancer:18080
      - WEBUI_PORT=80
      # Session 18 Round 15 (2026-07-29): API_TOKEN обязателен — иначе WebUI
      # шлёт X-API-Token: "" → cppworker возвращает 401 на per-backend save
      # (config update). Используем тот же токен что у cppworker и balancer.
      - API_TOKEN=${CPPWORKER_API_TOKEN:-changeme-bundled-with-agent-token}
    # Round 51.6: env_file — auto-loads .env.bundled-with-agent. Без этого
    # на свежем деплое WebUI получает 401 от балансера, потому что
    # .env (auto-loaded) не содержит CPPWORKER_API_TOKEN, и все падают
    # на дефолт `changeme-bundled-with-agent-token`. Если пользователь
    # сменил токен в .env.bundled-with-agent — старый путь без --env-file
    # приводил к расхождению токенов и 401.
    env_file:
      - .env.bundled-with-agent
    networks:
      - ol-bundled-net
    depends_on:
      loadbalancer:
        condition: service_healthy

networks:
  ol-bundled-net:
    driver: bridge
    name: ollama-legion-bundled-net

volumes:
  balancer_data:
  cppworker_cache:


