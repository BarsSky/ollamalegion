server {
    listen ${NGINX_PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver (нужен для upstream с динамическими Docker-именами)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # === R88 (2026-10-08): ДОКТРИНА ТАЙМАУТОВ — та же, что у балансера ===
    #
    # nginx панели НЕ капает РАБОТУ. Разрешены только периодические опросы
    # (панель сама опрашивает статусы своими короткими запросами); duration-кап,
    # который обрывает генерацию/загрузку модели/скачивание ровно посередине,
    # запрещён — воркер продолжит считать, клиент получит 504 и потеряет
    # результат. Полная доктрина: internal/balancer/timeout_policy.go и
    # docs/image-generation.md §17.
    #
    # Поэтому proxy_read_timeout/proxy_send_timeout на рабочих путях — 86400 с
    # (практически «без капа», то же значение, что у /ws/). Короткими оставлены
    # только proxy_connect_timeout (установка соединения — не работа).
    # Если ошибка всё-таки случилась, клиент получает JSON с объяснением, а не
    # HTML-страницу «504 Gateway Time-out» (см. error_page в конце конфига).

    # CppWorker API proxy (GGUF models page) — ленивый DNS-резолв через переменную.
    #
    # R87 (2026-10-08): read/write 300s/30s → 3600s. Через этот location идут
    # ДОЛГИЕ операции воркера: загрузка модели с диска, скачивание HF-bundle и
    # загрузка образа (image-модель 14.6 GB грузится минуты). 300s обрывали их
    # ровно посередине — клиент видел 504, а воркер продолжал работу.
    # Подробнее: docs/image-generation.md, «Долгая генерация: цепочка таймаутов».
    location /api/worker/ {
        set $worker_upstream "${CPPWORKER_HOST}:${CPPWORKER_PORT}";
        rewrite ^/api/worker/(.*)$ /$1 break;
        proxy_pass http://$worker_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # SSE (Server-Sent Events) endpoint — нужен ОТДЕЛЬНЫЙ location ПЕРЕД /api/
    # catchall, потому что SSE требует:
    #   - proxy_buffering off (nginx НЕ должен буферизовать chunked stream)
    #   - proxy_read_timeout > heartbeat interval (heartbeat = 30s в Go,
    #     таймаут 600s с запасом)
    #   - Connection: "" (очистить hop-by-hop заголовок для HTTP/1.1)
    # Без этого браузер получает ERR_INCOMPLETE_CHUNKED_ENCODING и
    # переподключается каждые 1-2 минуты.
    # Session 17 P.7 (2026-07-27): раньше SSE шёл через catchall /api/
    # с proxy_buffering on → chunked stream буферизовался nginx'ом,
    # при неполном буфере клиент видел разрыв соединения.
    location /api/v1/events {
        proxy_pass http://${API_HOST}:${API_PORT}/api/v1/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE-specific: clear Connection hop-by-hop header
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        # Disable buffering for SSE (X-Accel-Buffering: no из Go недостаточно)
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }

    # === Image-плоскость: длинные операции и потоковые ответы (R87, 2026-10-08) ===
    #
    # ЗАЧЕМ ОТДЕЛЬНЫЕ LOCATION. Генерация картинки на слабой GPU занимает
    # минуты, а не секунды: замер на эталонном стенде (RTX 3070 8 GB,
    # Qwen-Image-2.1 Q4_K_M, 2048x2048, 40 шагов) — 21m45s на картинку.
    # Сам балансер кап по умолчанию НЕ ставит (LB_ALLOW_IMAGE_TIMEOUT_SEC не
    # задан → ждём терминального состояния), поэтому единственное, что может
    # убить прогон, — таймаут вот здесь, в nginx.
    #
    # До фикса:
    #   - /api/v1/image/... (загрузка/выгрузка модели, прогресс загрузки,
    #     /backends/{id}/proxy/...) попадал в catchall `location /api/`
    #     (admin API) → proxy_read_timeout 120s + proxy_buffering ON. Загрузка
    #     модели 14.6 GB и SSE-поток прогресса не переживали этого;
    #   - /api/image/... (нативная поверхность балансера: /api/image/generate,
    #     /api/image/models) уходил в admin API, который её НЕ обслуживает
    #     (404), потому что живёт она на proxy-порту ${LB_PORT};
    #   - /sdapi/... (A1111-поверхность) не имел location вовсе и падал в
    #     `location /` → клиент получал index.html вместо JSON.
    #
    # Спутник: docs/image-generation.md, «Долгая генерация: цепочка таймаутов».
    location /api/v1/image/ {
        proxy_pass http://${API_HOST}:${API_PORT}/api/v1/image/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        # Прогресс загрузки модели — SSE (.../models/load/progress/stream):
        # с proxy_buffering on поток буферизуется и клиент видит обрыв.
        proxy_buffering off;
        proxy_cache off;
    }

    # R88: GGUF-прокси — тот же класс операций, что image-плоскость: загрузка
    # модели текстового воркера, прогресс загрузки, скачивание HF-bundle через
    # балансер. До фикса это уходило в catch-all /api/ (120 с + proxy_buffering
    # on) — то есть ровно то, из-за чего панель теряла длинные операции.
    # Прогресс отдаётся потоком → буферизацию выключаем.
    location /api/v1/gguf/ {
        proxy_pass http://${API_HOST}:${API_PORT}/api/v1/gguf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/image/ {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location /sdapi/ {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # API proxy (управление) — прямой upstream без DNS-переменной
    location /api/ {
        proxy_pass http://${API_HOST}:${API_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Ollama API endpoints (для OpenWebUI, который вызывает /ollama/api/*)
    # Проксирует /ollama/* на бэкенд без префикса /ollama
    location /ollama/ {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        rewrite ^/ollama/(.*)$ /$1 break;
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # OpenAI-совместимый API (для OpenWebUI, который вызывает /openai/*)
    # Проксирует /openai/* на бэкенд без префикса /openai
    location /openai/ {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        rewrite ^/openai/(.*)$ /$1 break;
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # R60.43 (2026-09-11): /v1/ OpenAI-совместимые endpoints
    # До фикса: nginx отвечал 405 Not Allowed с HTML body на /v1/chat/completions,
    # /v1/models и т.д. — OpenWebUI видел HTML вместо JSON, парсил как ошибку,
    # показывал пользователю "Unexpected token '<'" / "пустой ответ".
    # Теперь: /v1/* проксируется напрямую на balancer OpenAI-совместимый роутер
    # (18080: /v1/chat/completions, /v1/completions, /v1/embeddings, /v1/models).
    # Те же SSE/streaming настройки что и для /openai/ — proxy_buffering off,
    # proxy_read_timeout 600s для длинных генераций.
    #
    # R87 (2026-10-08): 600s → 3600s. Это и был тот 504, который видел оператор
    # на 2048x2048: браузер шлёт /v1/images/generations сюда, nginx ждёт ответ
    # ровно 600s и рвёт соединение, хотя воркер продолжает считать и через
    # 21m45s отдаёт 200. Текстовая сторона от этого не страдает: простаивающий
    # stream закрывает сам балансер (Balancing.StreamingIdleTimeout, 120s).
    location /v1/ {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # === R60.2 — main proxy (18080) endpoints ===
    # До фикса ВСЕ /api/* шли в catchall `location /api/` (admin 18081) →
    # /api/models, /api/hf/*, /api/cancel и др. отдавали 404 page not found.
    # Каждый location тут длиннее префикса /api/, поэтому nginx выберет его
    # ДО catchall, и запрос уйдёт в main proxy 18080 (llamacpp_router /
    # virtual_router), где живут load/unload/files/proxy.
    #
    # Longest-prefix matching в nginx: location /api/models (prefix 12)
    # выигрывает у /api/ (prefix 5), поэтому /api/models/files тоже
    # попадает сюда.
    location /api/models {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        # SSE stream (load progress)
        proxy_cache off;
    }

    location /api/hf {
        # === R60.2 ===
        # Идём напрямую в cppworker (а не в балансер на 18080) — потому что
        # balancer proxy теряет query string на /api/hf/* (R60.2 finding:
        # "query parameter is required" при ?query=qwen). Webui ходит на
        # /api/hf/search?query=...&limit=N → cppworker напрямую отдаёт 200.
        # CPPWORKER_* env (задаются entrypoint.sh из compose env_file).
        set $worker_upstream "${CPPWORKER_HOST}:${CPPWORKER_PORT}";
        proxy_pass http://$worker_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # Ollama-compat: /api/cancel, /api/delete, /api/show, /api/tags
    location /api/cancel {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 60s;
    }

    location /api/delete {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 60s;
    }

    location /api/show {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 60s;
    }

    location /api/gpu {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 30s;
    }

    # Ollama API endpoints — переменная для ленивого DNS-резолва
    location /api/generate {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream/api/generate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location /api/chat {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        # R60.55 nginx timeout fix (2026-09-13): proxy_read_timeout 600s → 3600s.
        # Old 600s was enough for fast models but cut off slow LLM streams before
        # completion: Qwen3-Instruct on RTX 3070 + 36 GPU layers + 16384 ctx generates
        # at ~3 tok/s, so cppworker's default n_predict=2048 takes ~680s. nginx would
        # close the connection at 600s with HTTP 504 (HTML body, not JSON), and
        # OpenWebUI showed "Unexpected token '<', '<html> <h'..." JSON parse error.
        # 3600s = 1 hour covers worst case (slow CPU offload + 32K context + 4096 tokens
        # at 1 tok/s = 4096s worst-case scenario, comfortably under 1h).
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location /api/embeddings {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream/api/embeddings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location /api/tags {
        set $lb_upstream "${API_HOST}:${LB_PORT}";
        proxy_pass http://$lb_upstream/api/tags;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy — прямой upstream без DNS-переменной
    # === R60.2 — WebSocket send timeout ===
    # До фикса: proxy_send_timeout 60s → balancer закрывал idle WS
    # через 60 сек, webui получал "websocket read error: i/o timeout"
    # в balancer logs каждые ~90-100 сек. Увеличено до 86400s (24h),
    # matching proxy_read_timeout. Если real WS-keepalive понадобится
    # позже (ping/pong) — настраивать в balancer (handlers_core.go).
    location /ws/ {
        proxy_pass http://${API_HOST}:${API_PORT}/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
    }

    # HTML files — never cache (critical for cache busting with ?v=N)
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "-1" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # R66d (2026-09-23): config.js — НИКОГДА не кэшировать.
    #
    # Этот файл не статический: entrypoint контейнера генерирует его при каждом
    # старте и вписывает туда API_TOKEN (+ API_BASE/CPPWORKER_URL). Пока он
    # попадал под общий `expires 1y` ниже, браузер держал старый токен до года:
    # после смены токена в конфиге страница продолжала слать СТАРЫЙ X-API-Token,
    # и WebUI стабильно получал
    #   HTTP 401 {"error":"Unauthorized: valid API token required"}
    # на все действия (load/unload, сохранение настроек, профили моделей, GGUF).
    # Точное совпадение (`location =`) имеет приоритет над regex-локацией ниже.
    location = /js/modules/config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "-1" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static files with long cache (cache busting via ?v=N query string).
    # R60.24 (2026-09-09): убран `immutable` (был "public, immutable") потому что
    # browser хранит ВСЕ версии одинакового URL навечно и НИКОГДА не
    # ре-валидирует. Bug: R59.x (window.Utils/Utils, window.Renderers = Renderers,
    # window.WebSocketManager) export'ы добавились в модули, но ?v=16 в HTML не
    # бампался → browser отдавал cached OLD модули → app.js init() падал на
    # "Cannot read properties of undefined (reading 'connect')" → dashboard
    # cards "—", badge "● Подключение..." зависал навсегда.
    # Без `immutable` browser всё равно кеширует на 1 год (expires 1y), но при
    # cache-bust (?v=R60.24) ре-валидирует по ETag/Last-Modified.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # === R88: ошибки прокси — объяснением, а не HTML ===
    #
    # nginx САМ генерирует 502 (upstream недоступен/DNS), 503 и 504 (сработал
    # таймаут чтения). По умолчанию это HTML-страница «504 Gateway Time-out», и
    # клиент панели показывал оператору просто «HTTP 504» — без причины и без
    # того, что делать (именно на это была жалоба по 2048x2048).
    #
    # Отдаём JSON в том же формате, что и балансер: error / error_type / hint /
    # retry_after — UI и curl читают его одинаково.
    #
    # ВАЖНО: proxy_intercept_errors НЕ включаем сознательно. Ответы самого
    # балансера уже несут error_type, backend_id, detail и hint (writeGateError /
    # writeUpstreamError); перехват подменил бы их общей фразой и уничтожил
    # объяснение. Без intercept сюда попадают только ошибки, рождённые nginx.
    error_page 502 = @panel_upstream_unavailable;
    error_page 503 = @panel_upstream_unavailable;
    error_page 504 = @panel_upstream_timeout;

    location @panel_upstream_unavailable {
        default_type application/json;
        return 503 '{"error":"panel proxy: upstream (balancer) is unreachable","error_type":"upstream_unavailable","hint":"проверьте контейнер балансера: docker ps / docker logs ol-stack-balancer, затем повторите запрос","retry_after":30}';
    }

    location @panel_upstream_timeout {
        default_type application/json;
        return 504 '{"error":"panel proxy: the balancer did not answer within the proxy timeout","error_type":"upstream_timeout","hint":"кап времени в nginx (proxy_read_timeout) сработал раньше ответа: проверьте логи воркера и балансера — работа могла продолжиться после обрыва","retry_after":30}';
    }

    # SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # F.γ (2026-06-28): session F — health-check UI page.
    # nginx отдаёт webui/health.html как static file. Docker healthcheck webui-контейнера
    # получает 200 OK и реальную HTML-страницу (inline i18n + auto-refresh).
    location = /health {
        try_files /health.html =404;
    }
}