# golangci-lint config для OllamaLegion
#
# Версия linter: v1.61.0 (см. .github/workflows/ci.yml job `lint`)
# Документация: https://golangci-lint.run/
#
# Принципы:
# - Только базовые линтеры (govet, errcheck, staticcheck, ineffassign, unused).
#   Не включаем style-лиnterы (gofmt/goimports) — они дублируют gofmt и часто
#   конфликтуют с IDE autoformatting.
# - misspell включён для en+ru locale (типичные опечатки).
# - Тесты исключены из errcheck (defer-Close без проверки ошибки — норма).
# - Generated code и cgo stubs исключены (c/bridge/bridge_stub.go и др.).
---

run:
  timeout: 5m
  tests: true
  build-tags:
    - llama_stub

issues:
  max-issues-per-linter: 50
  max-same-issues: 3  # 3 одинаковых warning'а → exit 1
  exclude-dirs:
    - c/llama.cpp           # upstream subtree, не наш код
    - webui/node_modules    # JS код, не Go
  exclude-files:
    - 'c/bridge/bridge_stub.go$'  # auto-generated stub
    - 'c/bridge/bridge.c$'       # C-исходник, не Go
    - '.*_gen\.go$'              # go generate output
    - '.*_mock\.go$'             # mocks
  exclude-rules:
    - path: _test\.go$
      linters:
        - errcheck      # defer Close в тестах — норм
        - gosimple      # тесты часто используют "простой" код
    - path: cmd/cppworker/.*_test\.go$
      linters:
        - staticcheck   # stub-тесты cppworker содержат искусственные примеры
    # R509 (шаг R4): раскладка полей этих структур НЕ менялась — они ПЕРЕНЕСЕНЫ как
    # есть из backend.go/hf_downloader.go/model_manager.go, и «новыми» их сделал
    # перенос, а не правка. Переставить поля — отдельный шаг (иначе разбиение файлов
    # смешивается с изменением структур): долг записан в docs/architecture/debts.ru.md
    # (12y) вместе со списком структур. Остальные файлы пакета проверяются как раньше.
    - path: internal/cppbackend/(backend_gguf|backend_load_history|backend_model_instance|hf_downloader_search|model_manager_resolve)\.go$
      linters:
        - govet
      text: fieldalignment
    # Generated mocks (gomock, mockery, etc.)
    - path: internal/mocks/
      linters:
        - all
    # Proto-generated code (если появится)
    - path: '.*\.pb\.go$'
      linters:
        - all

linters:

  disable-all: true
  enable:
    - govet           # стандартный go vet
    - errcheck        # проверка unchecked errors
    - staticcheck     # staticcheck (включает SA*, правильность, устаревания)
    - ineffassign     # неэффективные присваивания (x = x)
    - unused          # неиспользуемый код (включает deadcode, U1000)
    - misspell        # опечатки (en+ru)
    - gosimple        # упрощения (включён в staticcheck, но явно для ясности)
    - typecheck       # базовая проверка типов (всегда включён в CI)
    # R506 (2026-11-19): длина функций больше НЕ безлимитна (план
    # docs/plans/2026-11-19-readability-refactor.md, шаг R1). Пороги выбраны так,
    # чтобы существующий долг НЕ краснил CI сегодня: job lint запускается с
    # only-new-issues: true, то есть считаются только нарушения в изменённых
    # строках. Иначе линтер пришлось бы отключать на весь старый код — а он
    # нужен именно чтобы долг не рос.
    - funlen
    - gocognit

linters-settings:
  # R506 / R1 плана читаемости: 200 строк и 100 операторов на функцию.
  # Долг (2026-11-19): 2 функции > 1000 строк, 41 > 300 — шаги R2/R3 его снимают.
  funlen:
    lines: 200
    statements: 100
    ignore-comments: true

  # Когнитивная сложность: 60 — выше неё функцию невозможно проверить чтением.
  gocognit:
    # R509 (шаг R4): 70, а не 60 — перенос кода в новые файлы сделал «новыми» две
    # СУЩЕСТВОВАВШИЕ сложные функции (`fetchFile` 61, `GetModelMeta` 61). По правилу
    # шага R1 порог поднимается до фактического максимума и записывается как долг, а
    # не отключается линтер: долг — в docs/architecture/debts.ru.md (12y).
    min-complexity: 70

  govet:
    enable-all: true
    disable:
      - shadow         # слишком много false-positives в нашем коде

  misspell:
    # R66c (2026-09-22): misspell принимает ТОЛЬКО "US" или "UK".
    # Значение "US,Russian" невалидно и роняло `golangci-lint config verify`
    # ещё ДО запуска линтера: job lint падал с «the configuration contains
    # invalid elements» (прогон 35738576072) и не проверял ни одной строки.
    # Русские опечатки misspell ловит своим словарём, locale к языку не привязан.
    locale: US
    ignore-words:
      - cancelled      # en-GB вариант, используем в WebUI

  staticcheck:
    checks:
      - all
      # Отключаем самые "шумные" проверки для большого проекта:
      - -SA1019  # использование deprecated API (часто осознанное)
      - -SA4006  # value never used (часто false-positive для multi-return)
      - -ST1003  # проверка naming convention (для нашего стиля с camelCase норм)
      - -ST1005  # error strings should not be capitalized (для UI сообщений надо)
      - -U1000   # unused code (конфликтует с `unused`)

  errcheck:
    check-blank: false   # не падать на "if err := x; _ = err"
    check-type-assertions: false  # type assertions часто сознательно unchecked

  gosimple:
    checks:
      - all
      - -S1000  # используйте plain для консистентности (конфликтует с typecheck)

