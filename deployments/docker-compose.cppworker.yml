# Ollama Load Balancer - CppWorker Docker Compose конфигурация
#
# Использование:
#   CPU (по умолчанию): docker compose -f deployments/docker-compose.cppworker.yml up -d
#   GPU:                docker compose -f deployments/docker-compose.cppworker.yml --profile gpu up -d
#   STUB (CI/тесты):    docker compose -f deployments/docker-compose.cppworker.yml --profile stub up -d
#
#   Сборка:
#     CPU:  docker build -t ollama-legion/cppworker:cpu -f docker/cppworker/Dockerfile.cpu --target runtime .
#     GPU:  docker build -t ollama-legion/cppworker:gpu -f docker/cppworker/Dockerfile.gpu --target runtime .
#     STUB: docker build -t ollama-legion/cppworker:stub -f docker/cppworker/Dockerfile.stub --target runtime .
#
#   Просмотр логов: docker compose -f deployments/docker-compose.cppworker.yml logs -f
#   Остановка: docker compose -f deployments/docker-compose.cppworker.yml down
#
# Переменные окружения:
#   CPPWORKER_CPU_PORT        — порт для CPU API (по умолчанию 18091)
#   CPPWORKER_GPU_PORT        — порт для GPU API (по умолчанию 18092)
#   CPPWORKER_STUB_PORT       — порт для STUB API (по умолчанию 18093)
#   CPPWORKER_GPU_LAYERS      — кол-во слоёв на GPU (-1 = все)
#   CUDA_ARCH                 — целевая архитектура CUDA (например "86" или "all").
#                               Влияет на тэг образа :gpu-<arch> (для all — :gpu-arch_all)
#                               и на --build-arg CUDA_ARCH= при сборке.
#   HF_TOKEN                  — токен HuggingFace (для gated моделей)
#   HF_AUTO_DOWNLOAD_REPO     — репозиторий для авто-загрузки модели
#   HF_AUTO_DOWNLOAD_FILE     — конкретный .gguf файл (если пусто — авто-выбор по квантизации)
#   HF_AUTO_DOWNLOAD_QUANT    — фильтр квантизации (по умолчанию Q4_K_M)

services:
  # ============================================
  # CppBackend Worker CPU (реальный llama.cpp, без GPU)
  # Профили: default, cpu
  # ============================================
  cppworker-cpu:
    image: ollama-legion/cppworker:cpu
    build:
      context: ..
      dockerfile: docker/cppworker/Dockerfile.cpu
      target: runtime
    container_name: ollama-legion-cppworker-cpu
    restart: unless-stopped
    profiles: ["default", "cpu"]

    ports:
      - "${CPPWORKER_CPU_PORT:-18091}:18091"

    volumes:
      - ../models:/app/models:rw
      - hf-cache-cpu:/app/.cache/huggingface

    environment:
      - CPPWORKER_PORT=18091
      - CPPWORKER_MODELS_DIR=${CPPWORKER_MODELS_DIR:-./models}
      - CPPWORKER_CTX_SIZE=${CPPWORKER_CTX_SIZE:-4096}
      - CPPWORKER_BATCH_SIZE=${CPPWORKER_BATCH_SIZE:-512}
      - CPPWORKER_GPU_LAYERS=0
      # HuggingFace Hub auto-download
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_AUTO_DOWNLOAD_REPO=${HF_AUTO_DOWNLOAD_REPO:-}
      - HF_AUTO_DOWNLOAD_FILE=${HF_AUTO_DOWNLOAD_FILE:-}
      - HF_AUTO_DOWNLOAD_QUANT=${HF_AUTO_DOWNLOAD_QUANT:-Q4_K_M}
      - HF_MIRROR=${HF_MIRROR:-}
      # Round 16 (2026-07-30): reasoning/thinking policy (default OFF).
      - CPPWORKER_DEFAULT_ENABLE_REASONING=${CPPWORKER_DEFAULT_ENABLE_REASONING:-false}
      - CPPWORKER_DEFAULT_REASONING_BUDGET=${CPPWORKER_DEFAULT_REASONING_BUDGET:-0}
      - CPPWORKER_ENABLE_REASONING=${CPPWORKER_ENABLE_REASONING:-false}
      - CPPWORKER_REASONING_BUDGET=${CPPWORKER_REASONING_BUDGET:-0}
      # Round 15.1: opt-in batched parallel inference.
      - CPPWORKER_ENABLE_BATCHED_PARALLEL=${CPPWORKER_ENABLE_BATCHED_PARALLEL:-false}
      # === Auto-registration in balancer (port 18081) ===
      # BALANCER_URL is the canonical name. CPPWORKER_BALANCER_URL/CPPWORKER_BALANCER_TOKEN
      # are read by the Go-side registration (cmd/cppworker/balancer_register.go).
      # CPPWORKER_ADVERTISED_PORT is the port balancer uses to reach this worker.
      - BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - CPPWORKER_BALANCER_URL=${CPPWORKER_BALANCER_URL:-${BALANCER_URL:-http://loadbalancer:18081}}
      - CPPWORKER_BALANCER_TOKEN=${CPPWORKER_BALANCER_TOKEN:-${BALANCER_API_TOKEN:-}}
      - BALANCER_API_TOKEN=${BALANCER_API_TOKEN:-}
      - CPPWORKER_ADVERTISED_PORT=${CPPWORKER_ADVERTISED_PORT:-18091}
      - CPPWORKER_HOST=${CPPWORKER_HOST:-cppworker-cpu}
      - CPPWORKER_BACKEND_ID=${CPPWORKER_BACKEND_ID:-cppworker-cpu}
      - CPPWORKER_GPU_MODE=${CPPWORKER_GPU_MODE:-cpu}

    networks:
      - cppworker-net

    healthcheck:
      test: ["CMD", "/app/cppworker", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    labels:
      - "ollama-legion.role=cppworker"
      - "ollama-legion.gpu=false"
      - "ollama-legion.llamacpp=real"

  # ============================================
  # CppBackend Worker GPU (llama.cpp + CUDA + multi-GPU)
  # Профиль: gpu
  #
  # Тэг образа зависит от CUDA_ARCH:
  #   "86"          -> ollama-legion/cppworker:gpu-86
  #   "75;86;89"    -> ollama-legion/cppworker:gpu-75-86-89
  #   "all" (или не задано) -> ollama-legion/cppworker:gpu-arch_all
  # ============================================
  cppworker-gpu:
    image: ollama-legion/cppworker:gpu-${CPPWORKER_GPU_TAG:-arch_all}
    build:
      context: ..
      dockerfile: docker/cppworker/Dockerfile.gpu
      target: runtime
      args:
        CUDA_ARCH: ${CUDA_ARCH:-all}
    container_name: ollama-legion-cppworker-gpu
    restart: unless-stopped
    profiles: ["gpu"]

    ports:
      - "${CPPWORKER_GPU_PORT:-18092}:18091"

    volumes:
      - ../models:/app/models:rw
      - hf-cache-gpu:/app/.cache/huggingface

    environment:
      - CPPWORKER_PORT=18091
      - CPPWORKER_MODELS_DIR=${CPPWORKER_MODELS_DIR:-./models}
      - CPPWORKER_GPU_LAYERS=${CPPWORKER_GPU_LAYERS:--1}
      - CPPWORKER_FLASH_ATTN=${CPPWORKER_FLASH_ATTN:-true}
      - CPPWORKER_CTX_SIZE=${CPPWORKER_CTX_SIZE:-1024}
      - CPPWORKER_BATCH_SIZE=${CPPWORKER_BATCH_SIZE:-256}
      - NVIDIA_VISIBLE_DEVICES=all
      # HuggingFace Hub auto-download
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_AUTO_DOWNLOAD_REPO=${HF_AUTO_DOWNLOAD_REPO:-}
      - HF_AUTO_DOWNLOAD_FILE=${HF_AUTO_DOWNLOAD_FILE:-}
      - HF_AUTO_DOWNLOAD_QUANT=${HF_AUTO_DOWNLOAD_QUANT:-Q4_K_M}
      - HF_MIRROR=${HF_MIRROR:-}
      # Round 16 (2026-07-30): reasoning/thinking policy (default OFF).
      - CPPWORKER_DEFAULT_ENABLE_REASONING=${CPPWORKER_DEFAULT_ENABLE_REASONING:-false}
      - CPPWORKER_DEFAULT_REASONING_BUDGET=${CPPWORKER_DEFAULT_REASONING_BUDGET:-0}
      - CPPWORKER_ENABLE_REASONING=${CPPWORKER_ENABLE_REASONING:-false}
      - CPPWORKER_REASONING_BUDGET=${CPPWORKER_REASONING_BUDGET:-0}
      # Round 15.1: opt-in batched parallel inference.
      - CPPWORKER_ENABLE_BATCHED_PARALLEL=${CPPWORKER_ENABLE_BATCHED_PARALLEL:-false}
      # === Auto-registration in balancer (port 18081) ===
      # BALANCER_URL is the canonical name. CPPWORKER_BALANCER_URL/CPPWORKER_BALANCER_TOKEN
      # are read by the Go-side registration (cmd/cppworker/balancer_register.go).
      # CPPWORKER_ADVERTISED_PORT is the port balancer uses to reach this worker.
      - BALANCER_URL=${BALANCER_URL:-http://loadbalancer:18081}
      - CPPWORKER_BALANCER_URL=${CPPWORKER_BALANCER_URL:-${BALANCER_URL:-http://loadbalancer:18081}}
      - CPPWORKER_BALANCER_TOKEN=${CPPWORKER_BALANCER_TOKEN:-${BALANCER_API_TOKEN:-}}
      - BALANCER_API_TOKEN=${BALANCER_API_TOKEN:-}
      - CPPWORKER_ADVERTISED_PORT=${CPPWORKER_ADVERTISED_PORT:-18091}
      - CPPWORKER_ADVERTISE_HOST=${CPPWORKER_ADVERTISE_HOST:-cppworker-gpu}
      - CPPWORKER_HOST=${CPPWORKER_HOST:-0.0.0.0}
      - CPPWORKER_BACKEND_ID=${CPPWORKER_BACKEND_ID:-cppworker-gpu}
      - CPPWORKER_GPU_MODE=${CPPWORKER_GPU_MODE:-gpu}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    networks:
      - cppworker-net
      - ollama-legion-net

    healthcheck:
      test: ["CMD", "/app/cppworker", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    labels:
      - "ollama-legion.role=cppworker"
      - "ollama-legion.gpu=true"

  # ============================================
  # CppBackend Worker STUB (заглушка для CI/тестов)
  # Профиль: stub
  # ============================================
  cppworker-stub:
    image: ollama-legion/cppworker:stub
    build:
      context: ..
      dockerfile: docker/cppworker/Dockerfile.stub
      target: runtime
    container_name: ollama-legion-cppworker-stub
    restart: unless-stopped
    profiles: ["stub"]

    ports:
      - "${CPPWORKER_STUB_PORT:-18093}:18093"

    volumes:
      - ../models:/app/models:rw
      - hf-cache-stub:/app/.cache/huggingface

    environment:
      - CPPWORKER_PORT=18093
      - CPPWORKER_MODELS_DIR=${CPPWORKER_MODELS_DIR:-./models}
      - CPPWORKER_CTX_SIZE=${CPPWORKER_CTX_SIZE:-4096}
      - CPPWORKER_BATCH_SIZE=${CPPWORKER_BATCH_SIZE:-512}
      # HuggingFace Hub auto-download
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_AUTO_DOWNLOAD_REPO=${HF_AUTO_DOWNLOAD_REPO:-}
      - HF_AUTO_DOWNLOAD_FILE=${HF_AUTO_DOWNLOAD_FILE:-}
      - HF_AUTO_DOWNLOAD_QUANT=${HF_AUTO_DOWNLOAD_QUANT:-Q4_K_M}
      - HF_MIRROR=${HF_MIRROR:-}
      # Round 16 (2026-07-30): reasoning/thinking policy (default OFF).
      - CPPWORKER_DEFAULT_ENABLE_REASONING=${CPPWORKER_DEFAULT_ENABLE_REASONING:-false}
      - CPPWORKER_DEFAULT_REASONING_BUDGET=${CPPWORKER_DEFAULT_REASONING_BUDGET:-0}
      - CPPWORKER_ENABLE_REASONING=${CPPWORKER_ENABLE_REASONING:-false}
      - CPPWORKER_REASONING_BUDGET=${CPPWORKER_REASONING_BUDGET:-0}
      # Round 15.1: opt-in batched parallel inference.
      - CPPWORKER_ENABLE_BATCHED_PARALLEL=${CPPWORKER_ENABLE_BATCHED_PARALLEL:-false}

    networks:

    healthcheck:
      test: ["CMD", "/app/cppworker", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    labels:
      - "ollama-legion.role=cppworker"
      - "ollama-legion.llamacpp=stub"

networks:
  cppworker-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
  ollama-legion-net:
    name: deployments_ollama-legion-net
    external: true

volumes:
  hf-cache-cpu:
    name: ollama-legion-hf-cache-cpu
  hf-cache-gpu:
    name: ollama-legion-hf-cache-gpu
  hf-cache-stub:
    name: ollama-legion-hf-cache-stub