# Ollama Load Balancer - Agent Docker Compose конфигурация
#
# Использование:
#   Запуск: docker-compose -f docker-compose.agent.yml up -d
#   Просмотр логов: docker-compose -f docker-compose.agent.yml logs -f
#   Остановка: docker-compose -f docker-compose.agent.yml down
#
# Переменные окружения:
#   AGENT_ID - уникальный идентификатор агента
#   BALANCER_URL - URL балансировщика (http://host.docker.internal:18081)
#   AGENT_PORT - порт агента (18032)
#   OLLAMA_URL - URL локального Ollama (http://localhost:11434)
#   NVML_ENABLED - включение NVML (true)
#   METRICS_INTERVAL - интервал отправки метрик (5s)
#
# Примечание:
#   Эта конфигурация предназначена для запуска агента на удаленных GPU серверах
#   с локально установленным Ollama и NVIDIA драйверами.

services:
  # ============================================
  # Агент для сбора метрик GPU сервера
  # ============================================
  agent:
    image: ollama-lb/agent:latest
    build:
      context: ..
      dockerfile: docker/agent/Dockerfile
    container_name: ollama-lb-agent
    restart: unless-stopped
    
    # Сетевой режим host для доступа к локальному Ollama
    network_mode: host
    
    # Volume для доступа к NVIDIA драйверам и системным метрикам
    volumes:
      # Доступ к nvidia-smi утилите
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      # Доступ к NVIDIA драйверам
      - /var/run/nvidia-top-level-device:/var/run/nvidia-top-level-device:ro
      # Доступ к системным метрикам
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Доступ к Ollama данным (опционально)
      - /root/.ollama:/root/.ollama:ro
    
    environment:
      # Обязательные параметры
      # Уникальный идентификатор агента (должен совпадать с ID бэкенда в балансировщике)
      - AGENT_ID=${AGENT_ID:-gpu-agent}
      # URL балансировщика для подключения
      - BALANCER_URL=${BALANCER_URL:-http://host.docker.internal:18081}
      
      # Настройки портов
      # Порт для локальных метрик агента
      - AGENT_PORT=${AGENT_PORT:-18032}
      # URL локального Ollama для получения метрик моделей
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      
      # Настройки NVML
      # Включить NVML для точных GPU метрик
      - NVML_ENABLED=${NVML_ENABLED:-true}
      
      # Интервалы
      # Интервал сбора и отправки метрик
      - METRICS_INTERVAL=${METRICS_INTERVAL:-5s}
      # Интервал heartbeat сигналов
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-3s}
      # Интервал сбора метрик
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-5s}
      
      # Логирование
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
    
    # Health check для проверки состояния агента
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # Метки для идентификации
    labels:
      - "ollama-lb.role=agent"
      - "ollama-lb.component=metrics-collector"
