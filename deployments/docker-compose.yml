# Ollama Load Balancer - Docker Compose конфигурация
#
# Использование:
#   Запуск: docker-compose up -d
#   Просмотр логов: docker-compose logs -f
#   Остановка: docker-compose down
#
# Переменные окружения:
#   LB_HOST - хост для прослушивания (по умолчанию 0.0.0.0)
#   LB_PORT - порт прокси (по умолчанию 18080)
#   LB_API_PORT - порт API (по умолчанию 18081)
#   BACKENDS - JSON список бэкендов или использовать BACKEND_0_HOST, BACKEND_1_HOST и т.д.
#
# Агент на GPU-серверах:
#   Агент запускается отдельно на каждом GPU сервере с Ollama
#   См. DEPLOYMENT.md для инструкций по развертыванию агента

services:
  # ============================================
  # Балансировщик нагрузки (Load Balancer)
  # ============================================
  loadbalancer:
    image: ollama-legion/balancer:latest
    build:
      context: ..
      dockerfile: docker/balancer/Dockerfile
    container_name: ollama-legion-balancer
    restart: unless-stopped
    
    ports:
      # Порт для проксирования запросов к Ollama API
      - "${LB_PORT:-18080}:18080"
      # Порт для Management API
      - "${LB_API_PORT:-18081}:18081"
    
    volumes:
      # Конфигурация
      - ../config/config.json:/app/config.json:ro
      # Сохранение состояния между перезапусками контейнера
      - ollama-legion-state:/app/data:rw
    
    environment:
      # Основные настройки
      - LB_HOST=${LB_HOST:-0.0.0.0}
      - LB_PORT=${LB_PORT:-18080}
      - LB_API_PORT=${LB_API_PORT:-18081}
      # Доверенные прокси — Docker-сети и локальные диапазоны
      - LB_TRUSTED_PROXIES=172.17.0.0/16,172.18.0.0/16,172.28.0.0/16,10.0.0.0/8,192.168.0.0/16,127.0.0.1/8
      
      # Алгоритм балансировки: roundrobin, leastconn, resource-aware, model-affinity
      - LB_ALGORITHM=${LB_ALGORITHM:-resource-aware}
      
      # Включить привязку к модели (направление к серверу с загруженной моделью)
      - LB_MODEL_AFFINITY=${LB_MODEL_AFFINITY:-true}
      
      # Включить привязку сессии (клиент всегда попадает на тот же сервер)
      - LB_SESSION_STICKINESS=${LB_SESSION_STICKINESS:-true}
      
      # Интервалы проверок (секунды)
      - LB_HEALTH_CHECK_INTERVAL=${LB_HEALTH_CHECK_INTERVAL:-10}
      - LB_METRICS_INTERVAL=${LB_METRICS_INTERVAL:-5}
      
      # Таймауты (секунды)
      - LB_REQUEST_TIMEOUT=${LB_REQUEST_TIMEOUT:-120}
      - LB_QUEUE_TIMEOUT=${LB_QUEUE_TIMEOUT:-300}
      - LB_QUEUE_MAX_SIZE=${LB_QUEUE_MAX_SIZE:-100}
      
      # Лимиты ресурсов
      - LB_GPU_MAX_USAGE=${LB_GPU_MAX_USAGE:-90}
      - LB_GPU_MAX_VRAM=${LB_GPU_MAX_VRAM:-85}
      - LB_GPU_MAX_TEMP=${LB_GPU_MAX_TEMP:-85}
      - LB_CPU_MAX_USAGE=${LB_CPU_MAX_USAGE:-80}
      - LB_MEMORY_MAX_USAGE=${LB_MEMORY_MAX_USAGE:-85}
      - LB_DISK_MIN_FREE_MB=${LB_DISK_MIN_FREE_MB:-10240}
      
      # Operating Mode: standard, replication, rpc_coordinator, virtual_router, distributed_inference
      # Если не указан — автоопределяется из enabled-флагов (D > C > B > A > standard)
      - LB_OPERATING_MODE=${LB_OPERATING_MODE:-}
      
      # --- RPC Model Distribution Modules ---
      # Вариант A: Model Replication Manager
      - LB_MODEL_REPLICATION_ENABLED=${LB_MODEL_REPLICATION_ENABLED:-false}
      - LB_MODEL_REPLICATION_MIN_INSTANCES=${LB_MODEL_REPLICATION_MIN_INSTANCES:-1}
      - LB_MODEL_REPLICATION_MAX_INSTANCES=${LB_MODEL_REPLICATION_MAX_INSTANCES:-3}
      - LB_MODEL_REPLICATION_IDLE_UNLOAD=${LB_MODEL_REPLICATION_IDLE_UNLOAD:-10m}
      # Вариант B: External RPC Coordinator
      - LB_RPC_COORDINATOR_ENABLED=${LB_RPC_COORDINATOR_ENABLED:-false}
      - LB_RPC_COORDINATOR_URL=${LB_RPC_COORDINATOR_URL:-}
      - LB_RPC_COORDINATOR_PORT=${LB_RPC_COORDINATOR_PORT:-18050}
      - LB_RPC_COORDINATOR_PROTOCOL=${LB_RPC_COORDINATOR_PROTOCOL:-http}
      - LB_RPC_COORDINATOR_TIMEOUT=${LB_RPC_COORDINATOR_TIMEOUT:-30s}
      # Вариант C: Virtual Model Router
      - LB_VIRTUAL_MODELS_ENABLED=${LB_VIRTUAL_MODELS_ENABLED:-false}
      - LB_VIRTUAL_MODELS_TIMEOUT=${LB_VIRTUAL_MODELS_TIMEOUT:-30000}
      - LB_VIRTUAL_MODELS_COORD_MODE=${LB_VIRTUAL_MODELS_COORD_MODE:-sequential}
      # Вариант D: Distributed Inference
      - LB_DIST_INFERENCE_ENABLED=${LB_DIST_INFERENCE_ENABLED:-false}
      - LB_DIST_INFERENCE_GRPC_PORT=${LB_DIST_INFERENCE_GRPC_PORT:-19000}

      # Логирование
      - LB_LOG_LEVEL=${LB_LOG_LEVEL:-info}
      - LB_LOG_FORMAT=${LB_LOG_FORMAT:-json}

      
      # Бэкенды (альтернатива конфигурационному файлу)
      # Раскомментируйте и настройте под свои серверы.
      # Агенты также могут регистрироваться автоматически через API.
      # - BACKEND_0_ID=${BACKEND_0_ID}
      # - BACKEND_0_NAME=${BACKEND_0_NAME}
      # - BACKEND_0_HOST=${BACKEND_0_HOST}
      # - BACKEND_0_PORT=${BACKEND_0_PORT:-11434}
      # - BACKEND_0_AGENT_PORT=${BACKEND_0_AGENT_PORT:-18032}
      # - BACKEND_0_WEIGHT=${BACKEND_0_WEIGHT:-1}
      # - BACKEND_0_MAX_REQS=${BACKEND_0_MAX_REQS:-10}
      # 
      # - BACKEND_1_ID=${BACKEND_1_ID}
      # - BACKEND_1_NAME=${BACKEND_1_NAME}
      # - BACKEND_1_HOST=${BACKEND_1_HOST}
      # - BACKEND_1_PORT=${BACKEND_1_PORT:-11434}
      # - BACKEND_1_AGENT_PORT=${BACKEND_1_AGENT_PORT:-18032}
      # - BACKEND_1_WEIGHT=${BACKEND_1_WEIGHT:-1}
      # - BACKEND_1_MAX_REQS=${BACKEND_1_MAX_REQS:-10}
    
    networks:
      - ollama-legion-net
    
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:18081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    labels:
      - "ollama-legion.role=balancer"

  # ============================================
  # Web UI (Dashboard)
  # ============================================
  webui:
    image: ollama-legion/webui:latest
    build:
      context: ..
      dockerfile: docker/webui/Dockerfile
    container_name: ollama-legion-webui
    restart: unless-stopped
    
    ports:
      - "${WEBUI_PORT:-18030}:80"
    
    networks:
      - ollama-legion-net
    
    depends_on:
      - loadbalancer
    
    environment:
      # Адрес и порт API балансировщика (внутри сети Docker)
      - API_HOST=${API_HOST:-loadbalancer}
      - API_PORT=${API_PORT:-18081}
      # Опциональный API токен
      - API_TOKEN=${API_TOKEN:-}
      # Интервал автообновления (мс)
      - REFRESH_INTERVAL=${REFRESH_INTERVAL:-5000}
      # WebSocket reconnect
      - MAX_RECONNECT_ATTEMPTS=${MAX_RECONNECT_ATTEMPTS:-10}
      - RECONNECT_INTERVAL_BASE=${RECONNECT_INTERVAL_BASE:-3000}
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    labels:
      - "ollama-legion.role=webui"

  # ============================================
  # Агент для GPU сервера (пример - закомментирован)
  # ============================================
  #
  # Агент должен запускаться НЕ в docker-compose балансировщика,
  # а отдельно на КАЖДОМ GPU сервере с Ollama.
  #
  # Пример запуска агента через Docker на GPU сервере:
  #
  #   docker run -d \
  #     --name ollama-agent \
  #     --restart unless-stopped \
  #     -e AGENT_ID=gpu-1 \
  #     -e BALANCER_URL=http://<BALANCER_IP>:18081 \
  #     -v /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro \
  #     -v /proc:/host/proc:ro \
  #     --network host \
  #     ollama-legion/agent:latest
  #
  # Для развертывания агента используйте скрипт:
  #   ../scripts/deploy-agent.sh <AGENT_ID> <BALANCER_URL>
  #
  # Или следуйте инструкциям в DEPLOYMENT.md
  #
  # ============================================
  # Пример конфигурации для локального тестирования агента:
  # ============================================
  # agent-local:
  #   image: ollama-legion/agent:latest
  #   build:
  #     context: ..
  #     dockerfile: docker/agent/Dockerfile
  #   container_name: ollama-legion-agent-local
  #   restart: unless-stopped
  #   ports:
  #     - "18032:18032"
  #   environment:
  #     - AGENT_ID=local-test
  #     - BALANCER_URL=http://loadbalancer:18081
  #     - COLLECT_INTERVAL=5
  #     - HEARTBEAT_INTERVAL=3
  #   # Для работы с GPU требуется NVIDIA Container Toolkit
  #   # volumes:
  #   #   - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
  #   #   - /proc:/host/proc:ro
  #   #   - /sys:/host/sys:ro
  #   # network_mode: "host"
  #   labels:
  #     - "ollama-legion.role=agent"

networks:
  ollama-legion-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Docker-managed volume для сохранения state.json между пересборками контейнера
volumes:
  ollama-legion-state:
