  <!-- F.γ (2026-06-28): session F — health-check UI page.
       Standalone страница, открывается через /health или прямой link.
       Не требует модификации app.js / index.html router — это простая
       diagnostic page поверх endpoint /api/v1/health/detailed.
       Auto-refresh каждые 5 сек; pause/play кнопка для удобства. -->
  <script>
    // R690 (2026-11-22): ТЕМ В ПАНЕЛИ СЕМЬ, А ЭТОТ СКРИПТ ЗНАЛ ДВЕ.
    //
    // ЖИВОЙ ДЕФЕКТ. Здесь стояло `if (stored === 'dark' || stored === 'light')`,
    // то есть при теме linear/nvidia/vercel/sentry/mint страница молча
    // открывалась в тёмной: `data-theme` не выставлялся вовсе, и дальше работал
    // системный prefers-color-scheme. Для отдельной вкладки это было «не так
    // красиво», но после R690 страница живёт ВНУТРИ панели (как монитор), где
    // расхождение оформления видно сразу — «чужое пятно» рядом с панелью
    // (ровно на этот класс дефекта указывает заголовок health-css-tokens.test.js).
    //
    // Теперь значение из localStorage применяется КАК ЕСТЬ: имена тем знает
    // css/themes.css, а список здесь дублировать не нужно — дубликат и разошёлся.
    (function() {
      try {
        var stored = localStorage.getItem('ollamalegion_theme');
        if (stored) {
          document.documentElement.setAttribute('data-theme', stored);
          return;
        }
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

    /* R514 (2026-11-19): рамки этой страницы НЕ РИСОВАЛИСЬ ВООБЩЕ.

       объявление, поэтому карточки, секции, разделители таблиц и кнопки были
       без границ. Заменено на `var(--border)` из themes.css.
       Сторож от этого класса дефекта - webui/tests/health-css-tokens.test.js:
       каждая переменная, которую использует страница, обязана быть определена
       в подключённых ею стилях. */
    /* F.γ-specific styles (inline чтобы не плодить css). */
    /* R695 (2026-11-23): РАЗМЕРЫ ШРИФТОВ — ТОЛЬКО ТОКЕНЫ, НИ ОДНОГО px.
       ЖИВОЙ ДЕФЕКТ. Плотность панели — это body[data-density] + переопределение
       --font-size-* в css/themes.css (-15 % у dense). Внутри iframe документ
       свой, и attr data-density сюда УЖЕ переносится (applyDensity ниже), но
       размер «32px» у оценки здоровья и 11-13px у подписей карточек,
       таблиц и строк ошибок жили ВНЕ шкалы: страница оставалась «обычной» по
       типографике на фоне плотной панели — тот же разъезд оформления, из-за
       которого R690 переносил тему и язык. Поэтому каждая подпись размера
       ссылается на шкалу --font-size-*, а сторож
       webui/tests/health-density-tokens-r695.test.js требует, чтобы px-размеров
       в этой странице не оставалось вовсе.
       СООТВЕТСТВИЕ ШКАЛЕ (normal → dense): xs 11→10, sm 13→12, base 14→13,
       md 16→14, 2xl 28→22, 3xl 36→28. Где значение не совпадало с шагом шкалы,
       выбран БЛИЖАЙШИЙ шаг того же смысла: оценка здоровья — как метрика
       дашборда (css/metrics.css:64, --font-size-3xl), заголовок страницы — как
       .header h1 самой панели (css/layout.css:274, --font-size-2xl), мелкие
       подписи — как весь остальной интерфейс (--font-size-xs). */
    .health-page { padding: 24px; max-width: 1400px; margin: 0 auto; }
    .health-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .health-header h1 { margin: 0; font-size: var(--font-size-2xl); display: flex; align-items: center; gap: 10px; }
    .health-header .actions { display: flex; gap: 8px; align-items: center; }
    .health-header .actions button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); cursor: pointer; font-size: var(--font-size-sm); }
    .health-header .actions button:hover { background: var(--bg-hover); }
    .health-header .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    .health-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .health-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .health-card .label { font-size: var(--font-size-xs); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

    .health-card .value.good { color: var(--success, #22c55e); }
    .health-card .value.warn { color: var(--warning, #f59e0b); }
    .health-card .value.bad { color: var(--danger, #ef4444); }
    .health-card .sub { font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 4px; }

    .health-status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: var(--font-size-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .health-status-badge.healthy { background: rgba(34,197,94,0.15); color: var(--success, #22c55e); }
    .health-status-badge.degraded { background: rgba(245,158,11,0.15); color: var(--warning, #f59e0b); }
    .health-status-badge.unhealthy { background: rgba(239,68,68,0.15); color: var(--danger, #ef4444); }
    .health-status-badge.empty { background: rgba(107,114,128,0.15); color: var(--text-secondary); }

    .health-score-bar { width: 100%; height: 8px; background: var(--bg-primary); border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .health-score-fill { height: 100%; transition: width 0.3s ease; }
    .health-score-fill.good { background: var(--success, #22c55e); }
    .health-score-fill.warn { background: var(--warning, #f59e0b); }
    .health-score-fill.bad { background: var(--danger, #ef4444); }

    .health-section h2 { margin: 0 0 16px 0; font-size: var(--font-size-md); display: flex; align-items: center; gap: 8px; }
    .health-section h2 .count { font-size: var(--font-size-xs); font-weight: 400; color: var(--text-secondary); }

    .health-table { width: 100%; border-collapse: collapse; }
    .health-table th, .health-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: var(--font-size-sm); }
    .health-table th { color: var(--text-secondary); font-weight: 600; text-transform: uppercase; font-size: var(--font-size-xs); letter-spacing: 0.5px; }
    .health-table td.mono { font-family: ui-monospace, "SF Mono", monospace; font-size: var(--font-size-xs); }
    .health-table tr:hover { background: var(--bg-hover); }

    .backend-status.healthy { background: rgba(34,197,94,0.15); color: var(--success, #22c55e); }
    .backend-status.degraded { background: rgba(245,158,11,0.15); color: var(--warning, #f59e0b); }
    .backend-status.unhealthy { background: rgba(239,68,68,0.15); color: var(--danger, #ef4444); }
    .backend-status.unknown { background: rgba(107,114,128,0.15); color: var(--text-secondary); }

    .error-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border); }
    .error-row:last-child { border-bottom: none; }
    .error-row .source-badge { flex: 0 0 90px; padding: 2px 8px; border-radius: 10px; font-size: var(--font-size-xs); font-weight: 600; text-align: center; }
    .error-row .source-badge.healthcheck { background: rgba(239,68,68,0.15); color: var(--danger, #ef4444); }

    .error-row .source-badge.event { background: rgba(107,114,128,0.15); color: var(--text-secondary); }
    .error-row .content { flex: 1; }
    .error-row .content .message { color: var(--text-primary); font-size: var(--font-size-sm); margin-bottom: 4px; }
    .error-row .content .meta { color: var(--text-secondary); font-size: var(--font-size-xs); }
    .error-row .content .meta span { margin-right: 12px; }
    .error-row .severity { flex: 0 0 70px; text-align: right; font-size: var(--font-size-xs); color: var(--text-secondary); }
    .error-row .severity .sev { display: inline-block; padding: 2px 6px; border-radius: 8px; font-weight: 600; }
    .error-row .severity .sev.warning { background: rgba(245,158,11,0.15); color: var(--warning, #f59e0b); }
    .error-row .severity .sev.error { background: rgba(239,68,68,0.15); color: var(--danger, #ef4444); }
    .error-row .severity .sev.critical { background: rgba(220,38,38,0.15); color: var(--danger, #ef4444); }
    .error-row .timestamp { flex: 0 0 100px; text-align: right; font-size: var(--font-size-xs); color: var(--text-secondary); }

    .empty-state { text-align: center; padding: 32px 16px; color: var(--text-secondary); font-size: var(--font-size-base); }
    .empty-state i { font-size: var(--font-size-3xl); margin-bottom: 12px; display: block; }

    .conn-status { font-size: var(--font-size-xs); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .conn-status .dot { width: 8px; height: 8px; border-radius: 50%; }
    .conn-status.connected .dot { background: var(--success, #22c55e); }
    .conn-status.disconnected .dot { background: var(--danger, #ef4444); }
    .conn-status.connecting .dot { background: var(--warning, #f59e0b); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  <div class="health-page">
    <div class="health-header">
      <h1>
        <i class="fas fa-heartbeat"></i>
        <span data-i18n="health.title">Cluster Health</span>
        <span id="statusBadge" class="health-status-badge healthy" data-i18n="health.status.healthy">healthy</span>
      </h1>
      <div class="actions">
        <div id="connStatus" class="conn-status connecting">
          <span class="dot"></span>
          <span id="connText" data-i18n="health.connecting">Connecting…</span>
        </div>
        <select id="intervalSelect" style="padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary)">
          <option value="2000">2s</option>
          <option value="5000" selected>5s</option>
          <option value="10000">10s</option>
          <option value="30000">30s</option>
        </select>
        <button id="pauseBtn" onclick="togglePause()" data-i18n="health.pause">⏸ Pause</button>
        <button id="refreshBtn" onclick="loadNow()" class="primary" data-i18n="health.refresh">🔄 Refresh</button>
        <a href="/" id="backLink" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);text-decoration:none;font-size:var(--font-size-sm)" data-i18n="health.back">← Dashboard</a>
        <!-- R60.14 (2026-09-07): language picker. health.html uses its own
             inline I18N system (line 122) so we wire onchange to I18N.setLang.
             Same ollamalegion_lang localStorage key — synced with index.html + monitor.html. -->
        <select class="lang-select" id="langSelect" title="Язык / Language" data-i18n-title="settings.language">
          <option value="ru">🇷🇺 RU</option>
          <option value="en">🇬🇧 EN</option>
        </select>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="health-cards">
      <div class="health-card">
        <div class="label" data-i18n="health.card.score">Health Score</div>
        <div id="healthScore" class="value good">100</div>
        <div class="health-score-bar"><div id="healthScoreFill" class="health-score-fill good" style="width:100%"></div></div>
      </div>
      <div class="health-card">
        <div class="label" data-i18n="health.card.total">Total Backends</div>
        <div id="totalBackends" class="value">0</div>
        <div class="sub"><span id="withAgent" data-i18n="health.card.agents">with agents</span></div>
      </div>
      <div class="health-card">
        <div class="label" data-i18n="health.card.healthy">Healthy</div>
        <div id="healthyBackends" class="value good">0</div>
        <div class="sub" id="healthySub"></div>
      </div>
      <div class="health-card">
        <div class="label" data-i18n="health.card.unhealthy">Unhealthy</div>
        <div id="unhealthyBackends" class="value">0</div>
        <div class="sub" id="unhealthySub"></div>
      </div>
      <div class="health-card">
        <div class="label" data-i18n="health.card.errors">Recent Errors</div>
        <div id="recentErrorsCount" class="value">0</div>
        <div class="sub" id="errorsBySource"></div>
      </div>
    </div>

    <!-- Backends section -->
    <div class="health-section">
      <h2>
        <i class="fas fa-server"></i>
        <span data-i18n="health.section.backends">Backends</span>
        <span id="backendsCount" class="count"></span>
      </h2>
      <div id="backendsContainer">
        <div class="empty-state"><i class="fas fa-server"></i><span data-i18n="health.loading">Loading…</span></div>
      </div>
    </div>

    <!-- Recent errors section -->
    <div class="health-section">
      <h2>
        <i class="fas fa-exclamation-triangle"></i>
        <span data-i18n="health.section.errors">Recent Errors</span>
        <span id="errorsCount" class="count"></span>
      </h2>
      <div id="errorsContainer">
        <div class="empty-state"><i class="fas fa-check-circle"></i><span data-i18n="health.no_errors">No recent errors. Cluster is operating normally.</span></div>
      </div>
    </div>
  </div>

  <!-- R690 (2026-11-22): цикл обновления вынесен в модуль ради проверяемости
       (см. комментарий в начале следующего скрипта). Грузится ПЕРЕД ним и без
       defer: скрипт страницы выполняет boot() сразу, если документ уже разобран,
       и ему нужен window.HealthPoll. ?v= — общий cache-токен сборки
       (docker/webui/Dockerfile заменяет его на хеш содержимого статики). -->
  <script src="js/modules/health-poll.js?v=R425"></script>
  <script>
  // F.γ (2026-06-28): session F — health page logic.
  // Auto-refresh + i18n + render HealthReport from /api/v1/health/detailed.

  (function() {
    'use strict';

    // Resolve API base (relative path works for both Docker & direct).
    var apiBase = ''; // same-origin
    var apiToken = ''; // set via WEBUI_CONFIG if needed
    try {
      if (window.WEBUI_CONFIG && window.WEBUI_CONFIG.API_BASE != null) {
        apiBase = window.WEBUI_CONFIG.API_BASE;
      }
      if (window.WEBUI_CONFIG && window.WEBUI_CONFIG.API_TOKEN) {
        apiToken = window.WEBUI_CONFIG.API_TOKEN;
      }
    } catch (e) { /* ignore */ }

    // R690 (2026-11-22): ЦИКЛ ОБНОВЛЕНИЯ — В ОТДЕЛЬНОМ МОДУЛЕ.
    //
    // Почему не здесь. health.html перестал быть отдельной вкладкой: он живёт в
    // iframe панели (как monitor.html с R238d/R493), поэтому у его 5-секундного
    // цикла появились правила: не работать, пока страница панели не открыта, не
    // молотить в скрытой вкладке, замолкать при истёкшей сессии и обновлять
    // данные СРАЗУ после возврата, а не через полный интервал. Это поведение, а
    // не разметка: проверять его регуляркой по HTML нельзя, поэтому логика
    // вынесена в js/modules/health-poll.js (её гоняет
    // webui/tests/health-spa-r690.test.js на подменённых таймерах).
    var poll = null;

    function t(key, fallback) {
      if (window.I18N && typeof window.I18N.t === 'function') {
        return window.I18N.t(key) || fallback || key;
      }
      return fallback || key;
    }

    function applyI18n(root) {
      // Lightweight data-i18n substitution for standalone page.
      root = root || document;
      var els = root.querySelectorAll('[data-i18n]');
      for (var i = 0; i < els.length; i++) {
        var key = els[i].getAttribute('data-i18n');
        var text = t(key, els[i].textContent);
        if (text) els[i].textContent = text;
      }
      // Кнопка паузы подписана СОСТОЯНИЕМ, а не атрибутом: после смены языка
      // data-i18n вернул бы «⏸ Pause» даже когда цикл на паузе.
      renderPauseButton();
    }

    // renderPauseButton — подпись кнопки по фактическому состоянию паузы.
    function renderPauseButton() {
      var btn = document.getElementById('pauseBtn');
      if (!btn) return;
      var userPaused = !!(poll && poll.isPausedBy('user'));
      // R690: БЕЗ своего префикса-иконки. В словаре строки уже с иконкой
      // («⏸ Пауза» / «⏸ Pause»), поэтому «'⏸ ' + перевод» давал в кнопке
      // «⏸ ⏸ Пауза» — тот же класс дефекта, что был у монитора (R18e).
      btn.textContent = userPaused
        ? t('health.resume', 'Resume')
        : t('health.pause', 'Pause');
    }

    // ---- Тема / язык / принадлежность панели (R690) -----------------------
    //
    // МЕХАНИЗМ ТОТ ЖЕ, ЧТО У МОНИТОРА, и это осознанно: изобретать третий канал
    // (событие через postMessage на каждую смену темы) значило бы, что панель
    // должна помнить про каждую страницу отдельно. Монитор получает тему так
    // (js/monitor/i18n-theme.js → syncTheme):
    //   1. читает localStorage ollamalegion_theme (страница-страница, прямая);
    //   2. читает data-theme РОДИТЕЛЬСКОГО документа — это и есть «тема панели»
    //      в момент загрузки (same-origin, поэтому доступно);
    //   3. слушает storage-событие: смена темы в панели пишется в localStorage и
    //      приходит сюда, хотя документ — другой.
    // Язык: атрибут lang родителя при загрузке, языковой пакет в
    // ollamalegion-config (его отправляет панель) и то же storage-событие.
    var THEME_ATTR = 'data-theme';

    function applyTheme(theme) {
      if (!theme) return false;
      try { document.documentElement.setAttribute(THEME_ATTR, String(theme)); } catch (e) { return false; }
      return true;
    }

    function applyLang(lang) {
      if (lang !== 'ru' && lang !== 'en') return false;
      if (window.I18N && typeof window.I18N.setLang === 'function') {
        // setLang обновляет живое свойство, <html lang> и localStorage — как
        // js/i18n/index.js (те же побочные эффекты, что у панели).
        window.I18N.setLang(lang);
      }
      applyI18n(document);
      return true;
    }

    // embedded — страница открыта В панели (iframe), а не по прямому URL.
    function embedded() {
      try { return !!(window.parent && window.parent !== window); } catch (e) { return false; }
    }

    // applyDensity — плотность интерфейса («обычная»/«плотная») из панели.
    //
    // ЗАЧЕМ. Плотность в панели — это АТРИБУТ body[data-density] и набор
    // токенов в css/themes.css: [data-density="dense"] уменьшает --font-size-*
    // и --space-* на 15 %. Внутри iframe это отдельный документ, поэтому без
    // переноса значения страница осталась бы «обычной» на фоне плотной панели —
    // тот же разъезд оформления, что был с темой. Источник у панели один:
    // localStorage ollamalegion_density (js/app-core.js → initDensity), плюс
    // атрибут на body родителя как факт текущего состояния.
    function applyDensity(density) {
      var d = (density === 'dense') ? 'dense' : 'normal';
      try { document.body.setAttribute('data-density', d); } catch (e) { return false; }
      return true;
    }

    function syncFromPanel() {
      // Класс нужен CSS: свой селектор языка и ссылка «← Dashboard» внутри
      // панели дублировали бы её собственное меню (тот же приём у монитора:
      // html.monitor-embedded в css/monitor-app.css).
      if (embedded()) {
        try { document.documentElement.classList.add('health-embedded'); } catch (e) {}
        try {
          var pd = window.parent.document.documentElement;
          var parentTheme = pd.getAttribute(THEME_ATTR);
          if (parentTheme) applyTheme(parentTheme);
          var parentLang = pd.getAttribute('lang');
          if (parentLang && parentLang !== (window.I18N && window.I18N.lang)) {
            applyLang(parentLang);
          }
          var parentDensity = window.parent.document.body &&
            window.parent.document.body.getAttribute('data-density');
          if (parentDensity) applyDensity(parentDensity);
        } catch (e) { /* другая origin — живём автономно, как отдельная страница */ }
      }
      // Прямой URL (и панель в другой вкладке): значение из localStorage.
      try {
        var savedTheme = localStorage.getItem('ollamalegion_theme');
        if (savedTheme) applyTheme(savedTheme);
        var savedLang = localStorage.getItem('ollamalegion_lang');
        if (savedLang && savedLang !== (window.I18N && window.I18N.lang)) applyLang(savedLang);
        var savedDensity = localStorage.getItem('ollamalegion_density');
        if (savedDensity) applyDensity(savedDensity);
      } catch (e) { /* приватный режим: остаёмся на теме из <head> */ }
    }

    // Смена темы/языка/плотности в панели приходит storage-событием (тот же
    // документ-предок пишет localStorage). Это и есть «страница меняет
    // оформление вместе с панелью» без опроса и без нового канала.
    window.addEventListener('storage', function (e) {
      if (!e) return;
      if (e.key === 'ollamalegion_theme' && e.newValue) applyTheme(e.newValue);
      if (e.key === 'ollamalegion_lang' && e.newValue) applyLang(e.newValue);
      if (e.key === 'ollamalegion_density' && e.newValue) applyDensity(e.newValue);
    });

    // ---- Контракт с панелью (те же типы сообщений, что у монитора) --------
    //
    // ollamalegion-pause  — {paused:true|false} пауза цикла (страница не видна,
    //                       вкладка скрыта, сессия истекла, авто на паузе);
    // ollamalegion-config — {apiBase, apiToken, lang} параметры панели;
    // ollamalegion-refresh — «обновись сейчас» (R695): кнопка «Обновить» в шапке
    //                       панели. НЕ на каждом тике панели, а ровно на клик.
    // Ровно этот набор панель отправляет монитору (sendMonitorConfig /
    // postMonitorPause): второго канала для «ещё одной страницы в iframe» нет.
    //
    // ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ. Панель НЕ дёргает страницу на каждом своём тике
    // (у монитора это делает провайдер DataRefresh 'monitor'): у «Состояния»
    // свой интервал, и второй запрос по тику панели означал бы опрос вдвое чаще,
    // чем выбрал оператор. Ручное обновление — кнопка на самой странице И
    // кнопка «Обновить» в шапке панели (R695): второе и есть ollamalegion-refresh,
    // которое панель шлёт ТОЛЬКО из обработчика клика (см. app-data.js →
    // postHealthRefresh), не из провайдера DataRefresh.
    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'ollamalegion-pause') {
        if (poll) poll.setPaused('remote', !!d.paused);
        return;
      }
      if (d.type === 'ollamalegion-refresh') {
        refreshFromPanel();
        return;
      }
      if (d.type === 'ollamalegion-config') {
        // Пустые значения НЕ затирают автономные: панель может прислать apiBase
        // пустым (nginx сам проксирует /api), тогда работаем по своей логике.
        if (d.apiBase) apiBase = String(d.apiBase).replace(/\/+$/, '');
        if (d.apiToken !== undefined) apiToken = d.apiToken || '';
        if (d.lang) applyLang(d.lang);
      }
    });

    // Скрытая вкладка — своя, ЛОКАЛЬНАЯ причина: панель может быть не активна, а
    // браузер всё равно рисует вкладку в фоне. Повод отдельный от 'remote',
    // иначе возврат вкладки включал бы цикл на странице, с которой ушли.
    document.addEventListener('visibilitychange', function () {
      if (poll) poll.setPaused('hidden', document.visibilityState === 'hidden');
    });

    // R60.14 (2026-09-07): wire up #langSelect for health.html standalone
    // (uses inline I18N, not window.I18N.setLang). On change, update
    // inline I18N dict and re-apply to all data-i18n elements.
    // R690: внутри панели селектор скрыт (html.health-embedded) — язык там один
    // на всё приложение, и приходит он из панели (см. syncFromPanel/applyLang).
    (function() {
      var sel = document.getElementById('langSelect');
      if (!sel) return;
      // Sync initial value from localStorage (or current I18N.lang)
      try {
        var saved = localStorage.getItem('ollamalegion_lang');
        if (saved === 'ru' || saved === 'en') sel.value = saved;
        else if (window.I18N && window.I18N.lang) sel.value = window.I18N.lang;
      } catch (e) {}
      sel.addEventListener('change', function() {
        var l = this.value;
        if (l !== 'ru' && l !== 'en') return;
        applyLang(l);
      });
    })();

    function fmtTime(iso) {
      if (!iso) return '—';
      try {
        var d = new Date(iso);
        var now = new Date();
        var diffSec = Math.floor((now - d) / 1000);
        if (diffSec < 5) return t('health.time.just_now', 'just now');
        if (diffSec < 60) return diffSec + 's ' + t('health.time.ago', 'ago');
        if (diffSec < 3600) return Math.floor(diffSec / 60) + 'm ' + t('health.time.ago', 'ago');
        if (diffSec < 86400) return Math.floor(diffSec / 3600) + 'h ' + t('health.time.ago', 'ago');
        return d.toLocaleString();
      } catch (e) {
        return iso;
      }
    }

    function fmtLatency(ms) {
      if (ms == null || ms === 0) return '—';
      if (ms < 1) return '<1ms';
      if (ms < 1000) return ms.toFixed(0) + 'ms';
      return (ms / 1000).toFixed(2) + 's';
    }

    function setConnStatus(state) {
      var el = document.getElementById('connStatus');
      var txt = document.getElementById('connText');
      el.className = 'conn-status ' + state;
      if (state === 'connected') txt.textContent = t('health.connected', 'Connected');
      else if (state === 'disconnected') txt.textContent = t('health.disconnected', 'Disconnected');
      else txt.textContent = t('health.connecting', 'Connecting…');
    }

    function renderReport(report) {
      if (!report) return;

      // Status badge
      var badge = document.getElementById('statusBadge');
      badge.className = 'health-status-badge ' + report.status;
      badge.textContent = t('health.status.' + report.status, report.status);

      // Health score
      var scoreEl = document.getElementById('healthScore');
      var fillEl = document.getElementById('healthScoreFill');
      var score = report.healthScore;
      var scoreClass = 'good';
      if (score < 50) scoreClass = 'bad';
      else if (score < 80) scoreClass = 'warn';
      scoreEl.className = 'value ' + scoreClass;
      scoreEl.textContent = score;
      fillEl.className = 'health-score-fill ' + scoreClass;
      fillEl.style.width = score + '%';

      // Cards
      document.getElementById('totalBackends').textContent = report.totalBackends;
      document.getElementById('healthyBackends').textContent = report.healthyBackends;
      document.getElementById('unhealthyBackends').textContent = report.unhealthyBackends;
      document.getElementById('recentErrorsCount').textContent = report.recentErrors ? report.recentErrors.length : 0;

      var healthyPct = report.totalBackends > 0 ? Math.floor(report.healthyBackends * 100 / report.totalBackends) : 0;
      document.getElementById('healthySub').textContent = healthyPct + '% ' + t('health.card.healthy_pct', 'of total');
      document.getElementById('unhealthySub').textContent = (report.totalBackends - report.healthyBackends) + ' ' + t('health.card.unhealthy_pct', 'down');
      document.getElementById('withAgent').textContent = (report.withAgent || 0) + ' ' + t('health.card.with_agents', 'with agents');

      // Errors by source
      var ebs = report.errorsBySource || {};
      var parts = [];
      if (ebs.transport) parts.push(ebs.transport + ' transport');
      if (ebs.healthcheck) parts.push(ebs.healthcheck + ' healthcheck');
      if (ebs.event) parts.push(ebs.event + ' event');
      document.getElementById('errorsBySource').textContent = parts.length > 0
        ? parts.join(' · ')
        : t('health.no_errors', 'No recent errors');

      // Backends
      renderBackends(report.backends || []);

      // Errors
      renderErrors(report.recentErrors || []);

      // Counts in section headers
      document.getElementById('backendsCount').textContent = '(' + (report.backends ? report.backends.length : 0) + ')';
      document.getElementById('errorsCount').textContent = '(' + (report.recentErrors ? report.recentErrors.length : 0) + ')';
    }

    function renderBackends(backends) {
      var container = document.getElementById('backendsContainer');
      if (backends.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-server"></i>' + t('health.no_backends', 'No backends registered') + '</div>';
        return;
      }
      var rows = [];
      rows.push('<table class="health-table"><thead><tr>');
      rows.push('<th data-i18n="health.col.id">ID</th>');
      rows.push('<th data-i18n="health.col.host">Host:Port</th>');
      rows.push('<th data-i18n="health.col.type">Type</th>');
      rows.push('<th data-i18n="health.col.status">Status</th>');
      rows.push('<th data-i18n="health.col.latency">Avg Latency</th>');
      rows.push('<th data-i18n="health.col.fails">Fails</th>');
      rows.push('<th data-i18n="health.col.agent">Agent</th>');
      rows.push('<th data-i18n="health.col.last_error">Last Error</th>');
      rows.push('</tr></thead><tbody>');
      for (var i = 0; i < backends.length; i++) {
        var b = backends[i];
        var host = b.host || '—';
        var port = b.ollamaPort || b.cppWorkerPort || 0;
        var hostPort = port > 0 ? host + ':' + port : host;
        rows.push('<tr>');
        rows.push('<td class="mono">' + escapeHtml(b.id) + '</td>');
        rows.push('<td class="mono">' + escapeHtml(hostPort) + '</td>');
        rows.push('<td>' + escapeHtml(b.backendType || '—') + '</td>');
        rows.push('<td><span class="backend-status ' + b.status + '">' + escapeHtml(b.status) + '</span></td>');
        rows.push('<td>' + fmtLatency(b.avgLatencyMs) + '</td>');
        rows.push('<td>' + (b.consecutiveFails || 0) + '</td>');
        rows.push('<td>' + (b.hasAgent ? '✓' : '—') + '</td>');
        rows.push('<td style="color:var(--text-secondary);font-size:var(--font-size-xs);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(b.lastError || '') + '">' + escapeHtml(b.lastError || '—') + '</td>');
        rows.push('</tr>');
      }
      rows.push('</tbody></table>');
      container.innerHTML = rows.join('');
      applyI18n(container);
    }

    function renderErrors(errors) {
      var container = document.getElementById('errorsContainer');
      if (errors.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-check-circle"></i>' + t('health.no_errors', 'No recent errors. Cluster is operating normally.') + '</div>';
        return;
      }
      var html = [];
      for (var i = 0; i < Math.min(errors.length, 50); i++) {
        var e = errors[i];
        var sev = e.severity || 'error';
        html.push('<div class="error-row">');
        html.push('<div class="source-badge ' + e.source + '">' + escapeHtml(e.source) + '</div>');
        html.push('<div class="content">');
        html.push('<div class="message">' + escapeHtml(e.message) + '</div>');
        html.push('<div class="meta">');
        if (e.backendId) html.push('<span><i class="fas fa-server"></i> ' + escapeHtml(e.backendId) + '</span>');
        if (e.model) html.push('<span><i class="fas fa-brain"></i> ' + escapeHtml(e.model) + '</span>');
        if (e.path) html.push('<span><i class="fas fa-route"></i> ' + escapeHtml(e.path) + '</span>');
        html.push('</div>');
        html.push('</div>');
        html.push('<div class="severity"><span class="sev ' + sev + '">' + escapeHtml(sev) + '</span></div>');
        html.push('<div class="timestamp">' + fmtTime(e.timestamp) + '</div>');
        html.push('</div>');
      }
      container.innerHTML = html.join('');
    }

    // F.γ escapeHtml: правильное HTML-escape (важно для безопасности и валидности разметки).
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ---- «Обновись сейчас» из панели (R695) -------------------------------
    //
    // ЗАЧЕМ СЧЁТЧИКИ. Требование к кнопке «Обновить» в шапке — РОВНО ОДИН
    // немедленный запрос /api/v1/health/detailed и ни одного второго таймера.
    // Проверить это глазами нельзя (запросы идут в фоне), поэтому страница
    // считает принятые и отброшенные как дубль сообщения и отдаёт их наружу
    // (`window.healthRefreshStats` рядом с `window.healthPoll.stats()`) — по ним
    // живой замер и тест видят, что произошло на самом деле.
    //
    // ДВА ПРИЗНАКА ДУБЛЯ, оба независимы:
    //   1) запрос УЖЕ ИДЁТ (loadInFlight) — второй не нужен, данные те же;
    //   2) повтор в пределах REFRESH_DEDUP_MS — панель может отправить сообщение
    //      дважды (клик + последующий проход обновления страницы), а запрос,
    //      завершившийся за миллисекунды, не оставляет окна «в полёте».
    // Без этого refreshNow() на каждое сообщение снимал бы таймер и ставил новый:
    // интервал 5 с превращался бы в «5 с от последнего дубля», а на каждый клик
    // уходило бы по два запроса.
    var REFRESH_DEDUP_MS = 400;
    var lastRefreshAt = 0;
    var loadInFlight = false;
    var refreshAccepted = 0;
    var refreshSkipped = 0;

    function refreshFromPanel() {
      var now = Date.now();
      if (loadInFlight || (lastRefreshAt && (now - lastRefreshAt) < REFRESH_DEDUP_MS)) {
        refreshSkipped++;
        return false;
      }
      lastRefreshAt = now;
      refreshAccepted++;
      if (poll) {
        // refreshNow() — существующий контракт цикла: снять текущий таймер,
        // сделать запрос СРАЗУ и поставить ОДИН новый (js/modules/health-poll.js:157).
        poll.refreshNow();
      } else {
        // Модуля цикла нет (страница без health-poll.js): данные всё равно
        // обновляем, иначе кнопка мочала бы молча.
        loadNow();
      }
      return true;
    }

    function loadNow() {
      var url = apiBase + '/api/v1/health/detailed';
      var headers = {};
      if (apiToken) headers['X-API-Token'] = apiToken;
      var done = function (value) { loadInFlight = false; return value; };
      loadInFlight = true;
      return fetch(url, { headers: headers, cache: 'no-store' })
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(report) {
          setConnStatus('connected');
          renderReport(report);
          return done(report);
        })
        .catch(function(err) {
          setConnStatus('disconnected');
          console.error('health fetch failed', err);
          var txt = document.getElementById('connText');
          if (txt) txt.textContent = t('health.error', 'Error: ') + err.message;
          return done(null);
        });
    }

    // currentInterval — интервал из селектора страницы (2/5/10/30 с). Цикл
    // спрашивает его ПЕРЕД каждой постановкой таймера, поэтому смена значения
    // применяется сама, без перезагрузки страницы.
    function currentInterval() {
      var sel = document.getElementById('intervalSelect');
      var ms = sel ? parseInt(sel.value, 10) : 0;
      return ms > 0 ? ms : 5000;
    }

    window.loadNow = loadNow;
    // Диагностический якорь R695: сколько сообщений «обновись сейчас» принято,
    // сколько отброшено как дубль и идёт ли запрос прямо сейчас. Рядом с
    // window.healthPoll.stats() (цикл) он и есть доказательство «один клик = один
    // запрос, второго таймера нет».
    window.healthRefreshStats = function () {
      return {
        accepted: refreshAccepted,
        skipped: refreshSkipped,
        inFlight: loadInFlight,
        lastAt: lastRefreshAt,
        dedupMs: REFRESH_DEDUP_MS
      };
    };
    window.togglePause = function() {
      if (!poll) return;
      // Локальный повод 'user': пауза оператора не снимается сообщением панели.
      poll.setPaused('user', !poll.isPausedBy('user'));
      renderPauseButton();
    };

    /**
     * boot — создать цикл и загрузить первую порцию данных.
     *
     * Первый запрос делает boot, а не цикл: иначе первое открытие страницы давало
     * бы два запроса подряд (свой + «на снятии паузы», см. health-poll.js).
     */
    function boot() {
      syncFromPanel();
      applyI18n(document);
      if (window.HealthPoll && typeof window.HealthPoll.create === 'function') {
        poll = window.HealthPoll.create({
          load: loadNow,
          interval: currentInterval
        });
        // Диагностический якорь (как _state/_providers у data-refresh.js): по нему
        // видно, ПОЧЕМУ цикл молчит прямо сейчас — 'remote' (ушли со страницы
        // панели), 'hidden' (вкладка скрыта), 'auth' или 'user'. Без этого
        // «запросов нет» неотличимо от «цикл умер».
        window.healthPoll = poll;
      } else {
        // Без модуля страница обязана остаться рабочей: данные загрузим, но
        // цикла не будет. Молча — значит «через час никто не заметит», поэтому
        // это ошибка в консоли, а не тишина.
        console.error('health.html: нет js/modules/health-poll.js — автообновление выключено');
      }
      loadNow();
      if (poll) poll.start();
    }

    // Boot
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
  </script>
